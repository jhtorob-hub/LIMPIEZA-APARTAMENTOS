<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const { BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer } = Recharts;

firebase.initializeApp({
  apiKey: "AIzaSyDBSqHoAc_qDQQhrOmDtdcZ7ZyyPbXv5Sg",
  authDomain: "lavanderia-limpieza.firebaseapp.com",
  projectId: "lavanderia-limpieza",
  storageBucket: "lavanderia-limpieza.firebasestorage.app",
  messagingSenderId: "229695150868",
  appId: "1:229695150868:web:082157b403bcef987b8001"
});
const db = firebase.firestore();

const MONTHS = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const COLORS = ["#16a34a","#2563eb","#d97706","#dc2626","#7c3aed","#0891b2","#be185d"];
const G="#16a34a", R="#dc2626", B="#2563eb", O="#d97706", PU="#7c3aed";
const PASS = "admin2024";

const DEF_APTS = [
  {name:"201 LAURELES",client:"TCG",valor:0},{name:"302 LAURELES",client:"TCG",valor:0},
  {name:"303 LAURELES",client:"TCG",valor:0},{name:"303 MONSERRATE",client:"TCG",valor:0},
  {name:"306",client:"ROMULO",valor:0},{name:"308 BASELOFT",client:"DIEGO CAMACHO",valor:0},
  {name:"311",client:"ADRIANA",valor:0},{name:"405",client:"ROMULO",valor:0},
  {name:"501 AVENIDA DEL CERRO",client:"ALEJANDRA",valor:0},{name:"501",client:"TCG",valor:0},
  {name:"503 BASELOFT",client:"TCG",valor:0},{name:"510",client:"BASELOFT",valor:0},
  {name:"712",client:"RUFFGO",valor:0},{name:"810",client:"ADRIANA",valor:0},
  {name:"1003",client:"TCG",valor:0},{name:"1103",client:"TCG",valor:0},
  {name:"1305",client:"TCG",valor:0},{name:"1402",client:"TCG",valor:0},
  {name:"1405",client:"TCG",valor:0},{name:"1703",client:"TCG",valor:0},
  {name:"1802",client:"TCG",valor:0},{name:"2105",client:"TCG",valor:0},
  {name:"2204",client:"LIGIA",valor:0},{name:"2404",client:"ALEJA",valor:0},
  {name:"2505",client:"TCG",valor:0},{name:"2701",client:"TCG",valor:0},
];
const DEF_WORKERS = ["Maria Garcia","Juan Lopez","Ana Martinez","Pedro Rodriguez","Laura Gomez"];

// Firestore
async function fsGet(col, id) {
  try { const r = await db.collection(col).doc(id).get(); return r.exists ? {id:r.id,...r.data()} : null; } catch(e) { return null; }
}
async function fsSet(col, id, data) {
  try { await db.collection(col).doc(id).set(data, {merge:true}); } catch(e) {}
}
async function fsAdd(col, data) {
  try { const r = await db.collection(col).add(data); return {id:r.id}; } catch(e) { return null; }
}
async function fsList(col) {
  try { const r = await db.collection(col).orderBy("startTime","desc").limit(500).get(); return r.docs.map(d=>({id:d.id,...d.data()})); } catch(e) { return []; }
}
async function fsPatch(col, id, data) {
  try { await db.collection(col).doc(id).update(data); } catch(e) {}
}

// Utils
const fmt = s => [Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(x=>String(x).padStart(2,"0")).join(":");
const fmtDate = d => new Date(d).toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"});
const fmtHour = d => new Date(d).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"});
const nowTime = () => new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
const pesos = v => "$"+Number(v||0).toLocaleString("es-CO");
const aptLabel = a => a ? a.name+" ("+a.client+")" : "";
const toDate = t => t && t.toDate ? t.toDate() : (t ? new Date(t) : new Date());

// UI
const Card = ({children,style={}}) => <div style={{background:"white",borderRadius:14,padding:16,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,.08)",...style}}>{children}</div>;
const Btn = ({children,bg=G,onClick,style={}}) => <button onClick={onClick} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,width:"100%",padding:"12px 16px",border:"none",borderRadius:10,fontSize:15,fontWeight:700,cursor:"pointer",marginTop:8,color:"white",background:bg,...style}}>{children}</button>;
const Lbl = ({t}) => <div style={{fontSize:12,color:"#6b7280",fontWeight:700,letterSpacing:".05em",marginBottom:6}}>{t}</div>;
const Inp = ({style={},...p}) => <input style={{width:"100%",padding:"11px 12px",borderRadius:9,border:"1px solid #e5e7eb",fontSize:15,background:"white",marginBottom:8,...style}} {...p}/>;
const Sel = ({val,onChange,style={},children}) => <select value={val} onChange={e=>onChange(e.target.value)} style={{width:"100%",padding:"11px 12px",borderRadius:9,border:"1px solid #e5e7eb",fontSize:15,background:"white",marginBottom:8,...style}}>{children}</select>;
const StatBox = ({val,lbl,color,sub}) => <div style={{background:"white",borderRadius:12,padding:12,textAlign:"center",boxShadow:"0 1px 3px rgba(0,0,0,.07)"}}><div style={{fontWeight:900,color,fontSize:18,lineHeight:1.2}}>{val}</div><div style={{fontSize:11,color:"#6b7280",fontWeight:700,marginTop:2}}>{lbl}</div>{sub&&<div style={{fontSize:10,color:"#9ca3af",marginTop:2,fontWeight:600}}>{sub}</div>}</div>;

function NovList({list=[]}) {
  return <div>{list.map((n,i)=><div key={i} style={{background:"#dcfce7",borderRadius:9,padding:"9px 12px",marginBottom:6,borderLeft:"3px solid "+G}}><div style={{fontSize:12,color:G,fontWeight:600,marginBottom:2}}>{n.time}</div><div style={{fontSize:14}}>{n.text}</div></div>)}</div>;
}
function MediaGrid({items=[]}) {
  if (!items.length) return null;
  return <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6,marginTop:10}}>{items.map((it,i)=><div key={i} style={{borderRadius:9,overflow:"hidden",aspectRatio:"1",background:"#f3f4f6"}}>{it.isVideo?<video src={it.url} style={{width:"100%",height:"100%",objectFit:"cover"}} controls/>:<img src={it.url} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>}</div>)}</div>;
}
function MediaBtns({onV,onP,vc=B,pc=B}) {
  return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
    <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"11px 8px",background:vc,color:"white",borderRadius:10,fontSize:13,fontWeight:700,cursor:"pointer"}}>🎥 Video<input type="file" accept="video/*" capture="environment" multiple style={{display:"none"}} onChange={onV}/></label>
    <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:"11px 8px",background:"white",color:pc,border:"2px solid "+pc,borderRadius:10,fontSize:13,fontWeight:700,cursor:"pointer"}}>📸 Foto<input type="file" accept="image/*" capture="environment" multiple style={{display:"none"}} onChange={onP}/></label>
  </div>;
}

function App() {
  const [screen,setScreen] = useState("loading");
  const [worker,setWorker] = useState("");
  const [selApt,setSelApt] = useState(null);
  const [aptList,setAptList] = useState(DEF_APTS);
  const [workerList,setWorkerList] = useState(DEF_WORKERS);
  const [elapsed,setElapsed] = useState(0);
  const [novedades,setNovedades] = useState([]);
  const [entryMedia,setEntryMedia] = useState([]);
  const [danosMedia,setDanosMedia] = useState([]);
  const [exitMedia,setExitMedia] = useState([]);
  const [showModal,setShowModal] = useState(false);
  const [showNov,setShowNov] = useState(false);
  const [novDraft,setNovDraft] = useState("");
  const [lastRec,setLastRec] = useState(null);
  const [adminRecs,setAdminRecs] = useState([]);
  const [allRecs,setAllRecs] = useState([]);
  const [adminPass,setAdminPass] = useState("");
  const [adminError,setAdminError] = useState("");
  const [fDate,setFDate] = useState("");
  const [fWorker,setFWorker] = useState("");
  const [fApt,setFApt] = useState("");
  const [sTab,setSTab] = useState("apts");
  const [aptForm,setAptForm] = useState({name:"",client:"",valor:0});
  const [editIdx,setEditIdx] = useState(-1);
  const [newWorker,setNewWorker] = useState("");
  const [dashLoading,setDashLoading] = useState(false);
  const [dashFrom,setDashFrom] = useState(()=>{const d=new Date();d.setDate(1);return d.toISOString().slice(0,10);});
  const [dashTo,setDashTo] = useState(new Date().toISOString().slice(0,10));
  const sessRef = useRef(null);
  const timerRef = useRef(null);
  const pollRef = useRef(null);

  useEffect(()=>{loadConfig();return()=>{clearInterval(timerRef.current);clearInterval(pollRef.current);};},[]);

  async function loadConfig() {
    const a = await fsGet("config","apartamentos");
    if (a?.list?.length) { if (typeof a.list[0]==="string") setAptList(DEF_APTS); else setAptList(a.list); }
    const w = await fsGet("config","trabajadores");
    if (w?.list?.length) setWorkerList(w.list);
    setScreen("home");
  }
  async function saveApts(list) { setAptList(list); await fsSet("config","apartamentos",{list}); }
  async function saveWorkers(list) { setWorkerList(list); await fsSet("config","trabajadores",{list}); }

  function readFiles(files,setter) {
    Array.from(files).forEach(f=>{const rd=new FileReader();rd.onload=e=>setter(p=>[...p,{url:e.target.result,isVideo:f.type.startsWith("video")}]);rd.readAsDataURL(f);});
  }

  async function startCleaning() {
    if (!worker||!selApt) return;
    const startTime = new Date();
    setElapsed(0);setNovedades([]);setEntryMedia([]);setDanosMedia([]);setExitMedia([]);
    setShowModal(false);setShowNov(false);setNovDraft("");
    setScreen("active");
    const doc = await fsAdd("limpiezas",{worker,apt:aptLabel(selApt),client:selApt.client,valor:selApt.valor||0,startTime:firebase.firestore.Timestamp.fromDate(startTime),status:"active",novedades:[],entryCount:0,danosCount:0,exitCount:0,duration:0});
    sessRef.current = {id:doc?.id,worker,apt:selApt,startTime};
    clearInterval(timerRef.current);
    timerRef.current = setInterval(()=>setElapsed(e=>e+1),1000);
  }

  function addNov() {
    if (!novDraft.trim()) return;
    const n = {text:novDraft.trim(),time:nowTime()};
    const u = [...novedades,n];
    setNovedades(u);setNovDraft("");setShowNov(false);
    if (sessRef.current?.id) fsPatch("limpiezas",sessRef.current.id,{novedades:u});
  }

  async function finalizarLimpieza() {
    clearInterval(timerRef.current);
    const endTime = new Date();
    const aptObj = sessRef.current?.apt||selApt;
    if (sessRef.current?.id) {
      await fsPatch("limpiezas",sessRef.current.id,{status:"completed",endTime:firebase.firestore.Timestamp.fromDate(endTime),duration:elapsed,novedades,entryCount:entryMedia.length,danosCount:danosMedia.length,exitCount:exitMedia.length});
    }
    setLastRec({worker:sessRef.current?.worker||worker,apt:aptLabel(aptObj),client:aptObj?.client,valor:aptObj?.valor||0,startTime:sessRef.current?.startTime,endTime,duration:elapsed,novedades,entryCount:entryMedia.length,danosCount:danosMedia.length,exitCount:exitMedia.length});
    setShowModal(false);setScreen("summary");
  }

  function goHome() {
    clearInterval(timerRef.current);sessRef.current=null;
    setScreen("home");setWorker("");setSelApt(null);setElapsed(0);
    setNovedades([]);setEntryMedia([]);setDanosMedia([]);setExitMedia([]);
  }

  async function enterAdmin() {
    if (adminPass!==PASS){setAdminError("Contrasena incorrecta");return;}
    setAdminError("");setScreen("admin");
    await fetchRecs();
    clearInterval(pollRef.current);
    pollRef.current=setInterval(fetchRecs,10000);
  }

  async function fetchRecs() {
    const docs = await fsList("limpiezas");
    setAdminRecs(docs);setAllRecs(docs);
  }

  async function fetchAllForDash() {
    setDashLoading(true);
    const docs = await fsList("limpiezas");
    setAllRecs(docs);setDashLoading(false);
  }

  function leaveAdmin(){clearInterval(pollRef.current);setScreen("home");}

  async function saveAptForm() {
    if (!aptForm.name.trim()) return;
    const a={name:aptForm.name.trim().toUpperCase(),client:aptForm.client.trim().toUpperCase(),valor:Number(aptForm.valor)||0};
    if (editIdx===-2) await saveApts([...aptList,a]);
    else await saveApts(aptList.map((x,i)=>i===editIdx?a:x));
    setEditIdx(-1);
  }

  function getDashData() {
    const from=dashFrom?new Date(dashFrom+" 00:00:00"):null;
    const to=dashTo?new Date(dashTo+" 23:59:59"):null;
    const completed=allRecs.filter(r=>{
      if(r.status!=="completed")return false;
      const d=toDate(r.endTime||r.startTime);
      if(from&&d<from)return false;
      if(to&&d>to)return false;
      return true;
    });
    const byClient={};
    completed.forEach(r=>{
      const c=r.client||"Sin cliente";
      if(!byClient[c])byClient[c]={client:c,count:0,valor:0,dur:0};
      byClient[c].count++;byClient[c].valor+=r.valor||0;byClient[c].dur+=r.duration||0;
    });
    const clients=Object.values(byClient).sort((a,b)=>b.count-a.count);
    const now=new Date();
    const months=Array.from({length:6},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-(5-i),1);return{label:MONTHS[d.getMonth()]+" "+String(d.getFullYear()).slice(2),year:d.getFullYear(),month:d.getMonth(),count:0,valor:0};});
    allRecs.filter(r=>r.status==="completed").forEach(r=>{
      const d=toDate(r.endTime||r.startTime);
      const m=months.find(x=>x.year===d.getFullYear()&&x.month===d.getMonth());
      if(m){m.count++;m.valor+=r.valor||0;}
    });
    const totalValor=completed.reduce((a,r)=>a+(r.valor||0),0);
    const totalCount=completed.length;
    const avgDur=totalCount?Math.round(completed.reduce((a,r)=>a+(r.duration||0),0)/totalCount):0;
    const cm=now.getMonth(),cy=now.getFullYear(),pm=cm===0?11:cm-1,py=cm===0?cy-1:cy;
    const curD=allRecs.filter(r=>{if(r.status!=="completed")return false;const d=toDate(r.endTime||r.startTime);return d.getMonth()===cm&&d.getFullYear()===cy;});
    const prevD=allRecs.filter(r=>{if(r.status!=="completed")return false;const d=toDate(r.endTime||r.startTime);return d.getMonth()===pm&&d.getFullYear()===py;});
    return{completed,clients,months,totalValor,totalCount,avgDur,curD,prevD};
  }

  const wrap={maxWidth:480,margin:"0 auto",padding:16,minHeight:"100vh",paddingBottom:48,fontFamily:"system-ui,sans-serif",background:"#f9fafb"};

  if (screen==="loading") return <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",fontSize:52}}>🧹</div>;

  if (screen==="home") return (
    <div style={wrap}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",padding:"20px 0 12px"}}>
        <div><div style={{fontSize:36}}>🧹</div><h1 style={{fontSize:22,fontWeight:800,color:"#111827",margin:"6px 0 2px"}}>Control de Limpieza</h1><p style={{color:"#6b7280",fontSize:13}}>Gestion de apartamentos</p></div>
        <button onClick={()=>setScreen("settings")} style={{background:"white",border:"1px solid #e5e7eb",borderRadius:10,padding:"8px 14px",cursor:"pointer",fontSize:14,fontWeight:700,marginTop:8}}>⚙️ Gestion</button>
      </div>
      <Card>
        <Lbl t="TRABAJADOR"/>
        <Sel val={worker} onChange={setWorker}><option value="">Seleccionar trabajador...</option>{workerList.map(w=><option key={w}>{w}</option>)}</Sel>
        <Lbl t="APARTAMENTO"/>
        <Sel val={selApt?aptLabel(selApt):""} onChange={v=>{const a=aptList.find(x=>aptLabel(x)===v);setSelApt(a||null);}}>
          <option value="">Seleccionar apartamento...</option>
          {[...aptList].sort((a,b)=>a.name.localeCompare(b.name)).map(a=><option key={a.name} value={aptLabel(a)}>{aptLabel(a)}{a.valor>0?" · "+pesos(a.valor):""}</option>)}
        </Sel>
        {selApt&&<div style={{background:"#f0fdf4",borderRadius:9,padding:"10px 12px",marginBottom:8,display:"flex",justifyContent:"space-between"}}>
          <span style={{color:G,fontWeight:700,fontSize:13}}>Cliente: {selApt.client||"Sin asignar"}</span>
          {selApt.valor>0&&<span style={{color:PU,fontWeight:700,fontSize:13}}>{pesos(selApt.valor)}</span>}
        </div>}
        <Btn bg={worker&&selApt?G:"#9ca3af"} onClick={startCleaning} style={{fontSize:16,padding:14,marginTop:4}}>▶ Iniciar Limpieza</Btn>
      </Card>
      <Btn bg={B} onClick={()=>setScreen("adminLogin")} style={{marginTop:0}}>👨‍💼 Panel de Administrador</Btn>
    </div>
  );

  if (screen==="settings") {
    const isApts=sTab==="apts";
    return (
      <div style={wrap}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <button onClick={()=>setScreen("home")} style={{background:"white",border:"1px solid #e5e7eb",borderRadius:9,padding:"6px 14px",cursor:"pointer",fontWeight:700,fontSize:14}}>← Volver</button>
          <div><h2 style={{fontSize:19,color:"#111827"}}>⚙️ Gestion</h2><p style={{fontSize:12,color:"#6b7280"}}>Apartamentos y trabajadores</p></div>
        </div>
        <div style={{display:"flex",gap:4,marginBottom:16,background:"white",borderRadius:12,padding:4,boxShadow:"0 1px 3px rgba(0,0,0,.08)"}}>
          <button onClick={()=>setSTab("apts")} style={{flex:1,padding:9,border:"none",borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer",background:isApts?G:"transparent",color:isApts?"white":"#6b7280"}}>🏠 Apts ({aptList.length})</button>
          <button onClick={()=>setSTab("workers")} style={{flex:1,padding:9,border:"none",borderRadius:9,fontSize:13,fontWeight:700,cursor:"pointer",background:!isApts?G:"transparent",color:!isApts?"white":"#6b7280"}}>👤 Trabajadores ({workerList.length})</button>
        </div>
        {isApts ? <>
          {editIdx===-2||editIdx>=0 ? <Card>
            <div style={{fontWeight:700,marginBottom:12,fontSize:15}}>{editIdx===-2?"Agregar":"Editar"} Apartamento</div>
            <Lbl t="NOMBRE"/><Inp value={aptForm.name} onChange={e=>setAptForm(f=>({...f,name:e.target.value}))} placeholder="Ej: 201 LAURELES"/>
            <Lbl t="CLIENTE"/><Inp value={aptForm.client} onChange={e=>setAptForm(f=>({...f,client:e.target.value}))} placeholder="Ej: TCG"/>
            <Lbl t="VALOR DE LA LIMPIEZA ($)"/><Inp type="number" value={aptForm.valor} onChange={e=>setAptForm(f=>({...f,valor:Number(e.target.value)}))} placeholder="0" min="0"/>
            <Btn bg={G} onClick={saveAptForm} style={{marginTop:4}}>Guardar</Btn>
            <Btn bg="#9ca3af" onClick={()=>setEditIdx(-1)}>Cancelar</Btn>
          </Card> : <Btn bg={G} onClick={()=>{setAptForm({name:"",client:"",valor:0});setEditIdx(-2);}} style={{marginTop:0,marginBottom:4}}>+ Agregar Apartamento</Btn>}
          <Card>
            <Lbl t="LISTA"/>
            {aptList.map((a,idx)=><div key={a.name+idx} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:10,background:"#f9fafb",borderRadius:9,marginBottom:6}}>
              <div>
                <div style={{fontWeight:700,fontSize:14}}>{a.name}</div>
                <div style={{marginTop:4,display:"flex",gap:6,flexWrap:"wrap"}}>
                  {a.client&&<span style={{background:"#eff6ff",color:B,padding:"2px 8px",borderRadius:20,fontSize:11,fontWeight:700}}>{a.client}</span>}
                  {a.valor>0&&<span style={{color:PU,fontWeight:700,fontSize:12}}>{pesos(a.valor)}</span>}
                </div>
              </div>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>{setAptForm({...a});setEditIdx(idx);}} style={{background:"#eff6ff",color:B,border:"none",borderRadius:7,padding:"5px 10px",cursor:"pointer",fontWeight:600,fontSize:13}}>✏️</button>
                <button onClick={()=>{if(confirm("Eliminar: "+a.name+"?"))saveApts(aptList.filter((_,j)=>j!==idx));}} style={{background:"#fff1f2",color:R,border:"none",borderRadius:7,padding:"5px 10px",cursor:"pointer",fontSize:13}}>🗑️</button>
              </div>
            </div>)}
          </Card>
        </> : <>
          <Card>
            <Lbl t="AGREGAR TRABAJADOR"/>
            <div style={{display:"flex",gap:8}}>
              <Inp value={newWorker} onChange={e=>setNewWorker(e.target.value)} placeholder="Ej: Carlos Perez" style={{flex:1,margin:0}} onKeyDown={e=>{if(e.key==="Enter"&&newWorker.trim()){saveWorkers([...workerList,newWorker.trim()]);setNewWorker("");}}}/>
              <button onClick={()=>{if(newWorker.trim()){saveWorkers([...workerList,newWorker.trim()]);setNewWorker("");}}} style={{background:G,color:"white",border:"none",borderRadius:9,padding:"10px 18px",fontWeight:700,cursor:"pointer",fontSize:18}}>+</button>
            </div>
          </Card>
          <Card><Lbl t="TRABAJADORES"/>
            {workerList.map((w,i)=><div key={w} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"9px 10px",background:"#f9fafb",borderRadius:9,marginBottom:6}}>
              <span style={{fontSize:14,fontWeight:500}}>{w}</span>
              <div style={{display:"flex",gap:6}}>
                <button onClick={()=>{const v=prompt("Editar:",w);if(v?.trim())saveWorkers(workerList.map((x,j)=>j===i?v.trim():x));}} style={{background:"#eff6ff",color:B,border:"none",borderRadius:7,padding:"5px 10px",cursor:"pointer",fontWeight:600,fontSize:13}}>✏️</button>
                <button onClick={()=>{if(confirm("Eliminar: "+w+"?"))saveWorkers(workerList.filter((_,j)=>j!==i));}} style={{background:"#fff1f2",color:R,border:"none",borderRadius:7,padding:"5px 10px",cursor:"pointer",fontSize:13}}>🗑️</button>
              </div>
            </div>)}
          </Card>
        </>}
      </div>
    );
  }

  if (screen==="active") return (
    <div style={wrap}>
      <div style={{background:"linear-gradient(135deg,#16a34a,#15803d)",borderRadius:16,padding:20,color:"white",marginBottom:12,textAlign:"center"}}>
        <div style={{fontSize:11,fontWeight:700,opacity:.85,marginBottom:4}}>🧹 LIMPIEZA EN CURSO</div>
        <div style={{fontSize:18,fontWeight:800}}>{aptLabel(sessRef.current?.apt||selApt)}</div>
        <div style={{fontSize:13,opacity:.8,marginBottom:10}}>{sessRef.current?.apt?.client}</div>
        <div style={{fontSize:14,opacity:.85,marginBottom:10}}>👤 {sessRef.current?.worker||worker}</div>
        <div style={{fontSize:50,fontWeight:900,fontVariantNumeric:"tabular-nums",letterSpacing:2,lineHeight:1}}>{fmt(elapsed)}</div>
        <div style={{fontSize:12,opacity:.75,marginTop:6}}>{sessRef.current?.startTime?"Inicio: "+fmtHour(sessRef.current.startTime):""}</div>
      </div>
      <Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><span style={{fontWeight:700,fontSize:15}}>🚪 Evidencia Entrada</span><span style={{fontSize:12,fontWeight:800,padding:"2px 9px",borderRadius:20,background:"#eff6ff",color:B}}>{entryMedia.length}</span></div>
        <MediaBtns onV={e=>readFiles(e.target.files,setEntryMedia)} onP={e=>readFiles(e.target.files,setEntryMedia)} vc={B} pc={B}/>
        <MediaGrid items={entryMedia}/>
      </Card>
      <Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}><span style={{fontWeight:700,fontSize:15}}>📝 Novedades</span><span style={{fontSize:12,fontWeight:800,padding:"2px 9px",borderRadius:20,background:"#fef3c7",color:O}}>{novedades.length}</span></div>
        <NovList list={novedades}/>
        {showNov?<>
          <textarea value={novDraft} onChange={e=>setNovDraft(e.target.value)} placeholder="Escribir novedad..." style={{width:"100%",padding:10,borderRadius:9,border:"1px solid #e5e7eb",fontSize:14,resize:"none",height:80,fontFamily:"inherit",marginTop:6,boxSizing:"border-box"}}/>
          <Btn bg={G} onClick={addNov} style={{marginTop:6}}>✅ Guardar</Btn>
          <Btn bg="#9ca3af" onClick={()=>{setShowNov(false);setNovDraft("");}} style={{marginTop:6}}>Cancelar</Btn>
        </>:<Btn bg={O} onClick={()=>setShowNov(true)} style={{marginTop:0}}>➕ Agregar Novedad</Btn>}
      </Card>
      <Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}><span style={{fontWeight:700,fontSize:15}}>⚠️ Evidencia de Danos</span><span style={{fontSize:12,fontWeight:800,padding:"2px 9px",borderRadius:20,background:"#fff1f2",color:R}}>{danosMedia.length}</span></div>
        <label style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8,width:"100%",padding:"12px 16px",background:R,color:"white",borderRadius:10,fontSize:15,fontWeight:700,cursor:"pointer"}}>📸 Fotografiar Dano<input type="file" accept="image/*" capture="environment" multiple style={{display:"none"}} onChange={e=>readFiles(e.target.files,setDanosMedia)}/></label>
        <MediaGrid items={danosMedia}/>
      </Card>
      <Btn bg={R} onClick={()=>setShowModal(true)} style={{padding:15,fontSize:16,marginTop:4}}>⏹ Finalizar Limpieza</Btn>
      {showModal&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",display:"flex",alignItems:"flex-end",zIndex:100}}>
        <div style={{background:"white",borderRadius:"20px 20px 0 0",padding:24,width:"100%",maxWidth:480,margin:"0 auto",maxHeight:"90vh",overflowY:"auto"}}>
          <div style={{textAlign:"center",marginBottom:16}}><div style={{fontSize:40}}>🚪</div><h3 style={{margin:"8px 0 4px"}}>Evidencia de Salida</h3><p style={{color:"#6b7280",fontSize:14}}>Graba o toma fotos del estado final</p></div>
          <MediaBtns onV={e=>readFiles(e.target.files,setExitMedia)} onP={e=>readFiles(e.target.files,setExitMedia)} vc={G} pc={G}/>
          <MediaGrid items={exitMedia}/>
          <Btn bg={R} onClick={finalizarLimpieza} style={{padding:14,marginTop:14}}>✅ Confirmar Finalizacion</Btn>
          <Btn bg="#9ca3af" onClick={()=>setShowModal(false)} style={{marginTop:8}}>Cancelar</Btn>
        </div>
      </div>}
    </div>
  );

  if (screen==="summary"&&lastRec) return (
    <div style={wrap}>
      <div style={{textAlign:"center",padding:"24px 0 16px"}}><div style={{fontSize:56}}>✅</div><h2 style={{margin:"10px 0 4px",color:G,fontSize:22}}>Limpieza Completada</h2><p style={{color:"#6b7280",fontSize:14}}>{fmtDate(lastRec.endTime)}</p></div>
      <Card>
        {[["Trabajador",lastRec.worker],["Apartamento",lastRec.apt],["Cliente",lastRec.client],["Valor",pesos(lastRec.valor)],["Duracion",fmt(lastRec.duration)],["Inicio",fmtHour(lastRec.startTime)],["Fin",fmtHour(lastRec.endTime)]].map(([l,v],i,a)=>(
          <div key={l} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"9px 0",borderBottom:i<a.length-1?"1px solid #f3f4f6":"none"}}><span style={{fontSize:14,color:"#6b7280"}}>{l}</span><span style={{fontWeight:700}}>{v}</span></div>
        ))}
      </Card>
      {lastRec.novedades?.length>0&&<Card><div style={{fontWeight:700,marginBottom:10}}>📝 Novedades</div><NovList list={lastRec.novedades}/></Card>}
      {entryMedia.length>0&&<Card><div style={{fontWeight:700,marginBottom:8}}>🚪 Entrada</div><MediaGrid items={entryMedia}/></Card>}
      {danosMedia.length>0&&<Card><div style={{fontWeight:700,marginBottom:8}}>⚠️ Danos</div><MediaGrid items={danosMedia}/></Card>}
      {exitMedia.length>0&&<Card><div style={{fontWeight:700,marginBottom:8}}>🚪 Salida</div><MediaGrid items={exitMedia}/></Card>}
      <Btn bg={G} onClick={goHome} style={{padding:14,fontSize:16,marginTop:0}}>🏠 Nueva Limpieza</Btn>
      <Btn bg={B} onClick={()=>setScreen("adminLogin")} style={{marginTop:10}}>👨‍💼 Panel Admin</Btn>
    </div>
  );

  if (screen==="adminLogin") return (
    <div style={wrap}>
      <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"70vh"}}>
        <div style={{fontSize:52,marginBottom:16}}>🔐</div>
        <h2 style={{fontSize:22,fontWeight:800,color:"#111827",marginBottom:6}}>Panel de Administrador</h2>
        <p style={{color:"#6b7280",fontSize:14,marginBottom:24}}>Ingresa la contrasena</p>
        <Card style={{width:"100%"}}>
          <Lbl t="CONTRASENA"/>
          <Inp type="password" value={adminPass} onChange={e=>setAdminPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&enterAdmin()} placeholder="..." style={{fontSize:18,letterSpacing:4}}/>
          {adminError&&<div style={{color:R,fontSize:13,marginBottom:8,fontWeight:600}}>{adminError}</div>}
          <Btn bg={B} onClick={enterAdmin} style={{marginTop:4}}>Entrar al Panel</Btn>
        </Card>
        <button onClick={()=>setScreen("home")} style={{background:"none",border:"none",color:"#6b7280",marginTop:16,cursor:"pointer",fontSize:14}}>← Volver</button>
      </div>
    </div>
  );

  if (screen==="admin") {
    const live=adminRecs.filter(r=>r.status==="active");
    const done=adminRecs.filter(r=>r.status==="completed");
    const todayStr=new Date().toDateString();
    const todayDone=done.filter(r=>toDate(r.endTime).toDateString()===todayStr);
    const avgDurToday=todayDone.length?Math.round(todayDone.reduce((a,r)=>a+(r.duration||0),0)/todayDone.length):0;
    const totalHoy=todayDone.reduce((a,r)=>a+(r.valor||0),0);
    const filtered=done.filter(r=>{
      if(fDate&&toDate(r.endTime).toISOString().slice(0,10)!==fDate)return false;
      if(fWorker&&r.worker!==fWorker)return false;
      if(fApt&&r.apt!==fApt)return false;
      return true;
    });
    const workers=[...new Set(done.map(r=>r.worker))].sort();
    const apts=[...new Set(done.map(r=>r.apt))].sort();
    return (
      <div style={wrap}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
          <button onClick={leaveAdmin} style={{background:"white",border:"1px solid #e5e7eb",borderRadius:9,padding:"6px 14px",cursor:"pointer",fontWeight:700,fontSize:14}}>← Volver</button>
          <div style={{flex:1}}><h2 style={{fontSize:19,color:"#111827"}}>👨‍💼 Panel Admin</h2><p style={{fontSize:12,color:"#6b7280"}}>Tiempo real</p></div>
          <button onClick={()=>{setScreen("dashboard");fetchAllForDash();}} style={{background:PU,color:"white",border:"none",borderRadius:9,padding:"8px 12px",cursor:"pointer",fontWeight:700,fontSize:13}}>📊 Dashboard</button>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          <StatBox val={live.length} lbl="EN CURSO" color={G}/>
          <StatBox val={todayDone.length} lbl="HOY" color={B}/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
          <StatBox val={fmt(avgDurToday)} lbl="PROMEDIO HOY" color={O}/>
          <StatBox val={pesos(totalHoy)} lbl="INGRESOS HOY" color={PU}/>
        </div>
        <Card>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontWeight:700,fontSize:14}}>🔍 Filtros</span>
            {(fDate||fWorker||fApt)&&<button onClick={()=>{setFDate("");setFWorker("");setFApt("");}} style={{background:"#fff1f2",color:R,border:"none",borderRadius:7,padding:"4px 10px",fontSize:12,fontWeight:700,cursor:"pointer"}}>Limpiar</button>}
          </div>
          <Inp type="date" value={fDate} onChange={e=>setFDate(e.target.value)}/>
          <Sel val={fWorker} onChange={setFWorker}><option value="">Todos los trabajadores</option>{workers.map(w=><option key={w}>{w}</option>)}</Sel>
          <Sel val={fApt} onChange={setFApt} style={{marginBottom:0}}><option value="">Todos los apartamentos</option>{apts.map(a=><option key={a}>{a}</option>)}</Sel>
        </Card>
        {live.length>0&&<><div style={{fontSize:12,color:"#6b7280",fontWeight:700,marginBottom:8}}>🟢 EN CURSO ({live.length})</div>
          {live.map(r=><div key={r.id} style={{borderLeft:"4px solid "+G,borderRadius:12,background:"#f0fdf4",padding:14,marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between"}}>
              <div><div style={{fontWeight:700,fontSize:15}}>{r.apt}</div>{r.client&&<span style={{background:"#dcfce7",color:G,fontSize:11,fontWeight:700,padding:"1px 8px",borderRadius:20}}>{r.client}</span>}<div style={{fontSize:13,color:"#6b7280",marginTop:4}}>{r.worker}</div></div>
              <div style={{background:"#dcfce7",color:G,padding:"4px 10px",borderRadius:20,fontSize:12,fontWeight:700,height:"fit-content"}}>● ACTIVO</div>
            </div>
            {r.novedades?.length>0&&<div style={{marginTop:8,paddingTop:8,borderTop:"1px solid #bbf7d0"}}><NovList list={r.novedades}/></div>}
          </div>)}
        </>}
        <div style={{fontSize:12,color:"#6b7280",fontWeight:700,marginBottom:8,marginTop:4}}>📋 HISTORIAL ({filtered.length} de {done.length})</div>
        {!filtered.length?<p style={{textAlign:"center",color:"#9ca3af",padding:24}}>Sin registros</p>:
          filtered.map(r=><div key={r.id} style={{borderLeft:"4px solid #e5e7eb",borderRadius:12,background:"white",padding:14,marginBottom:10,boxShadow:"0 1px 3px rgba(0,0,0,.07)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontWeight:700,fontSize:15}}>{r.apt}</div>
                {r.client&&<span style={{background:"#eff6ff",color:B,fontSize:11,fontWeight:700,padding:"1px 8px",borderRadius:20}}>{r.client}</span>}
                <div style={{fontSize:13,color:"#6b7280",marginTop:4}}>{r.worker}</div>
                <div style={{fontSize:12,color:"#9ca3af"}}>{r.endTime?fmtDate(toDate(r.endTime))+" · "+fmtHour(toDate(r.startTime))+"-"+fmtHour(toDate(r.endTime)):""}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontWeight:900,color:G,fontSize:18}}>{fmt(r.duration||0)}</div>
                {r.valor>0&&<div style={{fontWeight:800,color:PU,fontSize:14}}>{pesos(r.valor)}</div>}
                <div style={{fontSize:11,color:"#9ca3af"}}>{(r.entryCount||0)+(r.danosCount||0)+(r.exitCount||0)} arch</div>
              </div>
            </div>
            {r.novedades?.length>0&&<div style={{marginTop:8,paddingTop:8,borderTop:"1px solid #f3f4f6"}}><NovList list={r.novedades}/></div>}
          </div>)
        }
      </div>
    );
  }

  if (screen==="dashboard") {
    const {completed,clients,months,totalValor,totalCount,avgDur,curD,prevD}=getDashData();
    const curValor=curD.reduce((a,r)=>a+(r.valor||0),0);
    const prevValor=prevD.reduce((a,r)=>a+(r.valor||0),0);
    const diff=curD.length-prevD.length;
    const diffPct=prevD.length>0?Math.round((Math.abs(diff)/prevD.length)*100):0;
    return (
      <div style={wrap}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
          <button onClick={()=>setScreen("admin")} style={{background:"white",border:"1px solid #e5e7eb",borderRadius:9,padding:"6px 14px",cursor:"pointer",fontWeight:700,fontSize:14}}>← Volver</button>
          <div style={{flex:1}}><h2 style={{fontSize:19,color:"#111827"}}>📊 Dashboard</h2><p style={{fontSize:12,color:"#6b7280"}}>Analisis de limpiezas</p></div>
          <button onClick={fetchAllForDash} style={{background:"white",border:"1px solid #e5e7eb",borderRadius:9,padding:"6px 12px",cursor:"pointer",fontSize:13,fontWeight:700}}>🔄</button>
        </div>
        <Card>
          <div style={{fontWeight:700,marginBottom:10,fontSize:14}}>📅 Rango de Fechas</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            <div><Lbl t="DESDE"/><Inp type="date" value={dashFrom} onChange={e=>setDashFrom(e.target.value)} style={{margin:0}}/></div>
            <div><Lbl t="HASTA"/><Inp type="date" value={dashTo} onChange={e=>setDashTo(e.target.value)} style={{margin:0}}/></div>
          </div>
          {dashLoading&&<div style={{textAlign:"center",color:"#6b7280",fontSize:13,marginTop:8}}>Cargando...</div>}
        </Card>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          <StatBox val={totalCount} lbl="TOTAL LIMPIEZAS" color={G} sub="en el rango"/>
          <StatBox val={pesos(totalValor)} lbl="TOTAL VALOR" color={PU} sub="en el rango"/>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
          <StatBox val={fmt(avgDur)} lbl="DURACION PROM" color={O}/>
          <StatBox val={clients.length} lbl="CLIENTES" color={B}/>
        </div>
        <Card>
          <div style={{fontWeight:700,marginBottom:12,fontSize:14}}>📈 Mes Actual vs Anterior</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div style={{textAlign:"center",padding:12,background:"#f0fdf4",borderRadius:10}}>
              <div style={{fontSize:11,color:"#6b7280",fontWeight:700,marginBottom:4}}>MES ACTUAL</div>
              <div style={{fontSize:36,fontWeight:900,color:G}}>{curD.length}</div>
              <div style={{fontSize:13,color:G,fontWeight:700}}>{pesos(curValor)}</div>
            </div>
            <div style={{textAlign:"center",padding:12,background:"#f9fafb",borderRadius:10}}>
              <div style={{fontSize:11,color:"#6b7280",fontWeight:700,marginBottom:4}}>MES ANTERIOR</div>
              <div style={{fontSize:36,fontWeight:900,color:"#9ca3af"}}>{prevD.length}</div>
              <div style={{fontSize:13,color:"#9ca3af",fontWeight:700}}>{pesos(prevValor)}</div>
            </div>
          </div>
          {prevD.length>0&&<div style={{textAlign:"center",marginTop:10,padding:8,background:diff>=0?"#f0fdf4":"#fff1f2",borderRadius:8}}>
            <span style={{fontWeight:700,color:diff>=0?G:R,fontSize:14}}>{diff>=0?"▲ Mas":"▼ Menos"} {Math.abs(diff)} limpiezas ({diffPct}%) vs mes anterior</span>
          </div>}
        </Card>
        <Card>
          <div style={{fontWeight:700,marginBottom:12,fontSize:14}}>📊 Limpiezas por Mes</div>
          <ResponsiveContainer width="100%" height={200}>
            <BarChart data={months} margin={{top:0,right:0,bottom:0,left:-20}}>
              <XAxis dataKey="label" tick={{fontSize:10}}/><YAxis tick={{fontSize:10}} allowDecimals={false}/><Tooltip/>
              <Bar dataKey="count" fill={G} radius={[4,4,0,0]} name="Limpiezas"/>
            </BarChart>
          </ResponsiveContainer>
        </Card>
        <Card>
          <div style={{fontWeight:700,marginBottom:12,fontSize:14}}>💰 Valor por Mes</div>
          <ResponsiveContainer width="100%" height={200}>
            <BarChart data={months} margin={{top:0,right:0,bottom:0,left:0}}>
              <XAxis dataKey="label" tick={{fontSize:10}}/><YAxis tick={{fontSize:10}} tickFormatter={v=>v>=1000?Math.round(v/1000)+"k":v}/><Tooltip formatter={v=>pesos(v)}/>
              <Bar dataKey="valor" fill={PU} radius={[4,4,0,0]} name="Valor"/>
            </BarChart>
          </ResponsiveContainer>
        </Card>
        <Card>
          <div style={{fontWeight:700,marginBottom:12,fontSize:14}}>👥 Por Cliente</div>
          {!clients.length?<p style={{color:"#9ca3af",textAlign:"center",padding:12}}>Sin datos en el rango</p>:
            clients.map((c,i)=><div key={c.client} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:12,background:"#f9fafb",borderRadius:10,marginBottom:8,borderLeft:"4px solid "+COLORS[i%COLORS.length]}}>
              <div>
                <div style={{fontWeight:800,fontSize:15}}>{c.client}</div>
                <div style={{fontSize:12,color:"#6b7280",marginTop:3}}><span style={{fontWeight:700,color:G}}>{c.count}</span> limpiezas{c.count>0&&<span style={{marginLeft:8,color:"#9ca3af"}}>· prom {fmt(Math.round(c.dur/c.count))}</span>}</div>
                <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{totalCount>0?Math.round(c.count/totalCount*100):0}% del total</div>
              </div>
              <div style={{textAlign:"right"}}><div style={{fontWeight:900,color:PU,fontSize:16}}>{pesos(c.valor)}</div><div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>valor total</div></div>
            </div>)
          }
          {clients.length>0&&<div style={{marginTop:8,padding:"10px 12px",background:"#f0fdf4",borderRadius:10,display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:700,color:G}}>TOTAL</span><span style={{fontWeight:900,color:PU}}>{pesos(totalValor)}</span></div>}
        </Card>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
