<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Control de Limpieza</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f3f4f6;-webkit-tap-highlight-color:transparent}
.wrap{max-width:500px;margin:0 auto;padding:16px;min-height:100vh;padding-bottom:60px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit}
.inp{width:100%;padding:12px;border-radius:9px;border:1.5px solid #d1d5db;font-size:15px;font-family:inherit;outline:none;background:#fff;margin-bottom:10px}
.inp:focus{border-color:#16a34a;box-shadow:0 0 0 3px rgba(22,163,74,.1)}
.lbl{font-size:11px;color:#6b7280;font-weight:700;letter-spacing:.06em;margin-bottom:5px;display:block;text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #f3f4f6}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.sbox{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.irow{display:flex;align-items:flex-start;gap:10px;padding:12px;background:#f9fafb;border-radius:10px;margin-bottom:8px}
.ac{border-left:4px solid #e5e7eb;border-radius:12px;background:#fff;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tabbar{display:flex;gap:4px;background:#fff;border-radius:12px;padding:4px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:14px}
.tab{flex:1;padding:9px 4px;border:none;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:200}
.sheet{background:#fff;border-radius:22px 22px 0 0;padding:24px;width:100%;max-width:500px;margin:0 auto;max-height:90vh;overflow-y:auto}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.mth{border-radius:9px;overflow:hidden;aspect-ratio:1;background:#f3f4f6}
.mth img,.mth video{width:100%;height:100%;object-fit:cover}
.nov{background:#dcfce7;border-radius:9px;padding:9px 12px;margin-bottom:6px;border-left:3px solid #16a34a}
.highlight{background:linear-gradient(135deg,#7c3aed,#5b21b6);border-radius:14px;padding:16px;color:#fff;margin-bottom:12px}
.alert-form{background:#f0fdf4;border:2px solid #16a34a;border-radius:14px;padding:16px;margin-bottom:12px}
</style>
</head>
<body>
<div id="R" style="display:flex;align-items:center;justify-content:center;height:100vh;font-size:52px">🧹</div>
<script>
// ── FIREBASE ──────────────────────────────────────────────────────────
firebase.initializeApp({
  apiKey:"AIzaSyDBSqHoAc_qDQQhrOmDtdcZ7ZyyPbXv5Sg",
  authDomain:"lavanderia-limpieza.firebaseapp.com",
  projectId:"lavanderia-limpieza",
  storageBucket:"lavanderia-limpieza.firebasestorage.app",
  messagingSenderId:"229695150868",
  appId:"1:229695150868:web:082157b403bcef987b8001"

var db = firebase.firestore();

// ── CONSTANTES ────────────────────────────────────────────────────────
var PASS_ADM = "admin2024";
var PASS_GER = "jose03.22";
var G="#16a34a",R="#dc2626",B="#2563eb",O="#d97706",PU="#7c3aed",GR="#9ca3af";
var MONTHS=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
var COLORS=["#16a34a","#2563eb","#d97706","#dc2626","#7c3aed","#0891b2","#be185d","#b45309"];

var DEF_APTS=[
  {name:"201 LAURELES",client:"TCG",valor:0},{name:"302 LAURELES",client:"TCG",valor:0},
  {name:"303 LAURELES",client:"TCG",valor:0},{name:"303 MONSERRATE",client:"TCG",valor:0},
  {name:"306",client:"ROMULO",valor:0},{name:"308 BASELOFT",client:"DIEGO CAMACHO",valor:0},
  {name:"311",client:"ADRIANA",valor:0},{name:"405",client:"ROMULO",valor:0},
  {name:"501 AVENIDA DEL CERRO",client:"ALEJANDRA",valor:0},{name:"501",client:"TCG",valor:0},
  {name:"503 BASELOFT",client:"TCG",valor:0},{name:"510",client:"BASELOFT",valor:0},
  {name:"712",client:"RUFFGO",valor:0},{name:"810",client:"ADRIANA",valor:0},
  {name:"1003",client:"TCG",valor:0},{name:"1103",client:"TCG",valor:0},
  {name:"1305",client:"TCG",valor:0},{name:"1402",client:"TCG",valor:0},
  {name:"1405",client:"TCG",valor:0},{name:"1703",client:"TCG",valor:0},
  {name:"1802",client:"TCG",valor:0},{name:"2105",client:"TCG",valor:0},
  {name:"2204",client:"LIGIA",valor:0},{name:"2404",client:"ALEJA",valor:0},
  {name:"2505",client:"TCG",valor:0},{name:"2701",client:"TCG",valor:0}
];
var DEF_WORKERS=["Maria Garcia","Juan Lopez","Ana Martinez","Pedro Rodriguez","Laura Gomez"];

// ── ESTADO ────────────────────────────────────────────────────────────
var S={
  screen:"home",
  apts:DEF_APTS.map(function(a){return{name:a.name,client:a.client,valor:Number(a.valor)||0}}),
  workers:DEF_WORKERS.slice(),
  // operario
  who:"",apt:null,
  t:0,novs:[],emIn:[],emDan:[],emOut:[],
  modal:false,novForm:false,
  sid:null,stime:null,tint:null,lastRec:null,
  // login/panel
  passErr:"",role:"",
  recs:[],poll:null,
  fD:"",fW:"",fA:"",fC:"",
  // gerencia
  gTab:"deuda",
  dFrom:(function(){var d=new Date();d.setDate(1);return d.toISOString().slice(0,10)})(),
  dTo:new Date().toISOString().slice(0,10),
  // config
  cTab:"apts",
  // formulario apartamento — null = cerrado
  aptForm:null, // {idx, name, client, valor}
  ewIdx:-1
};

// ── UTILS ─────────────────────────────────────────────────────────────
var fmt=function(s){return[Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(function(x){return String(x).padStart(2,"0")}).join(":")};
var fD=function(d){try{return new Date(d).toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"})}catch(e){return""}};
var fH=function(d){try{return new Date(d).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})}catch(e){return""}};
var nowT=function(){return new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",second:"2-digit"})};
var pesos=function(v){return"$"+Number(v||0).toLocaleString("es-CO")};
var td=function(t){if(!t)return new Date();if(t.toDate)return t.toDate();return new Date(t)};
var esc=function(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")};
var aptL=function(a){return a?a.name+" ("+a.client+")":""};

// ── FIREBASE ──────────────────────────────────────────────────────────
function loadCfg(){
  db.collection("config").doc("apartamentos").get().then(function(d){
    if(d.exists&&d.data().list&&d.data().list.length){
      var l=d.data().list;
      if(typeof l[0]==="object"&&l[0].name){
        S.apts=l.map(function(a){return{name:String(a.name||""),client:String(a.client||""),valor:Number(a.valor)||0}});
      }
    }
    return db.collection("config").doc("trabajadores").get();
  }).then(function(d){
    if(d.exists&&d.data().list&&d.data().list.length)S.workers=d.data().list.slice();
    S.screen="home";render();
  }).catch(function(){S.screen="home";render()});
}
function saveApts(cb){
  var list=S.apts.map(function(a){return{name:String(a.name),client:String(a.client),valor:Number(a.valor)||0}});
  db.collection("config").doc("apartamentos").set({list:list}).then(function(){
    if(cb)cb();
  }).catch(function(e){alert("Error guardando: "+e.message)});
}
function saveWorkers(){
  db.collection("config").doc("trabajadores").set({list:S.workers.slice()}).catch(function(){});
}
function fetchRecs(){
  db.collection("limpiezas").orderBy("startTime","desc").limit(500).get().then(function(snap){
    S.recs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    render();
  }).catch(function(){});
}

// ── MEDIA ─────────────────────────────────────────────────────────────
function readFiles(files,key){
  Array.from(files).forEach(function(f){
    var r=new FileReader();
    r.onload=function(ev){S[key].push({url:ev.target.result,isVideo:f.type.startsWith("video")});render()};
    r.readAsDataURL(f);
  });
}
function mgrid(items){
  if(!items||!items.length)return"";
  return'<div class="mgrid">'+items.map(function(it){
    return'<div class="mth">'+(it.isVideo?'<video src="'+it.url+'" controls></video>':'<img src="'+it.url+'" loading="lazy">')+'</div>';
  }).join("")+'</div>';
}
function novH(list){
  return(list||[]).map(function(n){
    return'<div class="nov"><b style="font-size:11px;color:'+G+'">'+esc(n.time)+'</b><div style="font-size:14px;margin-top:2px">'+esc(n.text)+'</div></div>';
  }).join("");
}
function mbtns(key,c1,c2){
  return'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px">'+
    '<label style="display:flex;align-items:center;justify-content:center;gap:5px;padding:11px;background:'+c1+';color:#fff;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer">🎥 Video<input type="file" accept="video/*" capture="environment" multiple style="display:none" onchange="readFiles(this.files,\''+key+'\')"></label>'+
    '<label style="display:flex;align-items:center;justify-content:center;gap:5px;padding:11px;background:#fff;color:'+c2+';border:2px solid '+c2+';border-radius:10px;font-size:13px;font-weight:700;cursor:pointer">📸 Foto<input type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="readFiles(this.files,\''+key+'\')"></label>'+
    '</div>';
}

// ── ACCIONES OPERARIO ─────────────────────────────────────────────────
function goHome(){
  clearInterval(S.tint);S.tint=null;
  Object.assign(S,{screen:"home",who:"",apt:null,t:0,novs:[],emIn:[],emDan:[],emOut:[],modal:false,novForm:false,sid:null,stime:null,lastRec:null});
  render();
}
function startCleaning(){
  if(!S.who||!S.apt)return;
  S.stime=new Date();S.t=0;S.novs=[];S.emIn=[];S.emDan=[];S.emOut=[];S.modal=false;S.novForm=false;
  S.screen="active";render();
  db.collection("limpiezas").add({
    worker:S.who,apt:aptL(S.apt),client:S.apt.client,valor:Number(S.apt.valor)||0,
    startTime:firebase.firestore.Timestamp.fromDate(S.stime),
    status:"active",novedades:[],entryCount:0,danosCount:0,exitCount:0,duration:0
  }).then(function(r){S.sid=r.id}).catch(function(){});
  clearInterval(S.tint);
  S.tint=setInterval(function(){S.t++;var el=document.getElementById("tmr");if(el)el.textContent=fmt(S.t)},1000);
}
function addNov(){
  var el=document.getElementById("novta");
  if(!el||!el.value.trim())return;
  S.novs.push({text:el.value.trim(),time:nowT()});
  S.novForm=false;
  if(S.sid)db.collection("limpiezas").doc(S.sid).update({novedades:S.novs}).catch(function(){});
  render();
}
function finalizarLimpieza(){
  clearInterval(S.tint);S.tint=null;
  var end=new Date();
  if(S.sid){
    db.collection("limpiezas").doc(S.sid).update({
      status:"completed",endTime:firebase.firestore.Timestamp.fromDate(end),
      duration:S.t,novedades:S.novs,
      entryCount:S.emIn.length,danosCount:S.emDan.length,exitCount:S.emOut.length
    }).catch(function(){});
  }
  S.lastRec={who:S.who,apt:aptL(S.apt),client:S.apt.client,valor:Number(S.apt.valor)||0,
    stime:S.stime,end:end,dur:S.t,novs:S.novs,
    nc:S.emIn.length,dc:S.emDan.length,oc:S.emOut.length};
  S.modal=false;S.screen="summary";render();
}

// ── LOGIN ─────────────────────────────────────────────────────────────
function tryLogin(){
  var el=document.getElementById("pi");
  if(!el)return;
  var v=el.value;
  if(v===PASS_GER){
    S.role="ger";S.passErr="";S.gTab="deuda";S.screen="ger";
    fetchRecs();clearInterval(S.poll);S.poll=setInterval(fetchRecs,15000);render();
  } else if(v===PASS_ADM){
    S.role="adm";S.passErr="";S.screen="adm";
    fetchRecs();clearInterval(S.poll);S.poll=setInterval(fetchRecs,15000);render();
  } else {
    S.passErr="Contrasena incorrecta";render();
    setTimeout(function(){var i=document.getElementById("pi");if(i){i.value="";i.focus()}},50);
  }
}
function leavePanel(){
  clearInterval(S.poll);S.poll=null;
  Object.assign(S,{screen:"home",role:"",passErr:"",fD:"",fW:"",fA:"",fC:"",recs:[]});
  render();
}

// ── GESTIÓN APARTAMENTOS ─────────────────────────────────────────────
// Abre formulario nuevo
function newApt(){
  S.aptForm={idx:-1,name:"",client:"",valor:0};
  render();
  setTimeout(function(){var el=document.getElementById("fn");if(el)el.focus()},100);
}
// Abre formulario edición
function editApt(idx){
  var a=S.apts[idx];
  S.aptForm={idx:idx,name:a.name,client:a.client,valor:a.valor};
  render();
  setTimeout(function(){var el=document.getElementById("fn");if(el)el.focus()},100);
}
// Guarda formulario apartamento
function saveAptForm(){
  var fn=document.getElementById("fn");
  var fc=document.getElementById("fc");
  var fv=document.getElementById("fv");
  if(!fn||!fn.value.trim()){alert("El nombre es obligatorio");return}
  var obj={name:fn.value.trim().toUpperCase(),client:(fc?fc.value.trim().toUpperCase():""),valor:Number(fv?fv.value:0)||0};
  if(S.aptForm.idx===-1){
    S.apts.push(obj);
  } else {
    S.apts[S.aptForm.idx]=obj;
  }
  var wasNew=S.aptForm.idx===-1;
  S.aptForm=null;
  saveApts(function(){
    alert(wasNew?"✅ Apartamento creado correctamente":"✅ Apartamento actualizado correctamente");
    render();
  });
}
function cancelAptForm(){S.aptForm=null;render()}
function delApt(idx){
  if(!confirm("¿Eliminar el apartamento '"+S.apts[idx].name+"'?\nEsto no elimina registros históricos."))return;
  S.apts.splice(idx,1);
  saveApts(function(){render()});
}

// ── GESTIÓN TRABAJADORES ─────────────────────────────────────────────
function newWorker(){
  var el=document.getElementById("nw");
  if(!el||!el.value.trim())return;
  S.workers.push(el.value.trim());
  saveWorkers();el.value="";render();
}
function editWorker(idx){S.ewIdx=idx;render();setTimeout(function(){var el=document.getElementById("ew");if(el){el.value=S.workers[idx];el.focus()}},100)}
function saveWorker(){
  var el=document.getElementById("ew");
  if(!el||!el.value.trim())return;
  S.workers[S.ewIdx]=el.value.trim();
  S.ewIdx=-1;saveWorkers();render();
}
function cancelWorker(){S.ewIdx=-1;render()}
function delWorker(idx){
  if(!confirm("¿Eliminar '"+S.workers[idx]+"'?"))return;
  S.workers.splice(idx,1);saveWorkers();render();
}

// ── RENDER ────────────────────────────────────────────────────────────
function render(){
  var fns={home:pgHome,login:pgLogin,active:pgActive,summary:pgSummary,adm:pgAdm,ger:pgGer};
  document.getElementById("R").innerHTML='<div class="wrap">'+((fns[S.screen]||pgHome)())+'</div>';
}

// ══════════════════════════════════════════════════════════════════════
// HOME
// ══════════════════════════════════════════════════════════════════════
function pgHome(){
  var sorted=S.apts.slice().sort(function(a,b){return a.name.localeCompare(b.name)});
  var ao=sorted.map(function(a){
    var l=aptL(a);var sel=S.apt&&aptL(S.apt)===l;
    // SIN mostrar valor al operario
    return'<option value="'+esc(l)+'"'+(sel?" selected":"")+'>'+esc(a.name)+' — '+esc(a.client)+'</option>';
  }).join("");
  var wo=S.workers.map(function(w){
    return'<option value="'+esc(w)+'"'+(S.who===w?" selected":"")+'>'+esc(w)+'</option>';
  }).join("");
  var info=S.apt?'<div style="background:#f0fdf4;border-radius:9px;padding:10px 12px;margin-bottom:8px"><span style="color:'+G+';font-weight:700;font-size:13px">Cliente: '+esc(S.apt.client||"Sin asignar")+'</span></div>':"";
  return'<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:18px 0 14px">'+
    '<div><div style="font-size:38px">🧹</div><h1 style="font-size:21px;font-weight:800;color:#111827;margin:6px 0 2px">Control de Limpieza</h1></div></div>'+
    '<div class="card">'+
    '<label class="lbl">Trabajador</label>'+
    '<select class="inp" onchange="S.who=this.value;render()"><option value="">Seleccionar trabajador...</option>'+wo+'</select>'+
    '<label class="lbl">Apartamento</label>'+
    '<select class="inp" onchange="(function(v){S.apt=S.apts.find(function(x){return aptL(x)===v})||null;render()})(this.value)">'+
    '<option value="">Seleccionar apartamento...</option>'+ao+'</select>'+
    info+
    '<button class="btn" onclick="startCleaning()" style="background:'+(S.who&&S.apt?G:GR)+'">▶ Iniciar Limpieza</button></div>'+
    '<button class="btn" onclick="S.screen=\'login\';S.passErr=\'\';render()" style="background:'+B+';margin-top:0">🔐 Acceso Panel</button>';
}

// ══════════════════════════════════════════════════════════════════════
// LOGIN
// ══════════════════════════════════════════════════════════════════════
function pgLogin(){
  return'<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:75vh">'+
    '<div style="font-size:52px;margin-bottom:16px">🔐</div>'+
    '<h2 style="font-size:21px;font-weight:800;color:#111827;margin-bottom:6px">Acceso al Panel</h2>'+
    '<p style="color:#6b7280;font-size:14px;margin-bottom:24px">Administrador o Gerencia</p>'+
    '<div class="card" style="width:100%">'+
    '<label class="lbl">Contrasena</label>'+
    '<input id="pi" type="password" class="inp" placeholder="••••••••" style="font-size:18px;letter-spacing:4px" onkeydown="if(event.key===\'Enter\')tryLogin()">'+
    (S.passErr?'<div style="color:'+R+';font-size:13px;margin-bottom:8px;font-weight:600">⚠️ '+esc(S.passErr)+'</div>':'')+
    '<button class="btn" onclick="tryLogin()" style="background:'+B+';margin-top:4px">Entrar</button></div>'+
    '<button onclick="S.screen=\'home\';S.passErr=\'\';render()" style="background:none;border:none;color:#6b7280;margin-top:16px;cursor:pointer;font-size:14px;font-family:inherit">← Volver</button></div>';
}

// ══════════════════════════════════════════════════════════════════════
// ACTIVO
// ══════════════════════════════════════════════════════════════════════
function pgActive(){
  var a=S.apt||{};
  var nf=S.novForm?
    '<textarea id="novta" class="inp" placeholder="Escribir novedad..." style="height:90px;resize:none;margin-top:6px"></textarea>'+
    '<button class="btn" onclick="addNov()" style="background:'+G+';margin-top:6px;padding:10px">✅ Guardar</button>'+
    '<button class="btn" onclick="S.novForm=false;render()" style="background:'+GR+';margin-top:6px;padding:10px">Cancelar</button>':
    '<button class="btn" onclick="S.novForm=true;render()" style="background:'+O+';margin-top:0;padding:10px">➕ Agregar Novedad</button>';
  var modal=S.modal?
    '<div class="overlay"><div class="sheet">'+
    '<div style="text-align:center;margin-bottom:16px"><h3 style="font-size:18px">🚪 Evidencia de Salida</h3>'+
    '<p style="color:#6b7280;font-size:14px;margin-top:4px">Estado final del apartamento</p></div>'+
    mbtns("emOut",G,G)+mgrid(S.emOut)+
    '<button class="btn" onclick="finalizarLimpieza()" style="background:'+R+';padding:14px;margin-top:14px">✅ Confirmar Finalización</button>'+
    '<button class="btn" onclick="S.modal=false;render()" style="background:'+GR+';margin-top:8px">Cancelar</button>'+
    '</div></div>':"";
  return'<div style="background:linear-gradient(135deg,'+G+',#15803d);border-radius:18px;padding:22px;color:#fff;margin-bottom:14px;text-align:center">'+
    '<div style="font-size:11px;font-weight:700;opacity:.8;letter-spacing:.1em;margin-bottom:5px">LIMPIEZA EN CURSO</div>'+
    '<div style="font-size:20px;font-weight:800">'+esc(a.name||"")+'</div>'+
    '<div style="font-size:13px;opacity:.8;margin-bottom:10px">'+esc(a.client||"")+'</div>'+
    '<div style="font-size:14px;opacity:.85;margin-bottom:10px">👤 '+esc(S.who)+'</div>'+
    '<div id="tmr" style="font-size:52px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:3px;line-height:1">'+fmt(S.t)+'</div>'+

// ── TAB DEUDA POR CLIENTE ─────────────────────────────────────────────
function tabDeuda(){
  var from=S.dFrom?new Date(S.dFrom+" 00:00:00"):null;
  var to=S.dTo?new Date(S.dTo+" 23:59:59"):null;
  var done=S.recs.filter(function(r){return r.status==="completed"});
  var inR=done.filter(function(r){
    var d=td(r.endTime||r.startTime);
    if(from&&d<from)return false;
    if(to&&d>to)return false;
    return true;
  });
  // Agrupar por cliente
  var byC={};
  inR.forEach(function(r){
    var c=r.client||"Sin cliente";
    if(!byC[c])byC[c]={count:0,valor:0,apts:{}};
    byC[c].count++;byC[c].valor+=Number(r.valor)||0;
    var ap=r.apt||"Sin apt";
    if(!byC[c].apts[ap])byC[c].apts[ap]={count:0,valor:0};
    byC[c].apts[ap].count++;byC[c].apts[ap].valor+=Number(r.valor)||0;
  });
  var clArr=Object.keys(byC).map(function(k){return Object.assign({name:k},byC[k])}).sort(function(a,b){return b.valor-a.valor});
  var totalDeuda=clArr.reduce(function(a,c){return a+c.valor},0);

  var clH=!clArr.length?'<p style="text-align:center;color:#9ca3af;padding:20px">Sin registros en este período</p>':
    clArr.map(function(c,i){
      var aH=Object.keys(c.apts).map(function(k){
        var a=c.apts[k];
        return'<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:rgba(255,255,255,.15);border-radius:7px;margin-top:5px">'+
          '<div><span style="font-size:13px;font-weight:600;color:#fff">'+esc(k)+'</span>'+
          '<span style="font-size:11px;color:rgba(255,255,255,.7);margin-left:6px">'+a.count+' limpieza'+(a.count!==1?"s":"")+'</span></div>'+
          '<span style="font-size:14px;font-weight:800;color:#fff">'+pesos(a.valor)+'</span>'+
          '</div>';
      }).join("");
      return'<div style="background:linear-gradient(135deg,'+COLORS[i%COLORS.length]+','+COLORS[(i+1)%COLORS.length]+');border-radius:14px;padding:16px;margin-bottom:12px">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">'+
        '<div><div style="font-size:18px;font-weight:900;color:#fff">'+esc(c.name)+'</div>'+
        '<div style="font-size:12px;color:rgba(255,255,255,.75);margin-top:2px">'+c.count+' limpiezas en el período</div></div>'+
        '<div style="text-align:right"><div style="font-size:22px;font-weight:900;color:#fff">'+pesos(c.valor)+'</div><div style="font-size:10px;color:rgba(255,255,255,.7)">DEBE A MI EMPRESA</div></div></div>'+
        aH+'</div>';
    }).join("");

  return'<div class="card">'+
    '<div style="font-weight:800;font-size:15px;margin-bottom:12px;color:#111827">📅 Período de consulta</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
    '<div><label class="lbl">Desde</label><input type="date" class="inp" value="'+S.dFrom+'" onchange="S.dFrom=this.value;render()" style="margin:0"></div>'+
    '<div><label class="lbl">Hasta</label><input type="date" class="inp" value="'+S.dTo+'" onchange="S.dTo=this.value;render()" style="margin:0"></div>'+
    '</div></div>'+
    (totalDeuda>0?
    '<div class="highlight" style="text-align:center">'+
    '<div style="font-size:12px;color:rgba(255,255,255,.8);font-weight:700;letter-spacing:.05em;margin-bottom:4px">TOTAL FACTURADO EN EL PERÍODO</div>'+
    '<div style="font-size:36px;font-weight:900;color:#fff">'+pesos(totalDeuda)+'</div>'+
    '<div style="font-size:12px;color:rgba(255,255,255,.7);margin-top:4px">'+inR.length+' limpiezas · '+clArr.length+' clientes</div>'+
    '</div>':'')+
    '<div style="font-size:13px;font-weight:700;color:#6b7280;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em">Desglose por cliente</div>'+
    clH;
}

        '<input id="fn" class="inp" type="text" placeholder="Ej: 1103" value="'+esc(ea.name)+'">'+
        '<label class="lbl">Nombre del Cliente *</label>'+
        '<input id="fc" class="inp" type="text" placeholder="Ej: TCG" value="'+esc(ea.client)+'">'+
        '<label class="lbl">Valor del Servicio en Pesos ($) *</label>'+
        '<input id="fv" class="inp" type="number" min="0" step="1000" placeholder="Ej: 50000" value="'+Number(ea.valor||0)+'">'+
        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px">'+
        '<button onclick="saveAptForm()" class="btn" style="background:'+G+';margin-top:0">✅ Guardar</button>'+
        '<button onclick="cancelAptForm()" class="btn" style="background:'+GR+';margin-top:0">Cancelar</button>'+
        '</div></div>';
    } else {
      form='<button onclick="newApt()" class="btn" style="background:'+G+';margin-top:0;margin-bottom:12px">➕ Agregar Nuevo Apartamento</button>';
    }
    // ── Lista ─────────────────────────────────────────────────────────
    var list='<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:12px">📋 Lista de Apartamentos</div>'+
      S.apts.map(function(a,idx){
        return'<div class="irow">'+
          '<div style="flex:1;min-width:0">'+
          '<div style="font-weight:700;font-size:14px">'+esc(a.name)+'</div>'+
          '<div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap;align-items:center">'+
          '<span class="chip" style="background:#eff6ff;color:'+B+'">'+esc(a.client||"Sin cliente")+'</span>'+
          (a.valor>0?'<span class="chip" style="background:#f5f3ff;color:'+PU+'">'+pesos(a.valor)+'</span>':
          '<span class="chip" style="background:#f3f4f6;color:#9ca3af">Sin valor</span>')+
          '</div></div>'+
          '<div style="display:flex;gap:6px;flex-shrink:0">'+
          '<button onclick="editApt('+idx+')" style="background:#eff6ff;color:'+B+';border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:700;font-size:12px;font-family:inherit">✏️ Editar</button>'+
          '<button onclick="delApt('+idx+')" style="background:#fff1f2;color:'+R+';border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-family:inherit;font-size:13px">🗑️</button>'+
          '</div></div>';
      }).join("")+
      '</div>';
    return tabs+form+list;
  } else {
    // ── Trabajadores ──────────────────────────────────────────────────
    var wList='<div class="card">'+
      '<div style="font-weight:700;font-size:14px;margin-bottom:12px">➕ Agregar Trabajador</div>'+
      '<div style="display:flex;gap:8px">'+
      '<input id="nw" class="inp" type="text" placeholder="Nombre completo" style="flex:1;margin:0" onkeydown="if(event.key===\'Enter\')newWorker()">'+
      '<button onclick="newWorker()" style="background:'+G+';color:#fff;border:none;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:18px;font-family:inherit">+</button>'+
      '</div></div>'+
      '<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:12px">👤 Trabajadores Registrados</div>'+
      S.workers.map(function(w,i){
        if(S.ewIdx===i){
          return'<div class="irow">'+
            '<input id="ew" class="inp" type="text" style="flex:1;margin:0" value="'+esc(w)+'" onkeydown="if(event.key===\'Enter\')saveWorker()">'+
            '<div style="display:flex;gap:6px;margin-left:8px">'+
            '<button onclick="saveWorker()" style="background:'+G+';color:#fff;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:700;font-family:inherit">✓</button>'+
            '<button onclick="cancelWorker()" style="background:'+GR+';color:#fff;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;font-family:inherit">✕</button>'+
            '</div></div>';
        }
        return'<div class="irow">'+
          '<span style="font-size:14px;font-weight:500;flex:1">'+esc(w)+'</span>'+
          '<div style="display:flex;gap:6px">'+
          '<button onclick="editWorker('+i+')" style="background:#eff6ff;color:'+B+';border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:700;font-size:12px;font-family:inherit">✏️ Editar</button>'+
          '<button onclick="delWorker('+i+')" style="background:#fff1f2;color:'+R+';border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-family:inherit;font-size:13px">🗑️</button>'+
          '</div></div>';
      }).join("")+'</div>';
    return tabs+wList;
  }
}

// ── INICIO ────────────────────────────────────────────────────────────
loadCfg();
</script>
</body>
</html>
