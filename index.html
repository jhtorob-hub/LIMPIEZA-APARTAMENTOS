<script>
  // Detector de errores — solo muestra mensaje si el render REALMENTE no ocurrió.
  function bootError(msg){
    var el = document.getElementById("boot-msg");
    if(el){ el.innerHTML = msg; el.style.color="#f87171"; }
  }
  window.addEventListener("error", function(e){
    // Solo mostramos error si la app aún no se montó
    var root=document.getElementById("root");
    if(root && root.querySelector("#boot-msg")){
      bootError("⚠️ Error al cargar.<br>Recarga la página.<br><br><small style='color:#475569'>"+(e.message||"")+"</small>");
    }
  });
  // Chequeo final: 8s después, si SIGUE el mensaje de carga, las libs fallaron
  window.addEventListener("load", function(){
    setTimeout(function(){
      var root=document.getElementById("root");
      // Si el boot-msg ya no existe, la app montó bien — no hacemos nada
      if(!root || !root.querySelector("#boot-msg")) return;
      if(typeof React==="undefined" || typeof ReactDOM==="undefined"){
        bootError("⚠️ No se pudieron cargar las librerías (React).<br>Revisa tu conexión y recarga.");
      } else if(typeof firebase==="undefined"){
        bootError("⚠️ No se pudo cargar Firebase.<br>Revisa tu conexión y recarga.");
      } else {
        bootError("⚠️ La app no terminó de cargar.<br>Recarga la página (Ctrl+R).");
      }
    }, 8000);
  });
</script>

const findDuplicates = (cleanings) => {
  const g={};
  cleanings.forEach(c=>{const k=c.date+"|"+normTxt(c.apartmentName)+"|"+normTxt(c.employeeName);(g[k]=g[k]||[]).push(c);});
  const out=[];
  Object.values(g).filter(v=>v.length>1&&v.some(c=>!c.paid)).forEach(v=>{
    const s=[...v].sort((a,b)=>(b.paid?1:0)-(a.paid?1:0)||(b.notes||"").length-(a.notes||"").length||(a.createdAt||0)-(b.createdAt||0));
    s.slice(1).filter(c=>!c.paid).forEach(c=>out.push({...c,keepId:s[0].id}));
  });
  return out;
};

const econ = (price, mins, juegos, k, extra = 0) => {
  const p = Number(price) || 0;
  const hoy = k.preciosConIva ? p / (1 + k.ivaPct/100) : p;
  const aiu = k.preciosConIva ? p / (1 + (k.ivaPct/100) * (k.aiuPct/100)) : p;
  const fijo = k.insumos + k.admin + (juegos || 0) * k.lenceriaJuego + (Number(extra) || 0);
  const cost = mins == null ? null : (mins/60) * k.costoHora + fijo;
  return { hoy, aiu, cost,
    gHoy: cost == null ? null : hoy - cost,
    gAiu: cost == null ? null : aiu - cost,
    maxHoy: (hoy - fijo) / k.costoHora * 60,

};

const nombreDispositivo = () => {
  const ua=navigator.userAgent||"";
  if(/iPhone/i.test(ua)) return "iPhone";
  if(/iPad/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)) return "iPad";
  const m=ua.match(/Android[^;)]*;\s*([^;)]+?)(?:\sBuild|\))/i);
  if(/Android/i.test(ua)) return "Android"+(m&&m[1]&&!/^K$|wv/i.test(m[1].trim())?" · "+m[1].trim():"");
  if(/Windows/i.test(ua)) return "Computador Windows";
  if(/Mac/i.test(ua)) return "Mac";
  return "Otro equipo";
};

const FOTOS_FINALES = [["cama","Cama tendida"],["bano","Baño"],["cocina","Cocina"],["sala","Sala"],["zona","Zona profunda"]];
const compressImage = (file, maxW=900, q=0.6) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxW / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      res(cv.toDataURL("image/jpeg", q));
    };
    img.onerror = rej; img.src = r.result;
  };
  r.onerror = rej; r.readAsDataURL(file);
});

function FotoSlot({cleaningId,k,label,has,thumb,showToast}){
  const [busy,setBusy]=useState(false);
  const onFile=async(e)=>{
    const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
    setBusy(true);
    try{
      const data=await compressImage(f);
      const ts=Date.now();
      await CLEANINGS_COL.doc(cleaningId).collection("fotos").doc(k).set({data,ts,label});
      await CLEANINGS_COL.doc(cleaningId).update({[`fotos.${k}`]:ts});
      showToast(`📷 ${label}: guardada`);
    }catch(err){ console.error(err); showToast("No se pudo guardar la foto, intenta de nuevo","error"); }
    finally{ setBusy(false); }
  };
  return(
    <label style={{position:"relative",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6,minHeight:150,borderRadius:18,cursor:"pointer",overflow:"hidden",textAlign:"center",
      background:thumb?"#000":W.card,border:has?`2px solid ${W.brand}`:`2px dashed ${W.line}`}}>
      {thumb?<img src={thumb} alt={label} style={{position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"cover",opacity:0.9}}/>:<span style={{fontSize:34}}>📷</span>}
      <div style={{position:thumb?"absolute":"static",left:0,right:0,bottom:0,padding:thumb?"18px 10px 10px":"0 8px",background:thumb?"linear-gradient(transparent,rgba(0,0,0,0.7))":"none"}}>
        <div style={{fontSize:14,fontWeight:800,color:thumb?"#fff":W.ink}}>{label}</div>
        <div style={{fontSize:12,fontWeight:700,marginTop:2,color:busy?W.amber:thumb?"#d9f3ea":has?W.brand:W.muted}}>{busy?"Guardando…":has?"✓ Lista · tocar para cambiar":"Tocar para tomar"}</div>
      </div>
      <input type="file" accept="image/*" capture="environment" onChange={onFile} style={{display:"none"}}/>

// ── Video de ingreso / salida: se graba dentro de la app (máx. 4 min, 480p) y se sube a Firebase Storage ──
const VIDEO_MAX_SEG = 240;
const mmss = (s) => `${Math.floor((s||0)/60)}:${pad2(Math.floor((s||0)%60))}`;
const pickMime = () => {
  const c = ["video/mp4;codecs=avc1.42E01E,mp4a.40.2","video/mp4","video/webm;codecs=vp8,opus","video/webm"];
  try { for (const m of c) if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m; } catch(e) {}
  return "";
};

function VideoPaso({cleaningId,k,label,video,showToast,autoStart,onDone}){
  const [mode,setMode]=useState("idle"); // idle | starting | recording | uploading | error
  const [secs,setSecs]=useState(0);
  const [prog,setProg]=useState(0);
  const liveRef=useRef(null), recRef=useRef(null), streamRef=useRef(null), chunksRef=useRef([]), blobRef=useRef(null), timerRef=useRef(null), startRef=useRef(0);
  const canRecord=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
  const stopStream=()=>{ try{ streamRef.current&&streamRef.current.getTracks().forEach(t=>t.stop()); }catch(e){} streamRef.current=null; };
  useEffect(()=>()=>{ stopStream(); clearInterval(timerRef.current); },[]);
  useEffect(()=>{ if(mode==="recording"&&liveRef.current&&streamRef.current){ liveRef.current.srcObject=streamRef.current; liveRef.current.play().catch(()=>{}); } },[mode]);
  // Mientras graba, la pantalla no se apaga (si se apaga, el celular puede cortar la grabación)
  useEffect(()=>{
    if(mode!=="recording"||!("wakeLock" in navigator)) return;
    let lock=null, vivo=true;
    const pedir=()=>navigator.wakeLock.request("screen").then(l=>{ if(vivo) lock=l; else l.release(); }).catch(()=>{});
    pedir();
    const alVolver=()=>{ if(document.visibilityState==="visible") pedir(); };
    document.addEventListener("visibilitychange",alVolver);
    return ()=>{ vivo=false; document.removeEventListener("visibilitychange",alVolver); if(lock) lock.release().catch(()=>{}); };
  },[mode]);
  const upload=()=>{
    const v=blobRef.current; if(!v) return;
    if(!STORAGE){ setMode("error"); showToast("El almacenamiento de videos no está activo","error"); return; }
    const type=(v.blob.type||"video/webm").split(";")[0];
    const ref=STORAGE.ref(`limpiezas/${cleaningId}/${k}.${/mp4|quicktime/.test(type)?"mp4":"webm"}`);
    setMode("uploading"); setProg(0);
    const task=ref.put(v.blob,{contentType:type});
    task.on("state_changed",
      s=>setProg(s.totalBytes?Math.round(s.bytesTransferred/s.totalBytes*100):0),
      err=>{ console.error(err); setMode("error"); showToast("No se pudo subir el video. Toca Reintentar.","error"); },
      async()=>{
        try{
          const url=await ref.getDownloadURL();
          await CLEANINGS_COL.doc(cleaningId).update({[`videos.${k}`]:{url,path:ref.fullPath,dur:v.dur,size:v.blob.size,ts:Date.now()}});
          blobRef.current=null; setMode("idle"); showToast(`🎥 ${label}: subido ✅`);
          onDone&&onDone();
        }catch(e){ console.error(e); setMode("error"); showToast("El video subió pero no se pudo registrar. Toca Reintentar.","error"); }
      });
  };
  const startRec=async()=>{
    setMode("starting");
    try{
      const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:854},height:{ideal:480},frameRate:{ideal:24}},audio:true});
      streamRef.current=st;
      const mime=pickMime();
      const rec=new MediaRecorder(st,{...(mime?{mimeType:mime}:{}),videoBitsPerSecond:400000,audioBitsPerSecond:32000});
      chunksRef.current=[];
      rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunksRef.current.push(e.data); };
      rec.onstop=()=>{
        clearInterval(timerRef.current);
        const blob=new Blob(chunksRef.current,{type:rec.mimeType||mime||"video/webm"});
        blobRef.current={blob,dur:Math.round((Date.now()-startRef.current)/1000)};
        stopStream(); upload();
      };
      recRef.current=rec; rec.start(1000); startRef.current=Date.now(); setSecs(0); setMode("recording");
      timerRef.current=setInterval(()=>{ const s=Math.floor((Date.now()-startRef.current)/1000); setSecs(s); if(s>=VIDEO_MAX_SEG&&rec.state==="recording") rec.stop(); },500);
    }catch(e){ console.error(e); stopStream(); setMode("idle"); showToast("No se pudo abrir la cámara. Revisa los permisos del navegador.","error"); }
  };
  useEffect(()=>{ if(autoStart&&!video&&canRecord) startRec(); },[]);
  const stopRec=()=>{ try{ if(recRef.current&&recRef.current.state==="recording") recRef.current.stop(); }catch(e){} };
  const onFile=(e)=>{
    const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
    if(f.size>40*1024*1024){ showToast("El video pesa más de 40 MB. Grábalo más corto.","error"); return; }
    blobRef.current={blob:f,dur:null}; upload();
  };
  const frame={position:"relative",borderRadius:20,overflow:"hidden",background:"#0d1210",height:"42vh",minHeight:240,width:"100%"};
  const pct=Math.min(100,secs/VIDEO_MAX_SEG*100);
  return(
    <div>
      {(mode==="recording"||mode==="starting")&&(
        <div>
          <div style={frame}>
            <video ref={liveRef} muted playsInline autoPlay style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
            <div style={{position:"absolute",top:12,left:12,display:"flex",alignItems:"center",gap:8,background:"rgba(0,0,0,0.55)",color:"#fff",padding:"6px 12px",borderRadius:999,fontWeight:800,fontSize:15}}>
              <span style={{width:10,height:10,borderRadius:"50%",background:mode==="recording"?"#ff4d4d":"#999"}}/>{mode==="recording"?mmss(secs):"Abriendo cámara…"}
            </div>
            <div style={{position:"absolute",left:0,right:0,bottom:0,height:6,background:"rgba(255,255,255,0.2)"}}><div style={{width:`${pct}%`,height:"100%",background:"#ff4d4d"}}/></div>
          </div>
          <div style={{fontSize:13,color:W.muted,textAlign:"center",margin:"10px 0"}}>Máximo {mmss(VIDEO_MAX_SEG)} · se corta solo</div>
          <WBtn kind="danger" onClick={stopRec} disabled={mode!=="recording"}>■ Detener y subir</WBtn>
        </div>
      )}
      {mode==="uploading"&&(
        <div style={{...wCard,textAlign:"center"}}>
          <div style={{fontSize:34}}>☁️</div>
          <div style={{fontWeight:800,fontSize:17,marginTop:6}}>Subiendo {label.toLowerCase()} · {prog}%</div>
          <div style={{height:10,background:W.bg,borderRadius:6,overflow:"hidden",margin:"12px 0"}}><div style={{width:`${prog}%`,height:"100%",background:W.brand,transition:"width 0.3s"}}/></div>
          <div style={{fontSize:13,color:W.muted}}>No cierres la app. Puedes seguir con el siguiente paso mientras sube.</div>
        </div>
      )}
      {mode==="error"&&(
        <div style={{...wCard,borderColor:W.red,textAlign:"center"}}>
          <div style={{color:W.red,fontWeight:800,marginBottom:12}}>No se pudo subir el video</div>
          <WBtn onClick={upload}>↻ Reintentar subida</WBtn>
          <WBtn kind="ghost" onClick={()=>{blobRef.current=null;setMode("idle");}} style={{minHeight:40,fontSize:14,marginTop:4}}>Descartar y grabar de nuevo</WBtn>
        </div>
      )}
      {mode==="idle"&&video&&(
        <div>
          <video src={video.url} controls playsInline preload="metadata" style={{width:"100%",borderRadius:20,background:"#000",display:"block",maxHeight:"50vh"}}/>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10,gap:8}}>
            <span style={{color:W.brand,fontWeight:800,fontSize:14}}>✓ Subido{video.dur?` · ${mmss(video.dur)}`:""}{video.size?` · ${(video.size/1048576).toFixed(1)} MB`:""}</span>
            {canRecord&&<button onClick={startRec} style={{background:"transparent",border:"none",color:W.muted,fontWeight:700,fontSize:14,cursor:"pointer",fontFamily:"inherit",textDecoration:"underline"}}>Volver a grabar</button>}
          </div>
        </div>
      )}
      {mode==="idle"&&!video&&(canRecord
        ?<button onClick={startRec} style={{...frame,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,border:"none",cursor:"pointer",color:"#fff",fontFamily:"inherit"}}>
            <span style={{width:84,height:84,borderRadius:"50%",border:"5px solid #fff",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{width:60,height:60,borderRadius:"50%",background:"#ff4d4d"}}/></span>
            <span style={{fontWeight:800,fontSize:18}}>Grabar {label.toLowerCase()}</span>
            <span style={{fontSize:13,opacity:0.75}}>Máximo 4 minutos</span>
          </button>
        :<label style={{...frame,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,cursor:"pointer",color:"#fff"}}>
            <span style={{fontSize:44}}>🎥</span><span style={{fontWeight:800,fontSize:18}}>Grabar {label.toLowerCase()}</span>
            <input type="file" accept="video/*" capture="environment" onChange={onFile} style={{display:"none"}}/>
          </label>)}
    </div>
  );
}

// ── Lencería: piezas, peso aproximado (kg) y dotación normal por tipo de apartamento ──
const LENCERIA_ITEMS = [["sabanas","Sábanas",0.6],["fundas","Fundas de almohada",0.15],["toallasCuerpo","Toallas de cuerpo",0.5],["toallasMano","Toallas de mano",0.15],["tapetes","Tapetes de baño",0.4],["cobijas","Cobijas / edredones",1.5]];
const DOTACION = {
  estudio:{sabanas:2,fundas:2,toallasCuerpo:2,toallasMano:1,tapetes:1,cobijas:0},
  "1hab":{sabanas:2,fundas:2,toallasCuerpo:2,toallasMano:1,tapetes:1,cobijas:0},
  "2-3hab":{sabanas:4,fundas:4,toallasCuerpo:4,toallasMano:2,tapetes:2,cobijas:0},
};
const dotacionDe = (tipo) => ({...(DOTACION[tipo]||DOTACION.estudio)});
const kgDe = (m) => LENCERIA_ITEMS.reduce((s,[k,,kg])=>s+(Number((m||{})[k])||0)*kg,0);

function Stepper({value,onChange,color}){
  const b={width:44,height:44,borderRadius:12,border:`1.5px solid ${W.line}`,background:W.card,fontSize:22,fontWeight:800,color:W.ink,cursor:"pointer",fontFamily:"inherit",lineHeight:1};

      <button onClick={()=>onChange(value+1)} style={b}>+</button>
    </div>
  );
}

function LenceriaPaso({active,showToast,onDone}){
  const base=dotacionDe(active.tipo);
  const init=active.lenceria||{sale:base,entra:base,danada:{},nota:"",ok:false};
  const [l,setL]=useState(init);
  const timer=useRef(null);
  const save=(next)=>{ clearTimeout(timer.current); timer.current=setTimeout(()=>{ CLEANINGS_COL.doc(active.id).update({lenceria:next}).catch(e=>{console.error(e);showToast("No se pudo guardar el conteo","error");}); },500); };
  useEffect(()=>()=>clearTimeout(timer.current),[]);
  const set=(grupo,k,v)=>{ const next={...l,[grupo]:{...(l[grupo]||{}),[k]:v},ok:false}; setL(next); save(next); };
  const confirmar=()=>{ const next={...l,ok:true}; setL(next); clearTimeout(timer.current);
    CLEANINGS_COL.doc(active.id).update({lenceria:next}).then(()=>{showToast("🧺 Conteo de lencería guardado");onDone&&onDone();}).catch(e=>{console.error(e);showToast("No se pudo guardar el conteo","error");}); };
  const tot=(g)=>LENCERIA_ITEMS.reduce((s,[k])=>s+(Number((l[g]||{})[k])||0),0);
  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:14}}>
        {[["Sale sucia",tot("sale"),W.amber],["Entra limpia",tot("entra"),W.brand],["Dañada",tot("danada"),tot("danada")?W.red:W.muted]].map(([t,v,c])=>(
          <div key={t} style={{background:W.card,border:`1px solid ${W.line}`,borderRadius:14,padding:"10px 12px"}}><div style={{fontSize:11,fontWeight:700,color:W.muted}}>{t}</div><div style={{fontSize:22,fontWeight:800,color:c}}>{v}</div></div>
        ))}
      </div>
      {LENCERIA_ITEMS.map(([k,label])=>{
        const sale=Number((l.sale||{})[k])||0, entra=Number((l.entra||{})[k])||0, dan=Number((l.danada||{})[k])||0;
        return(
          <div key={k} style={{...wCard,padding:14,marginBottom:10}}>
            <div style={{fontSize:16,fontWeight:800,marginBottom:10}}>{label}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div><div style={{fontSize:12,fontWeight:800,color:W.amber,marginBottom:6}}>Sale sucia</div><Stepper value={sale} onChange={v=>set("sale",k,v)} color={W.amber}/></div>
              <div><div style={{fontSize:12,fontWeight:800,color:W.brand,marginBottom:6}}>Entra limpia</div><Stepper value={entra} onChange={v=>set("entra",k,v)} color={W.brand}/></div>
            </div>

// ── Resumen del día: horas trabajadas y tiempos muertos ──
const resumenDia = (cleanings, employee, now) => {
  const hoy=todayStr();
  const timed=cleanings.filter(c=>c.date===hoy&&c.employeeName===employee&&c.startedAt).sort((a,b)=>a.startedAt-b.startedAt);
  let trabajado=0, muerto=0; const rows=[];
  timed.forEach((c,i)=>{
    const dur=((c.finishedAt||now)-c.startedAt)/60000; trabajado+=dur;
    if(i>0&&timed[i-1].finishedAt){ const g=(c.startedAt-timed[i-1].finishedAt)/60000; if(g>0){ muerto+=g; rows.push({gap:g,key:"g"+c.id}); } }
    rows.push({c,dur,key:c.id});
  });
  return {timed,rows,trabajado,muerto};
};

function EmployeeView({appData,update,showToast,onLogout}){
  // Cada celular queda a nombre de una persona: se identifica una sola vez y no vuelve a pedir nada.
  // El admin ve qué celular es de quién (Config → Celulares) y puede desvincularlo.
  const [employee,setEmployeeRaw]=useState(()=>{ const x=leerSesion(); return x&&x.v==="employee"&&x.emp?x.emp:""; });
  const setEmployee=(nombre)=>{ setEmployeeRaw(nombre); if(nombre) guardarSesion({v:"employee",emp:nombre}); else borrarSesion(); };
  useEffect(()=>{ try{ localStorage.removeItem("lp_empleado"); }catch(e){} },[]);
  const [quien,setQuien]=useState("");   // nombre elegido, esperando que confirme
  const vincular=(nombre)=>{
    const ref=DISPOSITIVOS_COL&&DISPOSITIVOS_COL.doc(idDispositivo());
    setEmployee(nombre); setQuien("");
    showToast(`Listo ✅ Este celular quedó a nombre de ${nombreBonito(nombre)}`);
    if(ref) ref.set({emp:nombre,equipo:nombreDispositivo(),vinculado:Date.now(),ultimo:Date.now(),revocado:false},{merge:true}).catch(e=>console.error(e));
  };
  const desvincularEste=()=>{
    const ref=DISPOSITIVOS_COL&&DISPOSITIVOS_COL.doc(idDispositivo());
    if(ref) ref.set({revocado:true,ultimo:Date.now()},{merge:true}).catch(e=>console.error(e));
    setEmployee("");
  };
  // Si el admin desvincula este celular, vuelve a preguntar quién es
  useEffect(()=>{
    if(!employee||!DISPOSITIVOS_COL) return;
    const ref=DISPOSITIVOS_COL.doc(idDispositivo());
    let primera=true;
    const unsub=ref.onSnapshot(d=>{
      const x=d.exists?d.data():null;
      if(x&&x.revocado){ setEmployeeRaw(""); borrarSesion(); return; }
      if(primera){
        primera=false;
        // Celular que ya estaba adentro antes de esta versión: se registra solo
        ref.set(x?{ultimo:Date.now(),emp:employee}:{emp:employee,equipo:nombreDispositivo(),vinculado:Date.now(),ultimo:Date.now(),revocado:false},{merge:true}).catch(()=>{});
      }
    },()=>{});
    return ()=>unsub();
  },[employee]);
  const [now,setNow]=useState(Date.now());
  useEffect(()=>{ const t=setInterval(()=>setNow(Date.now()),15000); return ()=>clearInterval(t); },[]);
  const [saving,setSaving]=useState(false);
  const [activeNotes,setActiveNotes]=useState("");
  const [abierta,setAbierta]=useState(null);       // tarjeta del día expandida
  const [sheet,setSheet]=useState(false);          // apartamento no programado
  const [selBuilding,setSelBuilding]=useState("");
  const [selApt,setSelApt]=useState("");
  const [manualDate,setManualDate]=useState(todayStr());
  const [manualNotes,setManualNotes]=useState("");
  const [nAptNum,setNAptNum]=useState(""), [nBuilding,setNBuilding]=useState(""), [nClient,setNClient]=useState("");
  const hoy=todayStr();
  const sorted=[...appData.apartments].sort((a,b)=>a.building.localeCompare(b.building)||String(a.aptNumber).localeCompare(String(b.aptNumber),undefined,{numeric:true}));
  const buildings=[...new Set(sorted.map(a=>a.building).filter(Boolean))];
  const clients=[...new Set(appData.apartments.map(a=>a.clientName).filter(Boolean))].sort();
  const active=employee?appData.cleanings.find(c=>c.enCurso&&c.employeeName===employee):null;
  const aptObj=(id,name)=>appData.apartments.find(a=>a.id===id)||appData.apartments.find(a=>normTxt(a.displayName)===normTxt(name));

  // Anti-duplicados: el mismo apartamento no se registra dos veces el mismo día
  const okToSave=(d,apt)=>{
    const same=appData.cleanings.filter(c=>c.date===d&&(c.apartmentId===apt.id||normTxt(c.apartmentName)===normTxt(apt.displayName)));
    if(same.some(c=>normTxt(c.employeeName)===normTxt(employee))){ showToast(`${apt.displayName} ya está registrado por ti el ${fmtDate(d)}.`,"error"); return false; }
    if(same.length>0 && !window.confirm(`${apt.displayName} ya fue registrado el ${fmtDate(d)} por ${same.map(c=>c.employeeName||"otra persona").join(", ")}.\n\nSi lo hicieron juntas, NO lo registres otra vez: ya cuenta una vez.\n\n¿Registrarlo de todas formas?`)) return false;
    return true;
  };
  const saveNew=(d,apt,newC,okMsg)=>{
    setSaving(true);
    const ref=CLEANINGS_COL.doc(`${d}_${apt.id}_${employee}`.replace(/[\/\s]+/g,"-"));
    return db.runTransaction(async t=>{ const s=await t.get(ref); if(s.exists) throw new Error("DUPLICADO"); t.set(ref,newC); })
      .then(()=>showToast(okMsg))
      .catch(e=>{
        if(e&&e.message==="DUPLICADO"){ showToast("Esta limpieza ya estaba registrada, no se duplicó","error"); return; }
        console.error("Error guardando limpieza:",e); showToast("No se pudo guardar, revisa tu conexión e intenta de nuevo","error");
      })
      .finally(()=>setSaving(false));
  };
  // ▶ Empezar: hora y ubicación de llegada; luego la app pide el video de ingreso
  const startCleaning=async(apt)=>{
    if(!apt){ showToast("Elige el apartamento","error"); return; }
    if(!CLEANINGS_COL){ showToast("Sin conexión con la base de datos","error"); return; }
    if(active){ showToast(`Primero termina ${active.apartmentName}`,"error"); return; }
    if(!okToSave(hoy,apt)) return;
    // Si está en la agenda, se "toma" con una transacción para que dos personas no empiecen el mismo
    const enAgenda=(appData.agenda||[]).some(a=>a.date===hoy&&a.apartmentId===apt.id);
    if(enAgenda&&AGENDA_COL&&db){
      setSaving(true);
      const ref=AGENDA_COL.doc(`${hoy}_${apt.id}`);
      try{
        const quien=await db.runTransaction(async tx=>{
          const d=await tx.get(ref); const x=d.exists?d.data():{};
          const otra=x.tomadoPor&&x.tomadoPor!==employee&&((Date.now()-(x.tomadoAt||0))<120000||appData.cleanings.some(c=>c.date===hoy&&c.apartmentId===apt.id&&c.employeeName===x.tomadoPor));
          if(otra) return x.tomadoPor;
          tx.set(ref,{tomadoPor:employee,tomadoAt:Date.now()},{merge:true}); return null;
        });
        if(quien){ setSaving(false); setAbierta(null); showToast(`${nombreBonito(quien)} ya tomó ${apt.displayName}`,"error"); return; }
      }catch(e){ console.error(e); }
    }
    setSaving(true);
    const loc=await getPos();
    const ts=Date.now();
    const prevTimed=appData.cleanings.filter(c=>c.apartmentId===apt.id&&c.startedAt).length;
    const newC={date:hoy,time:new Date(ts).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"}),employeeName:employee,apartmentId:apt.id,apartmentName:apt.displayName||"",clientName:apt.clientName||"",notes:"",paid:false,amount:apt.price||0,createdAt:ts,
      enCurso:true,startedAt:ts,startLoc:loc,tipo:apt.tipo||"",zonaProfunda:ZONAS_PROFUNDAS.at(prevTimed%ZONAS_PROFUNDAS.length),checklist:{}};
    setActiveNotes(""); setAbierta(null); setSheet(false);
    saveNew(hoy,apt,newC,loc?"▶ Empezaste. Graba el video de ingreso":"▶ Empezaste (sin ubicación)");
  };
  const toggleCheck=(key)=>{
    if(!active) return;
    const cl={...(active.checklist||{}),[key]:!(active.checklist||{})[key]};
    CLEANINGS_COL.doc(active.id).update({checklist:cl}).catch(e=>{console.error(e);showToast("No se pudo guardar","error");});
  };
  const finishCleaning=async()=>{
    if(!active) return;
    const items=checklistFor(active.tipo);
    const total=items.length+1;
    const done=items.filter((_,i)=>(active.checklist||{})["i"+i]).length+((active.checklist||{}).zona?1:0);
    const faltanFotos=FOTOS_FINALES.filter(([k])=>!(active.fotos||{})[k]).map(([,l])=>l);
    const faltanVideos=[["entrada","video de ingreso"],["salida","video de salida"]].filter(([k])=>!(active.videos||{})[k]).map(([,l])=>l);
    const faltas=[];
    if(faltanVideos.length) faltas.push(faltanVideos.join(" y "));
    if(!(active.lenceria&&active.lenceria.ok)) faltas.push("conteo de lencería");
    if(done<total) faltas.push(`${total-done} tareas del checklist`);
    if(faltanFotos.length) faltas.push(`fotos: ${faltanFotos.join(", ")}`);
    if(faltas.length && !window.confirm(`Te falta:\n• ${faltas.join("\n• ")}\n\n¿Terminar de todas formas?`)) return;
    setSaving(true);
    const loc=await getPos();
    const fin=Date.now();
    CLEANINGS_COL.doc(active.id).update({enCurso:false,finishedAt:fin,endLoc:loc,durationMin:Math.round((fin-active.startedAt)/60000),notes:activeNotes.trim()||active.notes||""})
      .then(()=>{ showToast(`■ Terminado en ${fmtMin((fin-active.startedAt)/60000)} ✅`); setActiveNotes(""); })
      .catch(e=>{console.error(e);showToast("No se pudo terminar, revisa tu conexión","error");})
      .finally(()=>setSaving(false));
  };
  // Registro sin cronómetro (como antes), para limpiezas ya hechas
  const registrarManual=()=>{
    const apt=aptObj(selApt);
    if(!apt||!manualDate){ showToast("Elige apartamento y fecha","error"); return; }
    if(!okToSave(manualDate,apt)) return;
    const newC={date:manualDate,time:new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"}),employeeName:employee,apartmentId:apt.id,apartmentName:apt.displayName,clientName:apt.clientName||"",notes:manualNotes,paid:false,amount:apt.price||0,createdAt:Date.now()};
    saveNew(manualDate,apt,newC,"¡Limpieza registrada! ✅").then(()=>{ setManualNotes(""); setSheet(false); });
  };
  const handleAddApt=()=>{
    if(!nBuilding.trim()){ showToast("El edificio es requerido","error"); return; }
    const num=nAptNum.trim(), bld=nBuilding.trim();
    const displayName=num?`${num} ${bld}`:bld;
    APARTMENTS_COL.add({aptNumber:num,building:bld,displayName,clientName:nClient.trim()||"",price:0})
      .then(()=>{ setNAptNum("");setNBuilding("");setNClient(""); showToast(`${displayName} agregado ✅`); })
      .catch(e=>{ console.error(e); showToast("No se pudo agregar, intenta de nuevo","error"); });
  };

  const page={minHeight:"100vh",background:W.bg,color:W.ink};
  const wrap={maxWidth:520,margin:"0 auto",padding:"18px 16px 40px"};

  // 1b) Confirmar quién es (una sola vez en este celular)
  if(!employee&&quien) return(
    <div style={page}><div style={wrap}>
      <button onClick={()=>setQuien("")} style={{background:"none",border:"none",color:W.muted,fontWeight:700,fontSize:15,padding:0,cursor:"pointer",fontFamily:"inherit"}}>← Volver</button>

    <div style={page}><div style={wrap}>
      <div style={{fontSize:13,fontWeight:800,color:W.brand,textTransform:"uppercase",letterSpacing:"0.08em"}}>Limpieza Pro</div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        {appData.employees.map(e=>(
          <button key={e} onClick={()=>setQuien(e)} style={{...wCard,cursor:"pointer",fontFamily:"inherit",textAlign:"center",padding:"22px 10px"}}>
            <div style={{width:52,height:52,borderRadius:"50%",background:W.brandSoft,color:W.brand,fontWeight:900,fontSize:22,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 10px"}}>{e.slice(0,1)}</div>

  );

  // 2) Limpieza en curso → asistente por pasos
  if(active) return <CleaningWizard active={active} now={now} saving={saving} activeNotes={activeNotes} setActiveNotes={setActiveNotes} toggleCheck={toggleCheck} finishCleaning={finishCleaning} showToast={showToast}/>;

  // 3) Lista del día
  const agendaHoy=(appData.agenda||[]).filter(a=>a.date===hoy&&(!ASIGNAR_AGENDA||!a.asignadaA||a.asignadaA===employee));
  const estadoDe=(item)=>{
    const cs=appData.cleanings.filter(c=>c.date===hoy&&(c.apartmentId===item.apartmentId||normTxt(c.apartmentName)===normTxt(item.apartmentName)));
    const run=cs.find(c=>c.enCurso); if(run) return {k:"curso",c:run};
    if(cs.length) return {k:"hecho",c:cs[0]};
    return {k:"pendiente"};
  };
  const lista=agendaHoy.map(it=>({it,st:estadoDe(it)}));
  const orden={curso:0,pendiente:1,hecho:2};
  lista.sort((a,b)=>orden[a.st.k]-orden[b.st.k]||(a.it.checkIn||"99").localeCompare(b.it.checkIn||"99")||(a.it.apartmentName||"").localeCompare(b.it.apartmentName||""));
  const pendientes=lista.filter(x=>x.st.k==="pendiente").length, hechos=lista.filter(x=>x.st.k==="hecho").length;
  const {rows,trabajado,muerto,timed}=resumenDia(appData.cleanings,employee,now);
  const stat=(label,value,color)=>(<div style={{background:W.card,border:`1px solid ${W.line}`,borderRadius:16,padding:"12px 12px"}}><div style={{fontSize:11,fontWeight:700,color:W.muted}}>{label}</div><div style={{fontSize:20,fontWeight:800,color:color||W.ink,marginTop:2,letterSpacing:"-0.02em"}}>{value}</div></div>);
  const badge=(txt,bg,fg)=><span style={{display:"inline-block",whiteSpace:"nowrap",background:bg,color:fg,fontSize:12,fontWeight:800,padding:"5px 10px",borderRadius:999}}>{txt}</span>;

  return(
    <div style={page}><div style={wrap}>
      {/* Encabezado */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,marginBottom:18}}>
        <div>
          <div style={{fontSize:14,color:W.muted,fontWeight:600}}>{fechaLarga()}</div>
          <h1 style={{fontSize:28,fontWeight:800,letterSpacing:"-0.03em",margin:"2px 0 0"}}>Hola, {nombreBonito(employee)}</h1>
        </div>
        <div style={{display:"flex",gap:6}}>
          <button onClick={()=>{ if(window.confirm(`¿Este celular no es de ${nombreBonito(employee)}? Vas a elegir otro nombre.`)) desvincularEste(); }} style={{background:W.card,border:`1px solid ${W.line}`,borderRadius:12,padding:"8px 10px",fontSize:12,fontWeight:700,color:W.muted,cursor:"pointer",fontFamily:"inherit"}}>Cambiar</button>
          <button onClick={()=>{ if(window.confirm("¿Salir? Este celular deja de estar a tu nombre y tendrás que elegirlo otra vez.")) { desvincularEste(); onLogout(); } }} style={{background:W.card,border:`1px solid ${W.line}`,borderRadius:12,padding:"8px 10px",fontSize:12,fontWeight:700,color:W.muted,cursor:"pointer",fontFamily:"inherit"}}>Salir</button>
        </div>
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:22}}>
        {stat("Pendientes",String(pendientes),pendientes?W.amber:W.muted)}
        {stat("Hechos",String(hechos),W.brand)}
        {stat("Trabajado",timed.length?fmtMin(trabajado):"—")}
        {stat("Muerto",timed.length>1?fmtMin(muerto):"—",muerto?W.red:W.muted)}
      </div>

      {/* Apartamentos del día */}
      <div style={{fontSize:13,fontWeight:800,color:W.muted,textTransform:"uppercase",letterSpacing:"0.06em",marginBottom:10}}>Para hoy</div>
      {lista.length===0&&(
        <div style={{...wCard,textAlign:"center",padding:"28px 18px",marginBottom:12}}>
          <div style={{fontSize:34}}>🗓️</div>
          <div style={{fontWeight:800,fontSize:17,marginTop:6}}>No hay apartamentos programados hoy</div>
          <div style={{fontSize:14,color:W.muted,marginTop:4}}>Pídele la lista a coordinación o empieza uno que no esté en la lista.</div>
        </div>
      )}
      {lista.map(({it,st})=>{
        const open=abierta===it.id&&st.k==="pendiente";
        const apt=aptObj(it.apartmentId,it.apartmentName)||{id:it.apartmentId,displayName:it.apartmentName,clientName:it.clientName,price:0};
        const color=st.k==="hecho"?W.brand:st.k==="curso"?W.amber:W.ink;
        return(
          <div key={it.id} onClick={()=>st.k==="pendiente"&&setAbierta(open?null:it.id)} style={{...wCard,marginBottom:10,padding:0,overflow:"hidden",cursor:st.k==="pendiente"?"pointer":"default",opacity:st.k==="hecho"?0.75:1,borderColor:open?W.brand:W.line,borderWidth:open?2:1}}>
            <div style={{display:"flex",alignItems:"stretch"}}>
              <div style={{width:6,background:st.k==="hecho"?W.brand:st.k==="curso"?W.amber:W.line}}/>
              <div style={{flex:1,padding:"16px 16px 14px"}}>
                <div style={{fontSize:21,fontWeight:800,letterSpacing:"-0.02em",color}}>{st.k==="hecho"?"✓ ":""}{it.apartmentName}</div>
                <div style={{fontSize:13,color:W.muted,marginTop:2}}>{it.clientName||"—"}{apt.tipo?` · ${APT_TYPES[apt.tipo]}`:""}</div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:10}}>
                  {st.k==="pendiente"&&it.checkIn&&badge(`⏰ Listo antes de las ${hm12(it.checkIn)}`,W.amberSoft,W.amber)}
                  {ASIGNAR_AGENDA&&st.k==="pendiente"&&it.asignadaA&&badge("Asignado a ti",W.blueSoft,W.blue)}
                  {st.k==="curso"&&badge(`⏱ En curso · ${nombreBonito(st.c.employeeName)}`,W.amberSoft,W.amber)}
                  {st.k==="hecho"&&badge(`✓ Hecho${durMin(st.c)!=null?` en ${fmtMin(durMin(st.c))}`:""} · ${nombreBonito(st.c.employeeName)}`,W.brandSoft,W.brand)}
                </div>
                {it.nota&&<div style={{fontSize:13,color:W.ink,background:W.bg,borderRadius:10,padding:"8px 10px",marginTop:10}}>📝 {it.nota}</div>}
                {open&&(
                  <div style={{marginTop:14}} onClick={e=>e.stopPropagation()}>
                    <WBtn onClick={()=>startCleaning(apt)} disabled={saving} style={{minHeight:60,fontSize:17}}>{saving?"Abriendo…":"🎥 Empezar y grabar ingreso"}</WBtn>
                    <div style={{fontSize:12,color:W.muted,textAlign:"center",marginTop:8}}>Se guarda la hora y tu ubicación de llegada</div>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      })}

      <WBtn kind="secondary" onClick={()=>setSheet(!sheet)} style={{marginTop:6}}>{sheet?"✕ Cerrar":"＋ Un apartamento que no está en la lista"}</WBtn>
      {sheet&&(
        <div style={{...wCard,marginTop:10}}>
          <div style={{fontSize:13,fontWeight:800,color:W.muted,marginBottom:6}}>Edificio</div>
          <select value={selBuilding} onChange={e=>{setSelBuilding(e.target.value);setSelApt("");}} style={{...wInput,marginBottom:12}}>
            <option value="">Elige el edificio</option>{buildings.map(b=><option key={b} value={b}>{b}</option>)}
          </select>
          {selBuilding&&<>
            <div style={{fontSize:13,fontWeight:800,color:W.muted,marginBottom:6}}>Apartamento</div>
            <select value={selApt} onChange={e=>setSelApt(e.target.value)} style={{...wInput,marginBottom:14}}>
              <option value="">Elige el apartamento</option>{sorted.filter(a=>a.building===selBuilding).map(a=><option key={a.id} value={a.id}>{a.displayName}{a.clientName?` — ${a.clientName}`:""}</option>)}
            </select>
          </>}
          <WBtn onClick={()=>startCleaning(aptObj(selApt))} disabled={!selApt||saving}>🎥 Empezar y grabar ingreso</WBtn>
          <details style={{marginTop:16}}>
            <summary style={{cursor:"pointer",color:W.muted,fontSize:14,fontWeight:700}}>Registrar una limpieza ya hecha (sin cronómetro)</summary>
            <div style={{marginTop:12}}>
              <div style={{fontSize:13,fontWeight:800,color:W.muted,marginBottom:6}}>Fecha</div>
              <input type="date" value={manualDate} onChange={e=>setManualDate(e.target.value)} style={{...wInput,marginBottom:10}}/>
              <textarea value={manualNotes} onChange={e=>setManualNotes(e.target.value)} rows={2} placeholder="Observaciones (opcional)" style={{...wInput,marginBottom:10,resize:"vertical"}}/>
              <WBtn kind="secondary" onClick={registrarManual} disabled={!selApt||saving}>✓ Registrar sin cronómetro</WBtn>
            </div>
          </details>
          <details style={{marginTop:12}}>
            <summary style={{cursor:"pointer",color:W.muted,fontSize:14,fontWeight:700}}>El apartamento no aparece: agregarlo</summary>
            <div style={{marginTop:12,display:"grid",gap:10}}>
              <input value={nAptNum} onChange={e=>setNAptNum(e.target.value)} placeholder="Número (ej: 303)" style={wInput}/>
              <input list="w-blist" value={nBuilding} onChange={e=>setNBuilding(e.target.value)} placeholder="Edificio (ej: Monserrate)" style={wInput}/><datalist id="w-blist">{buildings.map(b=><option key={b} value={b}/>)}</datalist>
              <input list="w-clist" value={nClient} onChange={e=>setNClient(e.target.value)} placeholder="Cliente" style={wInput}/><datalist id="w-clist">{clients.map(c=><option key={c} value={c}/>)}</datalist>
              <WBtn kind="secondary" onClick={handleAddApt}>＋ Agregar apartamento</WBtn>
            </div>
          </details>
        </div>
      )}

      {/* Mi día */}
      {rows.length>0&&<>
        <div style={{fontSize:13,fontWeight:800,color:W.muted,textTransform:"uppercase",letterSpacing:"0.06em",margin:"26px 0 10px"}}>Mi día</div>
        <div style={{...wCard,padding:"6px 16px"}}>
          {rows.map(r=>r.gap!=null?(
            <div key={r.key} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0 8px 6px",color:W.red,fontSize:13,fontWeight:800}}>
              <span style={{width:2,height:22,background:W.redSoft,borderRadius:1,marginLeft:4}}/>⏸ Tiempo muerto {fmtMin(r.gap)}
            </div>
          ):(
            <div key={r.key} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,padding:"12px 0",borderBottom:`1px solid ${W.line}`}}>
              <div>
                <div style={{fontWeight:800,fontSize:15}}>{r.c.apartmentName}</div>
                <div style={{fontSize:12,color:W.muted,marginTop:2}}>{toHM(r.c.startedAt)} → {r.c.finishedAt?toHM(r.c.finishedAt):"en curso"} · 🎥 {Object.keys(r.c.videos||{}).length} · 📷 {Object.keys(r.c.fotos||{}).length}{r.c.lenceria?` · 🧺 ${LENCERIA_ITEMS.reduce((t,[k])=>t+(Number((r.c.lenceria.sale||{})[k])||0),0)}`:""}</div>
              </div>
              <div style={{fontWeight:800,fontSize:15,color:r.c.finishedAt?W.ink:W.amber}}>{fmtMin(r.dur)}</div>
            </div>
          ))}
        </div>
      </>}

      <details style={{marginTop:24}}>
        <summary style={{cursor:"pointer",color:W.muted,fontSize:14,fontWeight:700}}>Ver historial de limpiezas</summary>
        <div style={{background:C.bg,borderRadius:16,padding:12,marginTop:10,color:C.text}}><CleaningHistoryEmployee cleanings={appData.cleanings}/></div>
      </details>
    </div></div>
  );
}

function BackupSection({appData,update,showToast}){
  const firstDay=todayStr().slice(0,8)+"01";
  const [dateFrom,setDateFrom]=useState(firstDay);
  const [dateTo,setDateTo]=useState(todayStr());
  const fileRef=React.useRef(null);
  const inpStyle={width:"100%",padding:"10px 14px",background:"#0b0f18",border:`1px solid ${C.border}`,borderRadius:"8px",color:C.text,fontSize:"14px",outline:"none",boxSizing:"border-box",fontFamily:"inherit"};

  const toCSV=(rows,headers)=>{
    const esc=(v)=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
    return[headers.map(esc).join(","),...rows.map(r=>headers.map(h=>esc(r[h])).join(","))].join("\n");
  };

  const downloadExcel=()=>{
    const filtered=appData.cleanings.filter(c=>{
      if(dateFrom&&c.date<dateFrom)return false;
      if(dateTo&&c.date>dateTo)return false;
      return true;
    }).sort((a,b)=>a.date?.localeCompare(b.date)||a.createdAt-b.createdAt);
    if(filtered.length===0){showToast("No hay registros en ese rango","error");return;}

    const headers=["Fecha","Hora","Encargado","Apartamento","Cliente","Observaciones","Valor","Pagado"];
    const rows=filtered.map(c=>({"Fecha":fmtDate(c.date),"Hora":c.time||"","Encargado":c.employeeName||"","Apartamento":c.apartmentName||"","Cliente":c.clientName||"","Observaciones":c.notes||"","Valor":c.amount||0,"Pagado":c.paid?"Sí":"No"}));

    const byEmp={};
    filtered.forEach(c=>{if(!byEmp[c.employeeName])byEmp[c.employeeName]={limpiezas:0,total:0,pagado:0,pendiente:0};byEmp[c.employeeName].limpiezas++;byEmp[c.employeeName].total+=c.amount||0;if(c.paid)byEmp[c.employeeName].pagado+=c.amount||0;else byEmp[c.employeeName].pendiente+=c.amount||0;});
    const empRows=Object.entries(byEmp).map(([n,d])=>({"Encargado":n,"Limpiezas":d.limpiezas,"Total":d.total,"Pagado":d.pagado,"Pendiente":d.pendiente}));

    const byClient={};
    filtered.forEach(c=>{const k=c.clientName||"Sin cliente";if(!byClient[k])byClient[k]={limpiezas:0,total:0,pagado:0,pendiente:0};byClient[k].limpiezas++;byClient[k].total+=c.amount||0;if(c.paid)byClient[k].pagado+=c.amount||0;else byClient[k].pendiente+=c.amount||0;});
    const clientRows=Object.entries(byClient).map(([n,d])=>({"Cliente":n,"Limpiezas":d.limpiezas,"Total":d.total,"Pagado":d.pagado,"Pendiente":d.pendiente}));

    const sep="\n\n";
    const csv="﻿"+"REGISTROS DE LIMPIEZAS\n"+toCSV(rows,headers)+sep+"RESUMEN POR ENCARGADO\n"+toCSV(empRows,["Encargado","Limpiezas","Total","Pagado","Pendiente"])+sep+"RESUMEN POR CLIENTE\n"+toCSV(clientRows,["Cliente","Limpiezas","Total","Pagado","Pendiente"]);
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`limpiezas-${dateFrom}-al-${dateTo}.csv`;a.click();
    URL.revokeObjectURL(url);
    showToast(`Excel descargado — ${filtered.length} registros ✅`);
  };

  const downloadJson=()=>{
    const blob=new Blob([JSON.stringify(appData,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=`backup-${todayStr()}.json`;a.click();
    URL.revokeObjectURL(url);showToast("Backup completo descargado ✅");
  };

  const uploadBackup=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const p=JSON.parse(ev.target.result);
        if(!p.apartments||!p.cleanings||!p.employees||!p.settings){showToast("Archivo inválido","error");return;}
        if(!window.confirm("¿Restaurar este backup? Se reemplazarán todos los datos actuales."))return;
        update("settings",p.settings);
        DOC_REF.update({"state.employees":p.employees}).catch(e=>console.error(e));
        CLEANINGS_COL.get().then(snap=>{
          const batch=db.batch();
          snap.docs.forEach(d=>batch.delete(d.ref));
          p.cleanings.forEach(c=>{const {id,...rest}=c;batch.set(CLEANINGS_COL.doc(id||uid()),rest);});
          return batch.commit();
        }).then(()=>showToast("Registros de limpieza restaurados ✅"))
          .catch(e=>{console.error(e);showToast("Error al restaurar los registros","error");});
        APARTMENTS_COL.get().then(snap=>{
          const batch=db.batch();
          snap.docs.forEach(d=>batch.delete(d.ref));
          p.apartments.forEach(a=>{const {id,...rest}=a;batch.set(APARTMENTS_COL.doc(id||uid()),rest);});
          return batch.commit();
        }).then(()=>showToast("Apartamentos restaurados ✅"))
          .catch(e=>{console.error(e);showToast("Error al restaurar los apartamentos","error");});
      }catch(err){showToast("Error al leer el archivo","error");}
    };
    reader.readAsText(file);e.target.value="";
  };

  const count=appData.cleanings.filter(c=>(!dateFrom||c.date>=dateFrom)&&(!dateTo||c.date<=dateTo)).length;

  return(
    <div style={{maxWidth:560}}>
      <h3 style={{margin:"0 0 20px",fontSize:17,fontWeight:800}}>💾 Backup y exportación</h3>
      <Card style={{marginBottom:16}}>
        <h4 style={{margin:"0 0 6px",fontSize:14,fontWeight:700,color:C.accent}}>📊 Exportar a Excel</h4>
        <p style={{margin:"0 0 16px",fontSize:13,color:C.muted,lineHeight:1.5}}>Exporta los registros en formato CSV (compatible con Excel y Google Sheets). Filtra por rango de fechas. Incluye registros, resumen por encargado y resumen por cliente.</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
          <div><div style={{fontSize:11,fontWeight:600,color:C.muted,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:6}}>Desde</div><input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)} style={inpStyle}/></div>
          <div><div style={{fontSize:11,fontWeight:600,color:C.muted,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:6}}>Hasta</div><input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)} style={inpStyle}/></div>
        </div>
        <button onClick={downloadExcel} style={{width:"100%",padding:"13px",background:"#14532d",border:`1px solid ${C.success}`,borderRadius:8,color:C.success,cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:700}}>
          ⬇️ Descargar Excel ({count} registros)
        </button>
      </Card>
      <Card>
        <h4 style={{margin:"0 0 6px",fontSize:14,fontWeight:700,color:C.info}}>🗄️ Backup completo</h4>
        <p style={{margin:"0 0 16px",fontSize:13,color:C.muted,lineHeight:1.5}}>Descarga o restaura un backup de todos los datos: apartamentos, encargados, configuración y registros históricos.</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <button onClick={downloadJson} style={{padding:"12px",background:"#1e3a5f",border:`1px solid ${C.info}`,borderRadius:8,color:C.info,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700}}>⬇️ Descargar backup</button>
          <button onClick={()=>fileRef.current.click()} style={{padding:"12px",background:"#450a0a",border:`1px solid ${C.danger}`,borderRadius:8,color:C.danger,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700}}>⬆️ Restaurar backup</button>
        </div>
        <input ref={fileRef} type="file" accept=".json" onChange={uploadBackup} style={{display:"none"}}/>
        <div style={{marginTop:12,padding:"10px 12px",background:"#0b0f18",borderRadius:8,fontSize:11,color:C.muted}}>⚠️ Al restaurar se reemplazarán <strong style={{color:C.text}}>todos los datos actuales</strong>.</div>
      </Card>
    </div>
  );
}

function CleaningHistoryEmployee({cleanings}){
  const [dateFrom,setDateFrom]=useState(todayStr());
  const [dateTo,setDateTo]=useState(todayStr());
  const filtered=cleanings
    .filter(c=>{
      if(dateFrom&&c.date<dateFrom) return false;
      if(dateTo&&c.date>dateTo) return false;
      return true;
    })
    .sort((a,b)=>b.date!==a.date?b.date?.localeCompare(a.date):b.createdAt-a.createdAt);
  return(
    <div style={{marginTop:8}}>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}}>
          <span style={{fontWeight:700,fontSize:14}}>📋 Limpiezas registradas</span>
          <span style={{fontSize:12,color:C.muted}}>{filtered.length} resultado{filtered.length!==1?"s":""}</span>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          <div>
            <div style={{fontSize:11,fontWeight:600,color:C.muted,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:6}}>Desde</div>
            <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)}
              style={{width:"100%",padding:"10px 14px",background:"#0b0f18",border:`1px solid ${C.border}`,borderRadius:"8px",color:"#dce8f4",fontSize:"14px",outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/>
          </div>
          <div>
            <div style={{fontSize:11,fontWeight:600,color:C.muted,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:6}}>Hasta</div>
            <input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)}
              style={{width:"100%",padding:"10px 14px",background:"#0b0f18",border:`1px solid ${C.border}`,borderRadius:"8px",color:"#dce8f4",fontSize:"14px",outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}/>
          </div>
        </div>
        {filtered.length===0
          ?<div style={{textAlign:"center",padding:24,color:C.muted,fontSize:13}}>No hay limpiezas en este rango de fechas</div>
          :filtered.map(c=>(
            <div key={c.id} style={{padding:"12px",marginBottom:8,background:"#0b0f18",borderRadius:8,border:`1px solid ${C.border}`}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                <div>
                  <div style={{fontWeight:700,fontSize:14}}>{c.apartmentName}</div>
                  <div style={{fontSize:12,color:C.muted,marginTop:3}}>
                    {c.clientName&&<span style={{color:"#3b82f6",fontWeight:600}}>{c.clientName} · </span>}
                    <span>{c.employeeName}</span>
                    {c.time&&<span> · {c.time}</span>}
                  </div>
                  {c.notes&&<div style={{fontSize:12,color:C.muted,marginTop:4,fontStyle:"italic"}}>"{c.notes}"</div>}
                </div>
                <div style={{fontSize:11,color:C.muted,whiteSpace:"nowrap"}}>{fmtDate(c.date)}</div>
              </div>
            </div>
          ))
        }
      </div>
    </div>
  );

function DashboardTab({appData}){
  const {cleanings}=appData;
  const today=todayStr(), thisMonth=today.slice(0,7);

  // Stats
  const todayC   = cleanings.filter(c=>c.date===today);
  const monthC   = cleanings.filter(c=>c.date&&c.date.startsWith(thisMonth));
  const allPending= cleanings.filter(c=>!c.paid);
  const totalPending=allPending.reduce((s,c)=>s+(c.amount||0),0);
  const totalMonth  =monthC.reduce((s,c)=>s+(c.amount||0),0);
  const paidMonth   =monthC.filter(c=>c.paid).reduce((s,c)=>s+(c.amount||0),0);
  const totalAll    =cleanings.reduce((s,c)=>s+(c.amount||0),0);
  const paidAll     =cleanings.filter(c=>c.paid).reduce((s,c)=>s+(c.amount||0),0);

  // Month-by-month breakdown (all history)
  const byMonth={};
  cleanings.forEach(c=>{
    if(!c.date) return;
    const m=c.date.slice(0,7);
    if(!byMonth[m]) byMonth[m]={month:m,count:0,total:0,paid:0,pending:0};
    byMonth[m].count++;
    byMonth[m].total+=c.amount||0;
    if(c.paid) byMonth[m].paid+=c.amount||0;
    else byMonth[m].pending+=c.amount||0;
  });
  const months=Object.values(byMonth).sort((a,b)=>b.month.localeCompare(a.month));
  const fmtMonth=m=>{ const [y,mo]=m.split("-"); const names=["","Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"]; return `${names[parseInt(mo)]} ${y}`; };

  const recent=[...cleanings].sort((a,b)=>b.createdAt-a.createdAt).slice(0,10);

  return(
    <div>
      <h2 style={{margin:"0 0 20px",fontSize:22,fontWeight:800}}>Resumen general</h2>

      {/* KPI cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:16,marginBottom:24}}>
        {[
          {label:"Limpiezas hoy",       value:todayC.length,        color:C.info,    icon:"🧹", sub:"registros de hoy"},
          {label:"Este mes",            value:monthC.length,        color:C.accent,  icon:"📅", sub:`${fmtCOP(totalMonth)} facturado`},
          {label:"Cobrado este mes",    value:fmtCOP(paidMonth),    color:C.success, icon:"💰", sub:`de ${fmtCOP(totalMonth)} total`},
          {label:"⚠️ Por cobrar total", value:fmtCOP(totalPending), color:C.danger,  icon:"⏳", sub:`${allPending.length} registros pendientes`},
        ].map(s=><Card key={s.label} style={{borderTop:`3px solid ${s.color}`}}><div style={{fontSize:28,marginBottom:8}}>{s.icon}</div><div style={{fontSize:22,fontWeight:800,color:s.color}}>{s.value}</div><div style={{fontSize:13,color:C.muted,marginTop:4}}>{s.label}</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>{s.sub}</div></Card>)}
      </div>

      {/* Month comparison */}
      {months.length>0&&(
        <Card style={{marginBottom:24}}>
          <h3 style={{margin:"0 0 4px",fontSize:15,fontWeight:700}}>📆 Comparativo mes a mes</h3>
          <p style={{margin:"0 0 16px",fontSize:12,color:C.muted}}>Historial completo guardado — nunca se pierde</p>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead>
                <tr style={{borderBottom:`1px solid ${C.border}`}}>
                  {["Mes","Limpiezas","Facturado","Cobrado","Pendiente"].map(h=><th key={h} style={{textAlign:"left",padding:"8px 12px",color:C.muted,fontWeight:700}}>{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {months.map(m=>(
                  <tr key={m.month} style={{borderBottom:`1px solid ${C.border}`,background:m.month===thisMonth?"#1a2a1a":"transparent"}}>
                    <td style={{padding:"10px 12px",fontWeight:700,color:m.month===thisMonth?C.success:C.text}}>{fmtMonth(m.month)}{m.month===thisMonth&&<span style={{marginLeft:6,fontSize:10,color:C.success,fontWeight:600}}>● actual</span>}</td>
                    <td style={{padding:"10px 12px",color:C.muted}}>{m.count}</td>
                    <td style={{padding:"10px 12px",fontWeight:600}}>{fmtCOP(m.total)}</td>
                    <td style={{padding:"10px 12px",color:C.success,fontWeight:600}}>{fmtCOP(m.paid)}</td>
                    <td style={{padding:"10px 12px",color:m.pending>0?C.danger:C.muted,fontWeight:m.pending>0?700:400}}>{m.pending>0?fmtCOP(m.pending):"—"}</td>
                  </tr>
                ))}
                <tr style={{borderTop:`2px solid ${C.border}`,background:C.surface}}>
                  <td style={{padding:"10px 12px",fontWeight:800,color:C.text}}>TOTAL</td>
                  <td style={{padding:"10px 12px",fontWeight:800}}>{cleanings.length}</td>
                  <td style={{padding:"10px 12px",fontWeight:800}}>{fmtCOP(totalAll)}</td>
                  <td style={{padding:"10px 12px",fontWeight:800,color:C.success}}>{fmtCOP(paidAll)}</td>
                  <td style={{padding:"10px 12px",fontWeight:800,color:C.danger}}>{fmtCOP(totalPending)}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </Card>
      )}

      {/* Pending payments — never lost */}
      {allPending.length>0&&(
        <Card style={{marginBottom:24,borderLeft:`4px solid ${C.danger}`}}>
          <h3 style={{margin:"0 0 4px",fontSize:15,fontWeight:700,color:C.danger}}>⏳ Pendientes por cobrar ({allPending.length})</h3>
          <p style={{margin:"0 0 14px",fontSize:12,color:C.muted}}>Registros de todos los meses sin pagar — {fmtCOP(totalPending)}</p>
          <div style={{maxHeight:260,overflowY:"auto"}}>
            {[...allPending].sort((a,b)=>a.date?.localeCompare(b.date)).map(c=>(
              <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
                <div>
                  <div style={{fontSize:13,fontWeight:600}}>{c.apartmentName} <span style={{color:C.info,fontWeight:400}}>· {c.clientName}</span></div>
                  <div style={{fontSize:11,color:C.muted,marginTop:2}}>{fmtDate(c.date)} · {c.employeeName}</div>
                </div>
                <span style={{color:C.danger,fontWeight:800,fontSize:13,whiteSpace:"nowrap"}}>{fmtCOP(c.amount)}</span>
              </div>
            ))}
          </div>
        </Card>
      )}

      {/* Recent */}
      <Card>
        <h3 style={{margin:"0 0 16px",fontSize:15,fontWeight:700}}>Registros recientes</h3>
        {recent.length===0?<div style={{textAlign:"center",padding:40,color:C.muted}}>No hay registros aún.</div>:(
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead><tr style={{borderBottom:`1px solid ${C.border}`}}>{["Fecha","Encargado","Apartamento","Cliente","Valor","Estado"].map(h=><th key={h} style={{textAlign:"left",padding:"8px 12px",color:C.muted,fontWeight:700}}>{h}</th>)}</tr></thead>
              <tbody>{recent.map(c=><tr key={c.id} style={{borderBottom:`1px solid ${C.border}`}}><td style={{padding:"10px 12px",color:C.muted}}>{fmtDate(c.date)}</td><td style={{padding:"10px 12px",fontWeight:700}}>{c.employeeName}</td><td style={{padding:"10px 12px"}}>{c.apartmentName}</td><td style={{padding:"10px 12px",color:C.info,fontWeight:600}}>{c.clientName||"—"}</td><td style={{padding:"10px 12px",color:C.accent,fontWeight:700}}>{fmtCOP(c.amount)}</td><td style={{padding:"10px 12px"}}><Badge paid={c.paid}/></td></tr>)}</tbody>
            </table>
          </div>
        )}
      </Card>
    </div>
  );
}

    const f={...form};
    const ts=(hm)=>hm?new Date(`${f.date}T${hm}:00`).getTime():null;

    if(isNew&&(!f.date||!f.employeeName||!f.apartmentId)){ window.alert("Elige fecha, encargado y apartamento"); return; }
    if(s&&e&&e<=s){ window.alert("La hora de salida debe ser después de la de entrada"); return; }

          <select value={form.apartmentId||""} onChange={e=>handleApt(e.target.value)} style={{width:"100%",padding:"10px 14px",background:"#0b0f18",border:`1px solid ${C.border}`,borderRadius:"8px",color:C.text,fontSize:"14px",outline:"none",boxSizing:"border-box",fontFamily:"inherit"}}>
            <option value="">-- Selecciona --</option>
            {buildingGroups.map(b=><optgroup key={b} label={`📍 ${b}`}>{sorted.filter(a=>a.building===b).map(a=><option key={a.id} value={a.id}>{a.displayName}{a.clientName?` — ${a.clientName}`:""}</option>)}</optgroup>)}
