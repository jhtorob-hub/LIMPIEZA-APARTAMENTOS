// ── MARCA DE AGUA ─────────────────────────────────────────────────────
function addWatermark(dataURL, isVideo, label, cb) {
  if (isVideo) { cb(dataURL); return; } // videos sin marca
  var img = new Image();
  img.onload = function() {
    var canvas = document.createElement("canvas");
    canvas.width = img.width; canvas.height = img.height;
    var ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0);
    // Fondo semitransparente abajo
    var barH = Math.max(48, img.height * 0.08);
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, img.height - barH, img.width, barH);
    // Texto
    var fs = Math.max(14, Math.round(img.width * 0.032));
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold " + fs + "px system-ui,sans-serif";
    ctx.textBaseline = "middle";
    var y = img.height - barH / 2;
    ctx.fillText(label, 12, y);
    cb(canvas.toDataURL("image/jpeg", 0.88));
  };
  img.src = dataURL;
}

function buildWatermarkLabel(apt, folder) {
  var now = new Date();
  var fecha = now.toLocaleDateString("es-CO", {day:"2-digit",month:"2-digit",year:"numeric"});
  var hora  = now.toLocaleTimeString("es-CO", {hour:"2-digit",minute:"2-digit"});
  var tipo  = folder==="entrada"?"ENTRADA":folder==="salida"?"SALIDA":"DAÑOS";
  return tipo + "  " + (apt||"") + "  " + fecha + "  " + hora;
}

function getLocation() {
  return new Promise(function(resolve) {
    if (!navigator.geolocation) { resolve(""); return; }
    navigator.geolocation.getCurrentPosition(
      function(pos) { resolve(pos.coords.latitude.toFixed(5)+","+pos.coords.longitude.toFixed(5)); },
      function() { resolve(""); },
      {timeout:5000}
    );
  });
}

// ── SUBIR A GOOGLE DRIVE ──────────────────────────────────────────────
function uploadToDrive(dataURL, name, subfolder) {
  var parts = dataURL.split(",");
  var mime  = parts[0].match(/:(.*?);/)[1];
  var b64   = parts[1];
  return fetch(SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({ base64: b64, mime: mime, name: name, subfolder: subfolder })
  }).then(function(r){ return r.json(); }).then(function(j){
    return j.ok ? j.url : null;
  }).catch(function(){ return null; });
}

function saveMediaGroup(items, sid, folder, apt) {
  if (!items.length) return Promise.resolve([]);
  var subfolder = (apt||"limpieza").replace(/[^a-zA-Z0-9 ]/g,"").trim() + " — " + sid.slice(-6);
  var label = buildWatermarkLabel(apt, folder);
  var promises = items.map(function(it, i) {
    return new Promise(function(resolve) {
      addWatermark(it.url, it.isVideo, label, function(marked) {
        var ext  = it.isVideo ? "mp4" : "jpg";
        var name = folder + "_" + (i+1) + "_" + Date.now() + "." + ext;
        uploadToDrive(marked, name, subfolder).then(function(url) {
          // Guardar referencia en Firestore
          var doc = { sid:sid, folder:folder, idx:i, url:url||marked, isVideo:it.isVideo, ts:firebase.firestore.Timestamp.now() };
          db.collection("media").add(doc).then(function(){ resolve({url:url||marked,isVideo:it.isVideo}); }).catch(function(){ resolve({url:marked,isVideo:it.isVideo}); });
        });
      });
    });
  });
  return Promise.all(promises);
}

function loadMediaGroup(sid, folder) {
  return db.collection("media")
    .where("sid","==",sid).where("folder","==",folder).orderBy("idx","asc")
    .get().then(function(snap){
      return snap.docs.map(function(d){ return {url:d.data().url,isVideo:d.data().isVideo}; });
    }).catch(function(){ return []; });
}

function finalizarLimpieza(){
  clearInterval(S.tint);S.tint=null;
  var end=new Date();
  S.modal=false;S.uploading=true;S.uploadPct=0;
  S.lastRec={who:S.who,apt:aptL(S.apt),client:S.apt.client,valor:Number(S.apt.valor)||0,
    stime:S.stime,end:end,dur:S.t,novs:S.novs};
  S.screen="summary";render();
  var sid=S.sid;
  var total=(S.emIn.length+S.emDan.length+S.emOut.length)||1;
  var done=0;
  function prog(){done++;S.uploadPct=Math.round(done/total*100);var el=document.getElementById("ubar");if(el)el.style.width=S.uploadPct+"%"}
  Promise.all([
    saveMediaGroup(S.emIn,sid,"entrada",aptL(S.apt)),
    saveMediaGroup(S.emDan,sid,"danos",aptL(S.apt)),
    saveMediaGroup(S.emOut,sid,"salida",aptL(S.apt))
  ]).then(function(){
    return db.collection("limpiezas").doc(sid).update({
      status:"completed",
      endTime:firebase.firestore.Timestamp.fromDate(end),
      duration:S.t,novedades:S.novs,
      entryCount:S.emIn.length,danosCount:S.emDan.length,exitCount:S.emOut.length
    });
  }).then(function(){
    S.uploading=false;S.uploadPct=100;render();
  }).catch(function(e){
    db.collection("limpiezas").doc(sid).update({
      status:"completed",endTime:firebase.firestore.Timestamp.fromDate(end),
      duration:S.t,novedades:S.novs,
      entryCount:S.emIn.length,danosCount:S.emDan.length,exitCount:S.emOut.length
    }).catch(function(){});
    S.uploading=false;render();
    console.log("Error guardando media:",e);
  });
}

  if(!confirm("¿Eliminar '"+name+"'?"+(used>0?"\n⚠️ Tiene "+used+" apartamento(s)":"")))return;
  S.clients.splice(idx,1);S.apts.forEach(function(a){if(a.client===name)a.client=""});
  saveClients();saveApts(function(){});render();
}

// Gestión trabajadores
function newWorker(){var el=document.getElementById("nw");if(!el||!el.value.trim())return;S.workers.push(el.value.trim());saveWorkers();el.value="";render()}
function editWorker(idx){S.ewIdx=idx;render();setTimeout(function(){var el=document.getElementById("ew");if(el){el.value=S.workers[idx];el.focus()}},100)}
function saveWorker(){var el=document.getElementById("ew");if(!el||!el.value.trim())return;S.workers[S.ewIdx]=el.value.trim();S.ewIdx=-1;saveWorkers();render()}
function cancelWorker(){S.ewIdx=-1;render()}
function delWorker(idx){if(!confirm("¿Eliminar '"+S.workers[idx]+"'?"))return;S.workers.splice(idx,1);saveWorkers();render()}

function delRec(id,apt){
  if(!confirm("¿Eliminar el registro de '"+apt+"'? Esta acción no se puede deshacer."))return;
  db.collection("limpiezas").doc(id).delete().then(function(){
    S.recs=S.recs.filter(function(r){return r.id!==id});
    S.detalle=null;S.screen="ger";render();
  }).catch(function(e){alert("Error: "+e.message)});
}

function verDetalle(id){
  var r=S.recs.find(function(x){return x.id===id});
  if(!r)return;
  S.detalle=r;S.screen="detalle";
  S.detalleMedia={entry:[],danos:[],out:[],loading:true};
  render();
  Promise.all([
    loadMediaGroup(id,"entrada"),
    loadMediaGroup(id,"danos"),
    loadMediaGroup(id,"salida")
  ]).then(function(res){
    S.detalleMedia={entry:res[0],danos:res[1],out:res[2],loading:false};
    render();
  }).catch(function(){
    S.detalleMedia={entry:[],danos:[],out:[],loading:false};
    render();
  });
}

// Render
function render(){
  var html="";
  if(S.screen==="home")html=pgHome();
  else if(S.screen==="login")html=pgLogin();
  else if(S.screen==="active")html=pgActive();
  else if(S.screen==="summary")html=pgSummary();
  else if(S.screen==="adm")html=pgAdm();
  else if(S.screen==="ger")html=pgGer();
  else if(S.screen==="detalle")html=pgDetalle();
  else html=pgHome();
  document.getElementById("R").innerHTML='<div class="wrap">'+html+'</div>';
}

function filterRecs(done){
  return done.filter(function(r){
    var d=td(r.endTime);
    if(S.hFrom&&d<new Date(S.hFrom+" 00:00:00"))return false;
    if(S.hTo&&d>new Date(S.hTo+" 23:59:59"))return false;
    if(S.fW&&r.worker!==S.fW)return false;
    if(S.fA&&r.apt!==S.fA)return false;
    if(S.fC&&r.client!==S.fC)return false;
    return true;
  });
}

  return panelHdr("👨‍💼 Panel Admin","Tiempo real")+
    '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">'+
    '<div class="sbox"><div style="font-size:26px;font-weight:900;color:'+G+'">'+live.length+'</div><div style="font-size:10px;color:#6b7280;font-weight:700;margin-top:2px">EN CURSO</div></div>'+
    '<div class="sbox"><div style="font-size:26px;font-weight:900;color:'+B+'">'+hoy.length+'</div><div style="font-size:10px;color:#6b7280;font-weight:700;margin-top:2px">HOY</div></div>'+
    '<div class="sbox"><div style="font-size:16px;font-weight:900;color:'+O+'">'+fmt(avg)+'</div><div style="font-size:10px;color:#6b7280;font-weight:700;margin-top:2px">PROMEDIO</div></div>'+
    '</div>'+filtros(wSel+aSel)+
    (live.length?'<div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:8px;text-transform:uppercase">En Curso ('+live.length+')</div>'+liveH:'')+
    '<div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:8px;text-transform:uppercase">Historial ('+fil.length+'/'+done.length+')</div>'+
    (!fil.length?'<p style="text-align:center;color:#9ca3af;padding:24px">Sin registros</p>':doneH);
}

// ══ GERENCIA ══════════════════════════════════════════════════════════
function pgGer(){
  var tabs=[["deuda","💰 Deuda"],["historial","📋 Historial"],["config","⚙️ Config"]];
  var tb='<div class="tabbar">'+tabs.map(function(t){var on=S.gTab===t[0];
    return'<button class="tab" onclick="S.gTab=\''+t[0]+'\';S.aptForm=null;render()" style="background:'+(on?PU:"transparent")+';color:'+(on?"#fff":"#6b7280")+';font-size:13px">'+t[1]+'</button>';
  }).join("")+'</div>';
  return panelHdr("👑 Gerencia","Acceso completo",PU)+tb+
    (S.gTab==="deuda"?tabDeuda():S.gTab==="historial"?tabHist():tabCfg());
}

// ── DEUDA ────────────────────────────────────────────────────────────
function tabDeuda(){
  var from=S.dFrom?new Date(S.dFrom+" 00:00:00"):null;
  var to=S.dTo?new Date(S.dTo+" 23:59:59"):null;
  var done=S.recs.filter(function(r){return r.status==="completed"});
  var inR=done.filter(function(r){var d=td(r.endTime||r.startTime);if(from&&d<from)return false;if(to&&d>to)return false;return true});
  var byC={};
  inR.forEach(function(r){
    var c=r.client||"Sin cliente";
    if(!byC[c])byC[c]={count:0,valor:0,apts:{}};
    byC[c].count++;byC[c].valor+=Number(r.valor)||0;
    var ap=r.apt||"?";
    if(!byC[c].apts[ap])byC[c].apts[ap]={count:0,valor:0};
    byC[c].apts[ap].count++;byC[c].apts[ap].valor+=Number(r.valor)||0;
  });
  var clArr=Object.keys(byC).map(function(k){return Object.assign({name:k},byC[k])}).sort(function(a,b){return b.valor-a.valor});
  var total=clArr.reduce(function(a,c){return a+c.valor},0);
  var clH=!clArr.length?'<p style="text-align:center;color:#9ca3af;padding:20px">Sin registros en este período</p>':
    clArr.map(function(c,i){
      var aH=Object.keys(c.apts).map(function(k){var a=c.apts[k];
        return'<div style="display:flex;justify-content:space-between;padding:7px 10px;background:rgba(255,255,255,.15);border-radius:8px;margin-top:5px">'+
          '<div><span style="font-size:13px;font-weight:600;color:#fff">'+esc(k)+'</span><span style="font-size:11px;color:rgba(255,255,255,.7);margin-left:6px">'+a.count+' limpiezas</span></div>'+
          '<span style="font-size:14px;font-weight:800;color:#fff">'+pesos(a.valor)+'</span></div>';
      }).join("");
      return'<div style="background:linear-gradient(135deg,'+COLORS[i%COLORS.length]+','+COLORS[(i+2)%COLORS.length]+');border-radius:14px;padding:16px;margin-bottom:12px">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'+
        '<div><div style="font-size:18px;font-weight:900;color:#fff">'+esc(c.name)+'</div>'+
        '<div style="font-size:12px;color:rgba(255,255,255,.75);margin-top:2px">'+c.count+' limpiezas</div></div>'+
        '<div style="text-align:right"><div style="font-size:22px;font-weight:900;color:#fff">'+pesos(c.valor)+'</div>'+
        '<div style="font-size:10px;color:rgba(255,255,255,.7)">DEBE A MI EMPRESA</div></div></div>'+aH+'</div>';
    }).join("");
  return'<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:10px">📅 Período de consulta</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
    '<div><label class="lbl">Desde</label><input type="date" class="inp" value="'+S.dFrom+'" onchange="S.dFrom=this.value;render()" style="margin:0"></div>'+
    '<div><label class="lbl">Hasta</label><input type="date" class="inp" value="'+S.dTo+'" onchange="S.dTo=this.value;render()" style="margin:0"></div>'+
    '</div></div>'+
    (total>0?'<div class="hl" style="text-align:center">'+
    '<div style="font-size:11px;color:rgba(255,255,255,.8);font-weight:700;margin-bottom:4px">TOTAL FACTURADO</div>'+
    '<div style="font-size:36px;font-weight:900">'+pesos(total)+'</div>'+
    '<div style="font-size:12px;color:rgba(255,255,255,.7);margin-top:4px">'+inR.length+' limpiezas · '+clArr.length+' clientes</div></div>':'')+clH;
}

// ── HISTORIAL GERENCIA ────────────────────────────────────────────────
function tabHist(){
  var done=S.recs.filter(function(r){return r.status==="completed"});
  var live=S.recs.filter(function(r){return r.status==="active"});
  var workers=[];done.forEach(function(r){if(r.worker&&workers.indexOf(r.worker)<0)workers.push(r.worker)});workers.sort();
  var apts=[];done.forEach(function(r){if(r.apt&&apts.indexOf(r.apt)<0)apts.push(r.apt)});apts.sort();
  var clients=[];done.forEach(function(r){if(r.client&&clients.indexOf(r.client)<0)clients.push(r.client)});clients.sort();
  var fil=filterRecs(done);
  var tv=fil.reduce(function(a,r){return a+(Number(r.valor)||0)},0);
  var wSel='<select class="inp" onchange="S.fW=this.value;render()" style="margin-bottom:8px"><option value="">Todos los trabajadores</option>'+workers.map(function(w){return'<option value="'+esc(w)+'"'+(S.fW===w?" selected":"")+'>'+esc(w)+'</option>'}).join("")+'</select>';
  var aSel='<select class="inp" onchange="S.fA=this.value;render()" style="margin-bottom:8px"><option value="">Todos los apartamentos</option>'+apts.map(function(a){return'<option value="'+esc(a)+'"'+(S.fA===a?" selected":"")+'>'+esc(a)+'</option>'}).join("")+'</select>';
  var cSel='<select class="inp" onchange="S.fC=this.value;render()" style="margin-bottom:0"><option value="">Todos los clientes</option>'+clients.map(function(c){return'<option value="'+esc(c)+'"'+(S.fC===c?" selected":"")+'>'+esc(c)+'</option>'}).join("")+'</select>';
  var liveH=live.map(function(r){
    return'<div class="ac" style="border-left-color:'+G+';background:#f0fdf4;cursor:default">'+
      '<div style="display:flex;justify-content:space-between">'+
      '<div><div style="font-weight:700;font-size:15px">'+esc(r.apt)+'</div>'+
      (r.client?'<span class="chip" style="background:#dcfce7;color:'+G+'">'+esc(r.client)+'</span>':'')+
      '<div style="font-size:13px;color:#6b7280;margin-top:4px">'+esc(r.worker)+'</div></div>'+
      '<span class="chip" style="background:#dcfce7;color:'+G+'">● ACTIVO</span></div></div>';
  }).join("");
  var doneH=fil.map(function(r){
    return'<div class="ac" onclick="verDetalle(\''+r.id+'\')">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start">'+
      '<div><div style="font-weight:700;font-size:15px">'+esc(r.apt)+'</div>'+
      (r.client?'<span class="chip" style="background:#eff6ff;color:'+B+'">'+esc(r.client)+'</span>':'')+
      '<div style="font-size:13px;color:#6b7280;margin-top:4px">'+esc(r.worker)+'</div>'+
      '<div style="font-size:12px;color:#9ca3af;margin-top:2px">'+fD(td(r.endTime))+' · '+fH(td(r.startTime))+'–'+fH(td(r.endTime))+'</div></div>'+
      '<div style="text-align:right"><div style="font-weight:900;color:'+G+';font-size:18px">'+fmt(r.duration||0)+'</div>'+
      '<div style="font-weight:800;color:'+PU+';font-size:14px">'+pesos(r.valor||0)+'</div>'+
      '<div style="font-size:11px;color:'+B+';font-weight:700;margin-top:4px">Ver detalle →</div></div></div></div>';
  }).join("");
  return filtros(wSel+aSel+cSel)+
    (tv>0?'<div style="background:linear-gradient(135deg,'+PU+',#5b21b6);border-radius:12px;padding:14px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">'+
    '<div><div style="color:rgba(255,255,255,.8);font-size:11px;font-weight:700">TOTAL FILTRADO</div><div style="color:rgba(255,255,255,.7);font-size:12px">'+fil.length+' registros</div></div>'+
    '<div style="color:#fff;font-size:22px;font-weight:900">'+pesos(tv)+'</div></div>':'')+
    (live.length?'<div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:8px;text-transform:uppercase">En curso ('+live.length+')</div>'+liveH:'')+
    '<div style="font-size:11px;font-weight:700;color:#6b7280;margin-bottom:8px;text-transform:uppercase">Historial ('+fil.length+'/'+done.length+')</div>'+
    (!fil.length?'<p style="text-align:center;color:#9ca3af;padding:24px">Sin registros</p>':doneH);
}

// ── CONFIG ────────────────────────────────────────────────────────────
function tabCfg(){
  var tabs='<div class="tabbar">'+
    '<button class="tab" onclick="S.cTab=\'apts\';S.aptForm=null;S.ewIdx=-1;S.ecIdx=-1;render()" style="background:'+(S.cTab==="apts"?G:"transparent")+';color:'+(S.cTab==="apts"?"#fff":"#6b7280")+'">🏠 Apts ('+S.apts.length+')</button>'+
    '<button class="tab" onclick="S.cTab=\'clients\';S.aptForm=null;S.ewIdx=-1;S.ecIdx=-1;render()" style="background:'+(S.cTab==="clients"?B:"transparent")+';color:'+(S.cTab==="clients"?"#fff":"#6b7280")+'">🏢 Clientes ('+S.clients.length+')</button>'+
    '<button class="tab" onclick="S.cTab=\'workers\';S.aptForm=null;S.ewIdx=-1;S.ecIdx=-1;render()" style="background:'+(S.cTab==="workers"?G:"transparent")+';color:'+(S.cTab==="workers"?"#fff":"#6b7280")+'">👤 Personal ('+S.workers.length+')</button>'+
    '</div>';

  if(S.cTab==="apts"){
    var overlay="";
    if(S.aptForm!==null){
      var ea=S.aptForm;
      var cOpts=S.clients.map(function(c){return'<option value="'+esc(c)+'"'+(ea.client===c?" selected":"")+'>'+esc(c)+'</option>'}).join("");
      overlay='<div class="overlay"><div class="sheet">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">'+
        '<span style="font-weight:900;font-size:17px;color:'+G+'">'+(ea.idx===-1?"➕ Nuevo Apartamento":"✏️ Editar Apartamento")+'</span>'+
        '<button onclick="cancelAptForm()" style="background:#f3f4f6;border:none;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px;font-family:inherit">✕</button></div>'+
        '<label class="lbl">Nombre *</label><input id="fn" class="inp" type="text" placeholder="Ej: 1103" value="'+esc(ea.name)+'">'+
        '<label class="lbl">Cliente *</label><select id="fc" class="inp"><option value="">Seleccionar cliente...</option>'+cOpts+'</select>'+
        '<label class="lbl">Valor del Servicio ($)</label>'+
        '<input id="fv" class="inp" type="number" inputmode="numeric" min="0" step="1000" placeholder="Ej: 50000" value="'+Number(ea.valor||0)+'">'+
        (ea.valor>0?'<div style="background:#f5f3ff;border-radius:9px;padding:10px;margin-bottom:10px;text-align:center"><span style="color:#6b7280;font-size:13px">Valor actual: </span><span style="font-size:16px;font-weight:900;color:'+PU+'">'+pesos(ea.valor)+'</span></div>':'')+
        '<button onclick="saveAptForm()" class="btn" style="background:'+G+';margin-top:4px;padding:14px">✅ Guardar</button>'+
        '<button onclick="cancelAptForm()" class="btn" style="background:'+GR+';margin-top:8px">Cancelar</button>'+
        '</div></div>';
    }
    return tabs+
      '<button onclick="newApt()" class="btn" style="background:'+G+';margin-top:0;margin-bottom:12px">➕ Agregar Apartamento</button>'+
      '<div class="card">'+S.apts.map(function(a,idx){
        return'<div class="irow"><div style="flex:1;min-width:0">'+
          '<div style="font-weight:700;font-size:14px">'+esc(a.name)+'</div>'+
          '<div style="margin-top:5px;display:flex;gap:5px;flex-wrap:wrap">'+
          '<span class="chip" style="background:#eff6ff;color:'+B+'">'+esc(a.client||"Sin cliente")+'</span>'+
          (a.valor>0?'<span class="chip" style="background:#f5f3ff;color:'+PU+'">'+pesos(a.valor)+'</span>':'<span class="chip" style="background:#f3f4f6;color:#9ca3af">Sin valor</span>')+
          '</div></div>'+
          '<div style="display:flex;gap:6px;flex-shrink:0">'+
          '<button onclick="editApt('+idx+')" class="ibtn" style="background:#eff6ff;color:'+B+'">✏️</button>'+
          '<button onclick="delApt('+idx+')" class="ibtn" style="background:#fff1f2;color:'+R+'">🗑️</button>'+
          '</div></div>';
      }).join("")+'</div>'+overlay;

  } else if(S.cTab==="clients"){
    var cH=S.clients.map(function(c,i){
      var n=S.apts.filter(function(a){return a.client===c}).length;
      if(S.ecIdx===i){
        return'<div class="irow" style="align-items:center">'+
          '<input id="ec" class="inp" type="text" style="flex:1;margin:0" onkeydown="if(event.key===\'Enter\')saveClient()">'+
          '<div style="display:flex;gap:6px;margin-left:8px">'+
          '<button onclick="saveClient()" class="ibtn" style="background:'+G+';color:#fff">✓</button>'+
          '<button onclick="cancelClient()" class="ibtn" style="background:'+GR+';color:#fff">✕</button>'+
          '</div></div>';
      }
      return'<div class="irow"><div style="flex:1">'+
        '<div style="font-weight:700;font-size:15px">'+esc(c)+'</div>'+
        '<div style="font-size:12px;color:#6b7280;margin-top:3px">'+n+' apto'+(n!==1?"s":"")+'</div></div>'+
        '<div style="display:flex;gap:6px">'+
        '<button onclick="editClient('+i+')" class="ibtn" style="background:#eff6ff;color:'+B+'">✏️ Editar</button>'+
        '<button onclick="delClient('+i+')" class="ibtn" style="background:#fff1f2;color:'+R+'">🗑️</button>'+
        '</div></div>';
    }).join("");
    return tabs+
      '<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:6px">➕ Nuevo Cliente</div>'+
      '<p style="font-size:12px;color:#6b7280;margin-bottom:12px">Al editar un cliente se actualiza en todos sus apartamentos.</p>'+
      '<div style="display:flex;gap:8px">'+
      '<input id="nc" class="inp" type="text" placeholder="Ej: ROMULO" style="flex:1;margin:0;text-transform:uppercase" onkeydown="if(event.key===\'Enter\')newClient()">'+
      '<button onclick="newClient()" style="background:'+B+';color:#fff;border:none;border-radius:9px;padding:12px 20px;font-weight:700;cursor:pointer;font-size:20px;font-family:inherit">+</button>'+
      '</div></div>'+
      '<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:12px">🏢 Clientes ('+S.clients.length+')</div>'+
      (!S.clients.length?'<p style="text-align:center;color:#9ca3af;padding:16px">Sin clientes. Agrega uno arriba.</p>':cH)+'</div>';

  } else {
    var wH=S.workers.map(function(w,i){
      if(S.ewIdx===i){
        return'<div class="irow" style="align-items:center">'+
          '<input id="ew" class="inp" type="text" style="flex:1;margin:0" onkeydown="if(event.key===\'Enter\')saveWorker()">'+
          '<div style="display:flex;gap:6px;margin-left:8px">'+
          '<button onclick="saveWorker()" class="ibtn" style="background:'+G+';color:#fff">✓</button>'+
          '<button onclick="cancelWorker()" class="ibtn" style="background:'+GR+';color:#fff">✕</button>'+
          '</div></div>';
      }
      return'<div class="irow"><span style="font-size:14px;font-weight:500;flex:1">'+esc(w)+'</span>'+
        '<div style="display:flex;gap:6px">'+
        '<button onclick="editWorker('+i+')" class="ibtn" style="background:#eff6ff;color:'+B+'">✏️ Editar</button>'+
        '<button onclick="delWorker('+i+')" class="ibtn" style="background:#fff1f2;color:'+R+'">🗑️</button>'+
        '</div></div>';
    }).join("");
    return tabs+
      '<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:12px">➕ Agregar Trabajador</div>'+
      '<div style="display:flex;gap:8px">'+
      '<input id="nw" class="inp" type="text" placeholder="Nombre completo" style="flex:1;margin:0" onkeydown="if(event.key===\'Enter\')newWorker()">'+
      '<button onclick="newWorker()" style="background:'+G+';color:#fff;border:none;border-radius:9px;padding:12px 20px;font-weight:700;cursor:pointer;font-size:20px;font-family:inherit">+</button>'+
      '</div></div>'+
      '<div class="card"><div style="font-weight:700;font-size:14px;margin-bottom:12px">👤 Personal ('+S.workers.length+')</div>'+
      (!S.workers.length?'<p style="text-align:center;color:#9ca3af;padding:16px">Sin trabajadores.</p>':wH)+'</div>';
  }
}

loadCfg();
</script>
