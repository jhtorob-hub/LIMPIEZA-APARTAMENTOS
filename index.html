<script>
  // Detector de errores — solo muestra mensaje si el render REALMENTE no ocurrió.
  function bootError(msg){
    var el = document.getElementById("boot-msg");
    if(el){ el.innerHTML = msg; el.style.color="#f87171"; }
  }
  window.addEventListener("error", function(e){
    // Solo mostramos error si la app aún no se montó
    var root=document.getElementById("root");
    if(root && root.querySelector("#boot-msg")){
      bootError("⚠️ Error al cargar.<br>Recarga la página.<br><br><small style='color:#475569'>"+(e.message||"")+"</small>");
    }
  });
  // Chequeo final: 8s después, si SIGUE el mensaje de carga, las libs fallaron
  window.addEventListener("load", function(){
    setTimeout(function(){
      var root=document.getElementById("root");
      // Si el boot-msg ya no existe, la app montó bien — no hacemos nada
      if(!root || !root.querySelector("#boot-msg")) return;
      if(typeof React==="undefined" || typeof ReactDOM==="undefined"){
        bootError("⚠️ No se pudieron cargar las librerías (React).<br>Revisa tu conexión y recarga.");
      } else if(typeof firebase==="undefined"){
        bootError("⚠️ No se pudo cargar Firebase.<br>Revisa tu conexión y recarga.");
      } else {
        bootError("⚠️ La app no terminó de cargar.<br>Recarga la página (Ctrl+R).");
      }
    }, 8000);
  });
</script>

const econ = (price, mins, juegos, k) => {
  const p = Number(price) || 0;
  const hoy = k.preciosConIva ? p / (1 + k.ivaPct/100) : p;
  const aiu = k.preciosConIva ? p / (1 + (k.ivaPct/100) * (k.aiuPct/100)) : p;
  const fijo = k.insumos + k.admin + (juegos || 0) * k.lenceriaJuego;
  const cost = mins == null ? null : (mins/60) * k.costoHora + fijo;
  return { hoy, aiu, cost,
    gHoy: cost == null ? null : hoy - cost,
    gAiu: cost == null ? null : aiu - cost,
    maxHoy: (hoy - fijo) / k.costoHora * 60,
    maxAiu: (aiu - fijo) / k.costoHora * 60 };
};

const FOTOS_FINALES = [["cama","Cama tendida"],["bano","Baño"],["cocina","Cocina"],["sala","Sala"],["zona","Zona profunda"]];
const compressImage = (file, maxW=900, q=0.6) => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxW / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      res(cv.toDataURL("image/jpeg", q));
    };
    img.onerror = rej; img.src = r.result;
  };
  r.onerror = rej; r.readAsDataURL(file);
});

function FotoSlot({cleaningId,k,label,has,thumb,showToast,big}){
  const [busy,setBusy]=useState(false);
  const onFile=async(e)=>{
    const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
    setBusy(true);
    try{
      const data=await compressImage(f);
      const ts=Date.now();
      await CLEANINGS_COL.doc(cleaningId).collection("fotos").doc(k).set({data,ts,label});
      await CLEANINGS_COL.doc(cleaningId).update({[`fotos.${k}`]:ts});
      showToast(`📷 ${label}: guardada`);
    }catch(err){ console.error(err); showToast("No se pudo guardar la foto, intenta de nuevo","error"); }
    finally{ setBusy(false); }
  };
  return(
    <label style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6,padding:10,minHeight:big?150:110,border:`2px ${has?"solid":"dashed"} ${has?C.success:C.border}`,borderRadius:12,cursor:"pointer",background:C.surface,textAlign:"center"}}>

      <span style={{fontSize:13,fontWeight:700,color:C.text}}>{label}</span>
      <span style={{fontSize:11,fontWeight:700,color:busy?C.accent:has?C.success:C.muted}}>{busy?"Guardando...":has?"✓ Lista (toca para cambiar)":"Toca para tomar la foto"}</span>
      <input type="file" accept="image/*" capture="environment" onChange={onFile} style={{display:"none"}}/>
    </label>
  );
}

            <input type="checkbox" checked={on} onChange={()=>toggleCheck("i"+i)} style={{width:22,height:22,accentColor:C.success,flexShrink:0}}/>{it}
          </label>);})}
        <label style={{display:"flex",gap:12,alignItems:"center",padding:"11px 0",cursor:"pointer",fontSize:15,fontWeight:700,color:cl.zona?C.muted:C.info,textDecoration:cl.zona?"line-through":"none"}}>

        </label>
      </div>

      <div style={box}>
        <PasoHeader n={3} title="Fotos finales" done={fotosHechas===FOTOS_FINALES.length} sub={`${fotosHechas} de ${FOTOS_FINALES.length} fotos`}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          {FOTOS_FINALES.map(([k,label])=><FotoSlot key={k} cleaningId={active.id} k={k} label={k==="zona"?`Zona: ${active.zonaProfunda||""}`:label} has={!!fotos[k]} thumb={thumbs[k]} showToast={showToast}/>)}
        </div>

      <div style={box}>
        <PasoHeader n={4} title="Salida" done={false} sub="Escribe las novedades y toca Terminé al salir del apartamento."/>

        <textarea value={activeNotes} onChange={e=>setActiveNotes(e.target.value)} rows={2} placeholder="Si no hay novedades, déjalo vacío" style={{width:"100%",padding:"10px 14px",background:"#0b0f18",border:`1px solid ${C.border}`,borderRadius:"8px",color:C.text,fontSize:"14px",outline:"none",boxSizing:"border-box",fontFamily:"inherit",resize:"vertical",marginBottom:12}}/>
        <Btn variant="success" onClick={finishCleaning} disabled={saving} style={{width:"100%",padding:"16px",fontSize:17}}>{saving?"Guardando...":"■ Terminé"}</Btn>
      </div>
    </div>
  );
}

// Resumen del día: entradas, salidas, horas trabajadas y tiempos muertos entre apartamentos
function DiaResumen({cleanings,employee,now}){
  const hoy=todayStr();
  const mine=cleanings.filter(c=>c.date===hoy&&c.employeeName===employee);
  const timed=mine.filter(c=>c.startedAt).sort((a,b)=>a.startedAt-b.startedAt);
  const manual=mine.filter(c=>!c.startedAt);
  if(mine.length===0) return null;
  let trabajado=0, muerto=0;
  const rows=[];
  timed.forEach((c,i)=>{
    const fin=c.finishedAt||null;
    const dur=((fin||now)-c.startedAt)/60000;
    trabajado+=dur;
    if(i>0){
      const prev=timed[i-1];
      if(prev.finishedAt){ const gap=(c.startedAt-prev.finishedAt)/60000; if(gap>0){ muerto+=gap; rows.push({gap,key:"g"+c.id}); } }
    }
    rows.push({c,dur,fin,key:c.id});
  });
  const first=timed[0]?.startedAt, lastFin=timed.length?(timed.at(-1).finishedAt||now):null;
  const stat=(label,value,color)=>(<div style={{flex:1,minWidth:90,background:C.surface,borderRadius:10,padding:"10px 12px"}}><div style={{fontSize:11,color:C.muted}}>{label}</div><div style={{fontSize:17,fontWeight:800,color:color||C.text,marginTop:2}}>{value}</div></div>);
  return(
    <div style={{marginBottom:20}}>
      <div style={{color:C.muted,fontSize:12,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:12}}>Mi día — {fmtDate(hoy)}</div>
      {timed.length>0&&<div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
        {stat("Apartamentos",String(timed.length))}
        {stat("Horas trabajadas",fmtMin(trabajado),C.success)}
        {stat("Tiempo muerto",fmtMin(muerto),muerto>0?C.danger:C.muted)}
        {stat("Jornada",first?`${toHM(first)} – ${toHM(lastFin)}`:"—")}
      </div>}
      {rows.map(r=>r.gap!=null?(
        <div key={r.key} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0 4px 14px",color:C.danger,fontSize:12,fontWeight:700}}>⏸ Tiempo muerto / traslado: {fmtMin(r.gap)}</div>
      ):(
        <div key={r.key} style={{background:C.card,border:`1px solid ${r.fin?C.border:C.accent}`,borderRadius:10,padding:"12px 14px",marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
          <div>
            <div style={{fontWeight:700,fontSize:14}}>{r.c.apartmentName}</div>
            <div style={{fontSize:12,color:C.muted,marginTop:2}}>Entrada {toHM(r.c.startedAt)} · Salida {r.fin?toHM(r.fin):"en curso"} · 📷 {Object.keys(r.c.fotos||{}).length}</div>
          </div>
          <div style={{fontWeight:800,color:r.fin?C.text:C.accent,whiteSpace:"nowrap"}}>{fmtMin(r.dur)}</div>
        </div>
      ))}
      {manual.map(c=>(
        <div key={c.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",marginBottom:6}}>
          <div style={{fontWeight:700,fontSize:14}}>{c.apartmentName}</div>
          <div style={{fontSize:12,color:C.muted,marginTop:2}}>Registrada sin cronómetro · {c.time}</div>
        </div>
      ))}
    </div>
  );
}

function EmployeeView({appData,update,showToast,onLogout}){
  // El nombre se recuerda en este celular para no elegirlo cada vez
  const [employee,setEmployeeRaw]=useState(()=>{ try{ return localStorage.getItem("lp_empleado")||""; }catch(e){ return ""; } });
  const setEmployee=(v)=>{ setEmployeeRaw(v); try{ localStorage.setItem("lp_empleado",v); }catch(e){} };
  const [now,setNow]=useState(Date.now());
  useEffect(()=>{ const t=setInterval(()=>setNow(Date.now()),15000); return ()=>clearInterval(t); },[]);
  const [activeNotes,setActiveNotes]=useState("");
  const [aptId,setAptId]=useState("");
  const [notes,setNotes]=useState("");
  const [date,setDate]=useState(todayStr());
  const [showNewApt,setShowNewApt]=useState(false);
  const [selectedBuilding,setSelectedBuilding]=useState("");
  const [nAptNum,setNAptNum]=useState("");
  const [nBuilding,setNBuilding]=useState("");
  const [nClient,setNClient]=useState("");
  const inpStyle={width:"100%",padding:"10px 14px",background:"#0b0f18",border:`1px solid ${C.border}`,borderRadius:"8px",color:C.text,fontSize:"14px",outline:"none",boxSizing:"border-box",fontFamily:"inherit"};
  const buildings=[...new Set(appData.apartments.map(a=>a.building).filter(Boolean))].sort();
  const clients=[...new Set(appData.apartments.map(a=>a.clientName).filter(Boolean))].sort();
  const handleAddApt=()=>{
    if(!nBuilding.trim()){showToast("El edificio es requerido","error");return;}
    const num=nAptNum.trim(),bld=nBuilding.trim();
    const displayName=num?`${num} ${bld}`:bld;
    // Se guarda como documento propio — nunca pisa apartamentos que otro
    // colaborador haya agregado justo antes.
    APARTMENTS_COL.add({aptNumber:num,building:bld,displayName,clientName:nClient.trim()||"",price:0})
      .then(()=>{
        setNAptNum("");setNBuilding("");setNClient("");setShowNewApt(false);
        showToast(`${displayName} agregado ✅`);
      })
      .catch(e=>{console.error(e);showToast("No se pudo agregar, intenta de nuevo","error");});
  };
  const sorted=[...appData.apartments].sort((a,b)=>a.building.localeCompare(b.building)||String(a.aptNumber).localeCompare(String(b.aptNumber),undefined,{numeric:true}));
  const buildingGroups=[...new Set(sorted.map(a=>a.building))];
  const apt=appData.apartments.find(a=>a.id===aptId);
  const todayList=appData.cleanings.filter(c=>c.date===todayStr()).sort((a,b)=>b.createdAt-a.createdAt);
  const [saving,setSaving]=useState(false);
  // Limpieza en curso de esta persona (empezó y no ha terminado)
  const active=employee?appData.cleanings.find(c=>c.enCurso&&c.employeeName===employee):null;
  // Anti-duplicados: el mismo apartamento no se registra dos veces el mismo día.
  const okToSave=(d)=>{
    const aptName=apt?.displayName||"";
    const same=appData.cleanings.filter(c=>c.date===d&&(c.apartmentId===aptId||normTxt(c.apartmentName)===normTxt(aptName)));
    if(same.some(c=>normTxt(c.employeeName)===normTxt(employee))){
      showToast(`${aptName} ya está registrado por ti el ${fmtDate(d)}. No se guardó de nuevo.`,"error");return false;
    }
    if(same.length>0 && !window.confirm(`${aptName} ya fue registrado el ${fmtDate(d)} por ${same.map(c=>c.employeeName||"otra persona").join(", ")}.\n\nSi lo hicieron juntas, NO lo registres otra vez: ya cuenta una vez.\n\n¿Registrarlo de todas formas?`)) return false;
    return true;
  };
  const saveNew=(d,newC,okMsg)=>{
    setSaving(true);
    const ref=CLEANINGS_COL.doc(`${d}_${aptId}_${employee}`.replace(/[\/\s]+/g,"-"));
    return db.runTransaction(async t=>{
      const s=await t.get(ref);
      if(s.exists) throw new Error("DUPLICADO");
      t.set(ref,newC);
    })
      .then(()=>{ showToast(okMsg); setAptId("");setNotes("");setSelectedBuilding(""); })
      .catch(e=>{
        if(e&&e.message==="DUPLICADO"){ showToast("Esta limpieza ya estaba registrada, no se duplicó","error"); return; }
        console.error("Error guardando limpieza:",e); showToast("No se pudo guardar, revisa tu conexión e intenta de nuevo","error");
      })
      .finally(()=>setSaving(false));
  };
  // ▶ Empezar: guarda hora y ubicación de llegada
  const startCleaning=async()=>{
    if(!employee||!aptId){showToast("Elige tu nombre y el apartamento","error");return;}
    if(!CLEANINGS_COL){showToast("Sin conexión con la base de datos","error");return;}
    if(active){showToast(`Primero termina ${active.apartmentName}`,"error");return;}
    const d=todayStr();
    if(!okToSave(d)) return;
    setSaving(true);
    const loc=await getPos();
    const ts=Date.now();
    const prevTimed=appData.cleanings.filter(c=>c.apartmentId===aptId&&c.startedAt).length;
    const tipo=apt?.tipo||"";
    const newC={date:d,time:new Date(ts).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"}),employeeName:employee,apartmentId:aptId,apartmentName:apt?.displayName||"",clientName:apt?.clientName||"",notes:"",paid:false,amount:apt?.price||0,createdAt:ts,
      enCurso:true,startedAt:ts,startLoc:loc,tipo,zonaProfunda:ZONAS_PROFUNDAS.at(prevTimed%ZONAS_PROFUNDAS.length),checklist:{}};
    setActiveNotes("");
    saveNew(d,newC,loc?"▶ Limpieza iniciada ✅":"▶ Limpieza iniciada (sin ubicación)");
  };
  const toggleCheck=(key)=>{
    if(!active) return;
    const cl={...(active.checklist||{}),[key]:!(active.checklist||{})[key]};
    CLEANINGS_COL.doc(active.id).update({checklist:cl}).catch(e=>{console.error(e);showToast("No se pudo guardar el check","error");});
  };
  // ■ Terminar: guarda hora y ubicación de salida y la duración
  const finishCleaning=async()=>{
    if(!active) return;
    const items=checklistFor(active.tipo);
    const total=items.length+1;
    const done=items.filter((_,i)=>(active.checklist||{})["i"+i]).length+((active.checklist||{}).zona?1:0);
    const faltanFotos=[["entrada","Foto de entrada"],...FOTOS_FINALES].filter(([k])=>!(active.fotos||{})[k]).map(([,l])=>l);
    const faltas=[];
    if(done<total) faltas.push(`${total-done} tareas del checklist`);
    if(faltanFotos.length) faltas.push(`fotos: ${faltanFotos.join(", ")}`);
    if(faltas.length && !window.confirm(`Te falta:\n• ${faltas.join("\n• ")}\n\n¿Terminar de todas formas?`)) return;
    setSaving(true);
    const loc=await getPos();
    const fin=Date.now();
    CLEANINGS_COL.doc(active.id).update({enCurso:false,finishedAt:fin,endLoc:loc,durationMin:Math.round((fin-active.startedAt)/60000),notes:activeNotes.trim()||active.notes||""})
      .then(()=>{ showToast(`■ Terminado: ${fmtMin((fin-active.startedAt)/60000)} ✅`); setActiveNotes(""); })
      .catch(e=>{console.error(e);showToast("No se pudo terminar, revisa tu conexión","error");})
      .finally(()=>setSaving(false));
  };
  // Registro sin cronómetro (como antes), para limpiezas ya hechas
  const handleSubmit=()=>{
    if(!employee||!aptId||!date){showToast("Completa todos los campos","error");return;}
    if(!CLEANINGS_COL){showToast("Sin conexión con la base de datos","error");return;}
    if(!okToSave(date)) return;
    const newC={date,time:new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"}),employeeName:employee,apartmentId:aptId,apartmentName:apt?.displayName||"",clientName:apt?.clientName||"",notes,paid:false,amount:apt?.price||0,createdAt:Date.now()};
    // ID fijo (fecha + apartamento + encargado): un doble toque o dos celulares no duplican.
    saveNew(date,newC,"¡Limpieza registrada! ✅");
  };
  return(
    <div style={{minHeight:"100vh",maxWidth:480,margin:"0 auto",padding:"20px 16px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24}}>
        <div><h2 style={{margin:0,fontSize:22,fontWeight:800}}>🧹 Nueva limpieza</h2><p style={{margin:"2px 0 0",color:C.muted,fontSize:13}}>{fmtDate(todayStr())}</p></div>
        <Btn variant="ghost" size="sm" onClick={onLogout}>Salir</Btn>
      </div>
      {active&&<ActiveCleaning active={active} now={now} saving={saving} activeNotes={activeNotes} setActiveNotes={setActiveNotes} toggleCheck={toggleCheck} finishCleaning={finishCleaning} showToast={showToast}/>}
      {!active&&<Card style={{marginBottom:20}}>
        <div style={{marginBottom:14}}><Lbl>Tu nombre *</Lbl>
          <Sel value={employee} onChange={setEmployee}><option value="">-- Selecciona --</option>{appData.employees.map(e=><option key={e} value={e}>{e}</option>)}</Sel>
        </div>
        <div style={{marginBottom:14}}>
          <Lbl>Edificio *</Lbl>
          <Sel value={selectedBuilding} onChange={v=>{setSelectedBuilding(v);setAptId("");}}>
            <option value="">-- Selecciona edificio --</option>
            {buildingGroups.map(b=><option key={b} value={b}>📍 {b} ({sorted.filter(a=>a.building===b).length} aptos)</option>)}
          </Sel>
        </div>
        {selectedBuilding&&(
          <div style={{marginBottom:14}}>
            <Lbl>Apartamento *</Lbl>
            <Sel value={aptId} onChange={setAptId}>
              <option value="">-- Selecciona apartamento --</option>
              {sorted.filter(a=>a.building===selectedBuilding).map(a=><option key={a.id} value={a.id}>{a.displayName}{a.clientName?` — ${a.clientName}`:""}</option>)}
            </Sel>
          </div>
        )}
        {apt&&(
          <div style={{marginBottom:14,padding:"12px 14px",background:C.surface,borderRadius:8}}>
            <div style={{display:"flex",justifyContent:"space-between"}}><span style={{color:C.muted,fontSize:13}}>Cliente</span><span style={{fontWeight:700,fontSize:13,color:C.info}}>{apt.clientName||"—"}</span></div>
          </div>
        )}
        <div style={{marginBottom:14}}><Lbl>Fecha *</Lbl><Inp type="date" value={date} onChange={setDate}/></div>
        <div style={{marginBottom:20}}><Lbl>Observaciones (opcional)</Lbl>
          <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Estado del apartamento, novedades..." rows={3} style={{width:"100%",padding:"10px 14px",background:"#0b0f18",border:`1px solid ${C.border}`,borderRadius:"8px",color:C.text,fontSize:"14px",outline:"none",boxSizing:"border-box",fontFamily:"inherit",resize:"vertical"}}/>
        </div>
        <Btn onClick={startCleaning} disabled={saving} style={{width:"100%",padding:"14px",fontSize:16}}>{saving?"Guardando...":"▶ Empezar limpieza"}</Btn>
        <div style={{fontSize:11,color:C.muted,textAlign:"center",margin:"8px 0 14px"}}>Toca Empezar al llegar al apartamento y Terminé al salir. Se guarda la hora y la ubicación.</div>
        <details>
          <summary style={{cursor:"pointer",color:C.muted,fontSize:13,fontWeight:600}}>Registrar una limpieza ya hecha (sin cronómetro)</summary>

              <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Estado del apartamento, novedades..." rows={2} style={{width:"100%",padding:"10px 14px",background:"#0b0f18",border:`1px solid ${C.border}`,borderRadius:"8px",color:C.text,fontSize:"14px",outline:"none",boxSizing:"border-box",fontFamily:"inherit",resize:"vertical"}}/>
            </div>
            <Btn variant="ghost" onClick={handleSubmit} disabled={saving} style={{width:"100%"}}>{saving?"Guardando...":"✓ Registrar sin cronómetro"}</Btn>
          </div>
        </details>
      </Card>}
      {!active&&<div style={{marginBottom:20}}>
        <button onClick={()=>setShowNewApt(!showNewApt)} style={{width:"100%",padding:"12px",background:"transparent",border:`1px dashed ${C.border}`,borderRadius:10,color:C.muted,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:600}}>
          {showNewApt?"✕ Cancelar":"➕ Agregar apartamento nuevo"}
        </button>
        {showNewApt&&(
          <Card style={{marginTop:10}}>
            <h3 style={{margin:"0 0 14px",fontSize:14,fontWeight:700}}>Nuevo apartamento</h3>
            <div style={{marginBottom:12}}><Lbl>Número de apto</Lbl><Inp value={nAptNum} onChange={setNAptNum} placeholder="Ej: 303"/></div>
            <div style={{marginBottom:12}}><Lbl>Edificio *</Lbl><input list="emp-blist" value={nBuilding} onChange={e=>setNBuilding(e.target.value)} placeholder="Ej: Monserrate" style={inpStyle}/><datalist id="emp-blist">{buildings.map(b=><option key={b} value={b}/>)}</datalist></div>
            <div style={{marginBottom:16}}><Lbl>Cliente</Lbl><input list="emp-clist" value={nClient} onChange={e=>setNClient(e.target.value)} placeholder="Ej: Veronica" style={inpStyle}/><datalist id="emp-clist">{clients.map(cl=><option key={cl} value={cl}/>)}</datalist></div>
            <div style={{fontSize:11,color:C.muted,marginBottom:12}}>* El precio lo define el admin después.</div>
            <Btn onClick={handleAddApt} style={{width:"100%"}}>+ Agregar</Btn>
          </Card>
        )}
      </div>}
      {employee&&<DiaResumen cleanings={appData.cleanings} employee={employee} now={now}/>}

      {/* Historial de limpiezas por fecha */}
      <CleaningHistoryEmployee cleanings={appData.cleanings}/>
    </div>
  );
}

function BackupSection({appData,update,showToast}){
  const firstDay=todayStr().slice(0,8)+"01";
  const [dateFrom,setDateFrom]=useState(firstDay);
  const [dateTo,setDateTo]=useState(todayStr());
  const fileRef=React.useRef(null);
  const inpStyle={width:"100%",padding:"10px 14px",background:"#0b0f18",border:`1px solid ${C.border}`,borderRadius:"8px",color:C.text,fontSize:"14px",outline:"none",boxSizing:"border-box",fontFamily:"inherit"};

  const toCSV=(rows,headers)=>{
    const esc=(v)=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
    return[headers.map(esc).join(","),...rows.map(r=>headers.map(h=>esc(r[h])).join(","))].join("\n");
  };

  const downloadExcel=()=>{
    const filtered=appData.cleanings.filter(c=>{
      if(dateFrom&&c.date<dateFrom)return false;
      if(dateTo&&c.date>dateTo)return false;
      return true;
    }).sort((a,b)=>a.date?.localeCompare(b.date)||a.createdAt-b.createdAt);
    if(filtered.length===0){showToast("No hay registros en ese rango","error");return;}

    const headers=["Fecha","Hora","Encargado","Apartamento","Cliente","Observaciones","Valor","Pagado"];
    const rows=filtered.map(c=>({"Fecha":fmtDate(c.date),"Hora":c.time||"","Encargado":c.employeeName||"","Apartamento":c.apartmentName||"","Cliente":c.clientName||"","Observaciones":c.notes||"","Valor":c.amount||0,"Pagado":c.paid?"Sí":"No"}));

    const byEmp={};
    filtered.forEach(c=>{if(!byEmp[c.employeeName])byEmp[c.employeeName]={limpiezas:0,total:0,pagado:0,pendiente:0};byEmp[c.employeeName].limpiezas++;byEmp[c.employeeName].total+=c.amount||0;if(c.paid)byEmp[c.employeeName].pagado+=c.amount||0;else byEmp[c.employeeName].pendiente+=c.amount||0;});
    const empRows=Object.entries(byEmp).map(([n,d])=>({"Encargado":n,"Limpiezas":d.limpiezas,"Total":d.total,"Pagado":d.pagado,"Pendiente":d.pendiente}));

    const byClient={};
    filtered.forEach(c=>{const k=c.clientName||"Sin cliente";if(!byClient[k])byClient[k]={limpiezas:0,total:0,pagado:0,pendiente:0};byClient[k].limpiezas++;byClient[k].total+=c.amount||0;if(c.paid)byClient[k].pagado+=c.amount||0;else byClient[k].pendiente+=c.amount||0;});
    const clientRows=Object.entries(byClient).map(([n,d])=>({"Cliente":n,"Limpiezas":d.limpiezas,"Total":d.total,"Pagado":d.pagado,"Pendiente":d.pendiente}));

    const sep="\n\n";
    const csv="﻿"+"REGISTROS DE LIMPIEZAS\n"+toCSV(rows,headers)+sep+"RESUMEN POR ENCARGADO\n"+toCSV(empRows,["Encargado","Limpiezas","Total","Pagado","Pendiente"])+sep+"RESUMEN POR CLIENTE\n"+toCSV(clientRows,["Cliente","Limpiezas","Total","Pagado","Pendiente"]);
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;a.download=`limpiezas-${dateFrom}-al-${dateTo}.csv`;a.click();
    URL.revokeObjectURL(url);
    showToast(`Excel descargado — ${filtered.length} registros ✅`);
  };

  const downloadJson=()=>{
    const blob=new Blob([JSON.stringify(appData,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=`backup-${todayStr()}.json`;a.click();
    URL.revokeObjectURL(url);showToast("Backup completo descargado ✅");
  };

  const uploadBackup=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const p=JSON.parse(ev.target.result);
        if(!p.apartments||!p.cleanings||!p.employees||!p.settings){showToast("Archivo inválido","error");return;}
        if(!window.confirm("¿Restaurar este backup? Se reemplazarán todos los datos actuales."))return;
        update("settings",p.settings);
        DOC_REF.update({"state.employees":p.employees}).catch(e=>console.error(e));
        CLEANINGS_COL.get().then(snap=>{
          const batch=db.batch();
          snap.docs.forEach(d=>batch.delete(d.ref));
          p.cleanings.forEach(c=>{const {id,...rest}=c;batch.set(CLEANINGS_COL.doc(id||uid()),rest);});
          return batch.commit();
        }).then(()=>showToast("Registros de limpieza restaurados ✅"))
          .catch(e=>{console.error(e);showToast("Error al restaurar los registros","error");});
        APARTMENTS_COL.get().then(snap=>{
          const batch=db.batch();
          snap.docs.forEach(d=>batch.delete(d.ref));
          p.apartments.forEach(a=>{const {id,...rest}=a;batch.set(APARTMENTS_COL.doc(id||uid()),rest);});
          return batch.commit();
        }).then(()=>showToast("Apartamentos restaurados ✅"))
          .catch(e=>{console.error(e);showToast("Error al restaurar los apartamentos","error");});
      }catch(err){showToast("Error al leer el archivo","error");}
    };
    reader.readAsText(file);e.target.value="";
  };

  const count=appData.cleanings.filter(c=>(!dateFrom||c.date>=dateFrom)&&(!dateTo||c.date<=dateTo)).length;

  return(
    <div style={{maxWidth:560}}>
      <h3 style={{margin:"0 0 20px",fontSize:17,fontWeight:800}}>💾 Backup y exportación</h3>
      <Card style={{marginBottom:16}}>
        <h4 style={{margin:"0 0 6px",fontSize:14,fontWeight:700,color:C.accent}}>📊 Exportar a Excel</h4>
        <p style={{margin:"0 0 16px",fontSize:13,color:C.muted,lineHeight:1.5}}>Exporta los registros en formato CSV (compatible con Excel y Google Sheets). Filtra por rango de fechas. Incluye registros, resumen por encargado y resumen por cliente.</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
          <div><div style={{fontSize:11,fontWeight:600,color:C.muted,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:6}}>Desde</div><input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)} style={inpStyle}/></div>
          <div><div style={{fontSize:11,fontWeight:600,color:C.muted,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:6}}>Hasta</div><input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)} style={inpStyle}/></div>
        </div>
        <button onClick={downloadExcel} style={{width:"100%",padding:"13px",background:"#14532d",border:`1px solid ${C.success}`,borderRadius:8,color:C.success,cursor:"pointer",fontFamily:"inherit",fontSize:14,fontWeight:700}}>
          ⬇️ Descargar Excel ({count} registros)
        </button>
      </Card>
      <Card>
        <h4 style={{margin:"0 0 6px",fontSize:14,fontWeight:700,color:C.info}}>🗄️ Backup completo</h4>
        <p style={{margin:"0 0 16px",fontSize:13,color:C.muted,lineHeight:1.5}}>Descarga o restaura un backup de todos los datos: apartamentos, encargados, configuración y registros históricos.</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <button onClick={downloadJson} style={{padding:"12px",background:"#1e3a5f",border:`1px solid ${C.info}`,borderRadius:8,color:C.info,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700}}>⬇️ Descargar backup</button>
          <button onClick={()=>fileRef.current.click()} style={{padding:"12px",background:"#450a0a",border:`1px solid ${C.danger}`,borderRadius:8,color:C.danger,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700}}>⬆️ Restaurar backup</button>
        </div>
        <input ref={fileRef} type="file" accept=".json" onChange={uploadBackup} style={{display:"none"}}/>
        <div style={{marginTop:12,padding:"10px 12px",background:"#0b0f18",borderRadius:8,fontSize:11,color:C.muted}}>⚠️ Al restaurar se reemplazarán <strong style={{color:C.text}}>todos los datos actuales</strong>.</div>
      </Card>
    </div>
  );
}

function DashboardTab({appData}){
  const {cleanings}=appData;
  const today=todayStr(), thisMonth=today.slice(0,7);

  // Stats
  const todayC   = cleanings.filter(c=>c.date===today);
  const monthC   = cleanings.filter(c=>c.date&&c.date.startsWith(thisMonth));
  const allPending= cleanings.filter(c=>!c.paid);
  const totalPending=allPending.reduce((s,c)=>s+(c.amount||0),0);
  const totalMonth  =monthC.reduce((s,c)=>s+(c.amount||0),0);
  const paidMonth   =monthC.filter(c=>c.paid).reduce((s,c)=>s+(c.amount||0),0);
  const totalAll    =cleanings.reduce((s,c)=>s+(c.amount||0),0);
  const paidAll     =cleanings.filter(c=>c.paid).reduce((s,c)=>s+(c.amount||0),0);

  // Month-by-month breakdown (all history)
  const byMonth={};
  cleanings.forEach(c=>{
    if(!c.date) return;
    const m=c.date.slice(0,7);
    if(!byMonth[m]) byMonth[m]={month:m,count:0,total:0,paid:0,pending:0};
    byMonth[m].count++;
    byMonth[m].total+=c.amount||0;
    if(c.paid) byMonth[m].paid+=c.amount||0;
    else byMonth[m].pending+=c.amount||0;
  });
  const months=Object.values(byMonth).sort((a,b)=>b.month.localeCompare(a.month));
  const fmtMonth=m=>{ const [y,mo]=m.split("-"); const names=["","Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"]; return `${names[parseInt(mo)]} ${y}`; };

  const recent=[...cleanings].sort((a,b)=>b.createdAt-a.createdAt).slice(0,10);

  return(
    <div>
      <h2 style={{margin:"0 0 20px",fontSize:22,fontWeight:800}}>Resumen general</h2>

      {/* KPI cards */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:16,marginBottom:24}}>
        {[
          {label:"Limpiezas hoy",       value:todayC.length,        color:C.info,    icon:"🧹", sub:"registros de hoy"},
          {label:"Este mes",            value:monthC.length,        color:C.accent,  icon:"📅", sub:`${fmtCOP(totalMonth)} facturado`},
          {label:"Cobrado este mes",    value:fmtCOP(paidMonth),    color:C.success, icon:"💰", sub:`de ${fmtCOP(totalMonth)} total`},
          {label:"⚠️ Por cobrar total", value:fmtCOP(totalPending), color:C.danger,  icon:"⏳", sub:`${allPending.length} registros pendientes`},
        ].map(s=><Card key={s.label} style={{borderTop:`3px solid ${s.color}`}}><div style={{fontSize:28,marginBottom:8}}>{s.icon}</div><div style={{fontSize:22,fontWeight:800,color:s.color}}>{s.value}</div><div style={{fontSize:13,color:C.muted,marginTop:4}}>{s.label}</div><div style={{fontSize:11,color:C.muted,marginTop:2}}>{s.sub}</div></Card>)}
      </div>

      {/* Month comparison */}
      {months.length>0&&(
        <Card style={{marginBottom:24}}>
          <h3 style={{margin:"0 0 4px",fontSize:15,fontWeight:700}}>📆 Comparativo mes a mes</h3>
          <p style={{margin:"0 0 16px",fontSize:12,color:C.muted}}>Historial completo guardado — nunca se pierde</p>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead>
                <tr style={{borderBottom:`1px solid ${C.border}`}}>
                  {["Mes","Limpiezas","Facturado","Cobrado","Pendiente"].map(h=><th key={h} style={{textAlign:"left",padding:"8px 12px",color:C.muted,fontWeight:700}}>{h}</th>)}
                </tr>
              </thead>
              <tbody>
                {months.map(m=>(
                  <tr key={m.month} style={{borderBottom:`1px solid ${C.border}`,background:m.month===thisMonth?"#1a2a1a":"transparent"}}>
                    <td style={{padding:"10px 12px",fontWeight:700,color:m.month===thisMonth?C.success:C.text}}>{fmtMonth(m.month)}{m.month===thisMonth&&<span style={{marginLeft:6,fontSize:10,color:C.success,fontWeight:600}}>● actual</span>}</td>
                    <td style={{padding:"10px 12px",color:C.muted}}>{m.count}</td>
                    <td style={{padding:"10px 12px",fontWeight:600}}>{fmtCOP(m.total)}</td>
                    <td style={{padding:"10px 12px",color:C.success,fontWeight:600}}>{fmtCOP(m.paid)}</td>
                    <td style={{padding:"10px 12px",color:m.pending>0?C.danger:C.muted,fontWeight:m.pending>0?700:400}}>{m.pending>0?fmtCOP(m.pending):"—"}</td>
                  </tr>
                ))}
                <tr style={{borderTop:`2px solid ${C.border}`,background:C.surface}}>
                  <td style={{padding:"10px 12px",fontWeight:800,color:C.text}}>TOTAL</td>
                  <td style={{padding:"10px 12px",fontWeight:800}}>{cleanings.length}</td>
                  <td style={{padding:"10px 12px",fontWeight:800}}>{fmtCOP(totalAll)}</td>
                  <td style={{padding:"10px 12px",fontWeight:800,color:C.success}}>{fmtCOP(paidAll)}</td>
                  <td style={{padding:"10px 12px",fontWeight:800,color:C.danger}}>{fmtCOP(totalPending)}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </Card>
      )}

      {/* Pending payments — never lost */}
      {allPending.length>0&&(
        <Card style={{marginBottom:24,borderLeft:`4px solid ${C.danger}`}}>
          <h3 style={{margin:"0 0 4px",fontSize:15,fontWeight:700,color:C.danger}}>⏳ Pendientes por cobrar ({allPending.length})</h3>
          <p style={{margin:"0 0 14px",fontSize:12,color:C.muted}}>Registros de todos los meses sin pagar — {fmtCOP(totalPending)}</p>
          <div style={{maxHeight:260,overflowY:"auto"}}>
            {[...allPending].sort((a,b)=>a.date?.localeCompare(b.date)).map(c=>(
              <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 0",borderBottom:`1px solid ${C.border}`}}>
                <div>
                  <div style={{fontSize:13,fontWeight:600}}>{c.apartmentName} <span style={{color:C.info,fontWeight:400}}>· {c.clientName}</span></div>
                  <div style={{fontSize:11,color:C.muted,marginTop:2}}>{fmtDate(c.date)} · {c.employeeName}</div>
                </div>
                <span style={{color:C.danger,fontWeight:800,fontSize:13,whiteSpace:"nowrap"}}>{fmtCOP(c.amount)}</span>
              </div>
            ))}
          </div>
        </Card>
      )}

      {/* Recent */}
      <Card>
        <h3 style={{margin:"0 0 16px",fontSize:15,fontWeight:700}}>Registros recientes</h3>
        {recent.length===0?<div style={{textAlign:"center",padding:40,color:C.muted}}>No hay registros aún.</div>:(
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
              <thead><tr style={{borderBottom:`1px solid ${C.border}`}}>{["Fecha","Encargado","Apartamento","Cliente","Valor","Estado"].map(h=><th key={h} style={{textAlign:"left",padding:"8px 12px",color:C.muted,fontWeight:700}}>{h}</th>)}</tr></thead>
              <tbody>{recent.map(c=><tr key={c.id} style={{borderBottom:`1px solid ${C.border}`}}><td style={{padding:"10px 12px",color:C.muted}}>{fmtDate(c.date)}</td><td style={{padding:"10px 12px",fontWeight:700}}>{c.employeeName}</td><td style={{padding:"10px 12px"}}>{c.apartmentName}</td><td style={{padding:"10px 12px",color:C.info,fontWeight:600}}>{c.clientName||"—"}</td><td style={{padding:"10px 12px",color:C.accent,fontWeight:700}}>{fmtCOP(c.amount)}</td><td style={{padding:"10px 12px"}}><Badge paid={c.paid}/></td></tr>)}</tbody>
            </table>
          </div>
        )}
      </Card>
    </div>
  );
}

    f.startedAt=s; f.finishedAt=e; f.durationMin=(s&&e)?Math.round((e-s)/60000):null;

    onSave(f);
  };
  const sorted=[...appData.apartments].sort((a,b)=>a.displayName.localeCompare(b.displayName));
  const buildingGroups=[...new Set(sorted.map(a=>a.building))];

        <div style={{marginBottom:14}}><Lbl>Observaciones</Lbl>

function CleaningsTab({appData,update,showToast}){
  const [fDate,setFDate]=useState("");
  const [fEmp,setFEmp]=useState("");
  const [fApt,setFApt]=useState("");
  const [fClient,setFClient]=useState("");
  const [fPaid,setFPaid]=useState("all");
  const [editing,setEditing]=useState(null);
  const [viewing,setViewing]=useState(null);
  const filtered=appData.cleanings.filter(c=>{
    if(fDate&&c.date!==fDate) return false;
    if(fEmp&&!c.employeeName?.toLowerCase().includes(fEmp.toLowerCase())) return false;
    if(fApt&&!c.apartmentName?.toLowerCase().includes(fApt.toLowerCase())) return false;
    if(fClient&&!c.clientName?.toLowerCase().includes(fClient.toLowerCase())) return false;
    if(fPaid==="paid"&&!c.paid) return false;
    if(fPaid==="pending"&&c.paid) return false;
    return true;
  }).sort((a,b)=>b.date!==a.date?b.date?.localeCompare(a.date):b.createdAt-a.createdAt);
  const togglePaid=(id)=>{
    const found=appData.cleanings.find(c=>c.id===id);
    CLEANINGS_COL.doc(id).update({paid:!found.paid})
      .then(()=>showToast(found?.paid?"Marcado como pendiente":"Marcado como pagado ✅"))
      .catch(e=>{console.error(e);showToast("No se pudo actualizar","error");});
  };
  const del=(id)=>{
    if(!window.confirm("¿Eliminar este registro?"))return;
    CLEANINGS_COL.doc(id).delete()
      .then(()=>showToast("Registro eliminado","error"))
      .catch(e=>{console.error(e);showToast("No se pudo eliminar","error");});
  };
  const markDup=(c,keepId)=>CLEANINGS_COL.doc(c.id).update({duplicado:true,duplicadoDe:keepId||"",amountOriginal:c.amount||0,amount:0,notes:"DUPLICADO | "+(c.notes||"")});
  const markOne=(c)=>{
    if(!window.confirm(`¿Marcar como duplicado ${c.apartmentName} del ${fmtDate(c.date)} (${c.employeeName||"sin encargado"})?\n\nDeja de contar en los totales, pero no se borra y se puede restaurar.`))return;
    markDup(c).then(()=>showToast("Marcado como duplicado")).catch(e=>{console.error(e);showToast("No se pudo marcar","error");});
  };
  const autoDups=findDuplicates(appData.cleanings);
  const pairs=findPairs(appData.cleanings);
  const [showDupPanel,setShowDupPanel]=useState(false);
  const fixAll=()=>{
    const sum=autoDups.reduce((s,c)=>s+(c.amount||0),0);
    if(!window.confirm(`Se marcarán ${autoDups.length} registros repetidos (${fmtCOP(sum)}) como duplicados.\n\nNo se borran: dejan de contar en los totales y se pueden restaurar. ¿Continuar?`))return;
    const batch=db.batch();
    autoDups.forEach(c=>batch.update(CLEANINGS_COL.doc(c.id),{duplicado:true,duplicadoDe:c.keepId,amountOriginal:c.amount||0,amount:0,notes:"DUPLICADO | "+(c.notes||"")}));
    batch.commit().then(()=>showToast(`${autoDups.length} duplicados corregidos ✅`)).catch(e=>{console.error(e);showToast("No se pudo corregir","error");});
  };
  const restore=(c)=>{
    CLEANINGS_COL.doc(c.id).update({duplicado:false,amount:c.amountOriginal||0,notes:String(c.notes||"").replace(/^DUPLICADO \| /,"")})
      .then(()=>showToast("Registro restaurado ✅")).catch(e=>{console.error(e);showToast("No se pudo restaurar","error");});
  };
  const saveEdit=(form)=>{
    const {id,...rest}=form;
    CLEANINGS_COL.doc(id).update(rest)
      .then(()=>{setEditing(null);showToast("Registro actualizado ✅");})
      .catch(e=>{console.error(e);showToast("No se pudo actualizar","error");});
  };
  const total=filtered.reduce((s,c)=>s+(c.amount||0),0);
  const totalPaid=filtered.filter(c=>c.paid).reduce((s,c)=>s+(c.amount||0),0);
  return(
    <div>
      {editing&&<EditModal cleaning={editing} appData={appData} onSave={saveEdit} onClose={()=>setEditing(null)}/>}
      {viewing&&<FotosModal cleaning={viewing} onClose={()=>setViewing(null)}/>}
      <h2 style={{margin:"0 0 20px",fontSize:22,fontWeight:800}}>Todos los registros</h2>
      {(autoDups.length>0||pairs.length>0||(appData.duplicates||[]).length>0)&&(
        <Card style={{marginBottom:20,border:`1px solid ${autoDups.length>0?C.danger:C.border}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
            <div>
              <div style={{fontWeight:800,fontSize:14}}>⧉ Revisión de duplicados</div>
              <div style={{color:C.muted,fontSize:12,marginTop:4}}>
                {autoDups.length>0?<span style={{color:C.danger,fontWeight:700}}>{autoDups.length} repetidos ({fmtCOP(autoDups.reduce((s,c)=>s+(c.amount||0),0))}) · </span>:null}
                {pairs.length} apto/día con varias personas · {(appData.duplicates||[]).length} ya marcados
              </div>
            </div>
            <div style={{display:"flex",gap:8}}>
              {autoDups.length>0&&<Btn variant="danger" size="sm" onClick={fixAll}>Corregir {autoDups.length} repetidos</Btn>}
              <Btn variant="ghost" size="sm" onClick={()=>setShowDupPanel(!showDupPanel)}>{showDupPanel?"Ocultar":"Ver detalle"}</Btn>
            </div>
          </div>
          {showDupPanel&&(
            <div style={{marginTop:14,fontSize:13}}>
              {autoDups.length>0&&<div style={{marginBottom:12}}><Lbl>Repetidos (misma persona, mismo apto, mismo día)</Lbl>
                {autoDups.map(c=><div key={c.id} style={{display:"flex",justifyContent:"space-between",gap:8,padding:"6px 0",borderTop:`1px solid ${C.border}`}}><span>{fmtDate(c.date)} · {c.apartmentName} · {c.employeeName||"sin encargado"}</span><span style={{color:C.accent,fontWeight:700}}>{fmtCOP(c.amount)}</span></div>)}
              </div>}
              {pairs.length>0&&<div style={{marginBottom:12}}><Lbl>Varias personas en el mismo apto el mismo día — ¿pareja o doble registro?</Lbl>
                {pairs.map(v=><div key={v[0].id} style={{padding:"6px 0",borderTop:`1px solid ${C.border}`}}>
                  <div style={{fontWeight:700}}>{fmtDate(v[0].date)} · {v[0].apartmentName}</div>
                  {v.map(c=><div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,marginTop:4}}><span style={{color:C.muted}}>{c.employeeName||"sin encargado"} · {fmtCOP(c.amount)}{c.paid?" · pagado":""}</span>{!c.paid&&<Btn variant="ghost" size="sm" onClick={()=>markOne(c)}>Marcar duplicado</Btn>}</div>)}
                </div>)}
              </div>}
              {(appData.duplicates||[]).length>0&&<div><Lbl>Ya marcados como duplicado (no cuentan)</Lbl>
                {appData.duplicates.map(c=><div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,padding:"6px 0",borderTop:`1px solid ${C.border}`}}><span style={{color:C.muted}}>{fmtDate(c.date)} · {c.apartmentName} · {c.employeeName||"sin encargado"} · {fmtCOP(c.amountOriginal)}</span><Btn variant="ghost" size="sm" onClick={()=>restore(c)}>Restaurar</Btn></div>)}
              </div>}
            </div>
          )}
        </Card>
      )}
      <Card style={{marginBottom:20}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12}}>
          <div><Lbl>Fecha</Lbl><Inp type="date" value={fDate} onChange={setFDate}/></div>
          <div><Lbl>Encargado</Lbl><Inp value={fEmp} onChange={setFEmp} placeholder="Buscar..."/></div>
          <div><Lbl>Apartamento</Lbl><Inp value={fApt} onChange={setFApt} placeholder="Buscar..."/></div>
          <div><Lbl>Cliente</Lbl><Inp value={fClient} onChange={setFClient} placeholder="Buscar..."/></div>
          <div><Lbl>Estado</Lbl><Sel value={fPaid} onChange={setFPaid}><option value="all">Todos</option><option value="paid">Pagados</option><option value="pending">Pendientes</option></Sel></div>
        </div>
        <div style={{marginTop:12,display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <span style={{color:C.muted,fontSize:13}}>{filtered.length} registro{filtered.length!==1?"s":""}</span>
          <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
            <span style={{color:C.muted,fontSize:13}}>Total: <strong style={{color:C.text}}>{fmtCOP(total)}</strong></span>
            <span style={{color:C.muted,fontSize:13}}>Cobrado: <strong style={{color:C.success}}>{fmtCOP(totalPaid)}</strong></span>
            <span style={{color:C.muted,fontSize:13}}>Pendiente: <strong style={{color:C.danger}}>{fmtCOP(total-totalPaid)}</strong></span>
          </div>
        </div>
      </Card>
      <Card style={{padding:0,overflow:"hidden"}}>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{background:C.surface}}>{["Fecha","Encargado","Apartamento","Cliente","Notas","Valor","Estado",""].map((h,i)=><th key={i} style={{textAlign:"left",padding:"12px 16px",color:C.muted,fontWeight:700,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>

function ClientsTab({appData,update,showToast}){
  const [search,setSearch]=useState("");
  const [filterStatus,setFilterStatus]=useState("all");
  const [expanded,setExpanded]=useState(null);
  const grouped={};
  appData.cleanings.forEach(c=>{
    const key=c.clientName||"Sin cliente";
    if(!grouped[key]) grouped[key]={clientName:key,apartments:new Set(),cleanings:[],total:0,paid:0,owed:0};
    grouped[key].cleanings.push(c);
    grouped[key].apartments.add(c.apartmentName);
    grouped[key].total+=c.amount||0;
    if(c.paid) grouped[key].paid+=c.amount||0;
    else grouped[key].owed+=c.amount||0;
  });
  const rows=Object.entries(grouped).filter(([k])=>k.toLowerCase().includes(search.toLowerCase())).filter(([,g])=>{if(filterStatus==="owed") return g.owed>0;if(filterStatus==="paid") return g.owed===0;return true;}).sort((a,b)=>b[1].owed-a[1].owed);
  const gTotal=rows.reduce((s,[,g])=>s+g.total,0);
  const gPaid=rows.reduce((s,[,g])=>s+g.paid,0);
  const gOwed=rows.reduce((s,[,g])=>s+g.owed,0);
  const markAllPaid=(key)=>{
    const g=grouped[key];const ids=g.cleanings.filter(c=>!c.paid).map(c=>c.id);
    if(ids.length===0)return;
    const batch=db.batch();
    ids.forEach(id=>batch.update(CLEANINGS_COL.doc(id),{paid:true}));
    batch.commit()
      .then(()=>showToast(`Todo pagado para ${key} ✅`))
      .catch(e=>{console.error(e);showToast("No se pudo actualizar","error");});
  };
  const toggleOne=(id)=>{
    const found=appData.cleanings.find(c=>c.id===id);
    CLEANINGS_COL.doc(id).update({paid:!found.paid}).catch(e=>console.error(e));
  };
  return(
    <div>
      <h2 style={{margin:"0 0 20px",fontSize:22,fontWeight:800}}>Estado por cliente</h2>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16,marginBottom:24}}>
        {[{label:"Total facturado",color:C.text,value:fmtCOP(gTotal)},{label:"Total cobrado",color:C.success,value:fmtCOP(gPaid)},{label:"Por cobrar",color:C.danger,value:fmtCOP(gOwed)}].map(s=>(
          <Card key={s.label} style={{textAlign:"center"}}><div style={{fontSize:20,fontWeight:800,color:s.color}}>{s.value}</div><div style={{fontSize:12,color:C.muted,marginTop:4}}>{s.label}</div></Card>
        ))}
      </div>
      <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:200}}><Inp value={search} onChange={setSearch} placeholder="🔍 Buscar cliente..."/></div>
        <Sel value={filterStatus} onChange={setFilterStatus} style={{width:"auto",minWidth:180}}><option value="all">Todos</option><option value="owed">Con deuda</option><option value="paid">Sin deuda</option></Sel>
      </div>
      {rows.length===0?<Card style={{textAlign:"center",color:C.muted,padding:40}}>No hay datos</Card>
      :rows.map(([key,g])=>{
        const isExp=expanded===key;
        return(
          <Card key={key} style={{marginBottom:12}}>
            <div onClick={()=>setExpanded(isExp?null:key)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",flexWrap:"wrap",gap:12}}>
              <div>
                <div style={{fontWeight:800,fontSize:16}}>{key}</div>
                <div style={{color:C.muted,fontSize:12,marginTop:2}}>{g.cleanings.length} limpieza{g.cleanings.length!==1?"s":""} · {[...g.apartments].join(", ")}</div>
              </div>
              <div style={{display:"flex",gap:20,alignItems:"center",flexWrap:"wrap"}}>
                <div style={{textAlign:"right"}}><div style={{fontSize:11,color:C.muted}}>Cobrado</div><div style={{fontWeight:800,color:C.success,fontSize:15}}>{fmtCOP(g.paid)}</div></div>
                <div style={{textAlign:"right"}}><div style={{fontSize:11,color:C.muted}}>Por cobrar</div><div style={{fontWeight:800,color:g.owed>0?C.danger:C.muted,fontSize:15}}>{fmtCOP(g.owed)}</div></div>
                {g.owed>0&&<Btn variant="success" size="sm" onClick={e=>{e.stopPropagation();markAllPaid(key);}}>✓ Pagar todo</Btn>}
                <span style={{color:C.muted}}>{isExp?"▲":"▼"}</span>
              </div>
            </div>
            {isExp&&(
              <div style={{marginTop:16,borderTop:`1px solid ${C.border}`,paddingTop:16}}>
                {g.cleanings.sort((a,b)=>b.date?.localeCompare(a.date)).map(c=>(
                  <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
                    <div>
                      <div style={{fontSize:13,fontWeight:600}}>{fmtDate(c.date)} — <span style={{color:C.muted,fontWeight:400}}>{c.apartmentName}</span></div>
                      <div style={{fontSize:11,color:C.muted,marginTop:2}}>{c.employeeName}{c.notes?` · ${c.notes}`:""}</div>
                    </div>
                    <div style={{display:"flex",gap:12,alignItems:"center"}}>
                      <span style={{color:C.accent,fontWeight:800,fontSize:13}}>{fmtCOP(c.amount)}</span>
                      <button onClick={()=>toggleOne(c.id)} style={{padding:"4px 12px",border:"none",borderRadius:20,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"inherit",background:c.paid?"#14532d":"#450a0a",color:c.paid?C.success:C.danger}}>{c.paid?"✓ Pagado":"Pendiente"}</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </Card>
        );
      })}
    </div>
  );
}

// ⏱ Tiempos y ganancia: por apartamento, por aseadora y por jornada (con tiempos muertos)
function TiemposTab({appData}){
  const k=getCosts(appData.settings);
  const clients=[...new Set(appData.apartments.map(a=>a.clientName).filter(Boolean))].sort();
  const [fClient,setFClient]=useState(clients.includes("TCG")?"TCG":"");
  const [desde,setDesde]=useState(daysAgoStr(60));
  const [hasta,setHasta]=useState(todayStr());
  const inRange=c=>c.date>=desde&&c.date<=hasta&&(!fClient||c.clientName===fClient);
  const enRango=appData.cleanings.filter(inRange);
  // Menos de 5 min o más de 8 h se toma como error de registro y no cuenta
  const timed=enRango.filter(c=>{const d=durMin(c);return d!=null&&d>=5&&d<=480;});
  const enCurso=appData.cleanings.filter(c=>c.enCurso);
  const aptOf=(c)=>appData.apartments.find(a=>a.id===c.apartmentId)||appData.apartments.find(a=>normTxt(a.displayName)===normTxt(c.apartmentName));
  // Por apartamento
  const apts=appData.apartments.filter(a=>!fClient||a.clientName===fClient);
  const aptRows=apts.map(a=>{
    const ts=timed.filter(c=>aptOf(c)?.id===a.id).map(durMin);
    const n=ts.length, avg=n?ts.reduce((s,x)=>s+x,0)/n:null;
    const e=econ(a.price,avg,juegosOf(a),k);
    return {a,n,avg,min:n?Math.min(...ts):null,max:n?Math.max(...ts):null,e,servicios:enRango.filter(c=>aptOf(c)?.id===a.id).length};
  }).filter(r=>r.servicios>0||r.n>0).sort((x,y)=>(y.n-x.n)||x.a.displayName.localeCompare(y.a.displayName));
  // Jornadas: aseadora + día, con tiempos muertos entre un apartamento y el siguiente
  const days={};
  timed.forEach(c=>{const key=c.date+"|"+(c.employeeName||"-");(days[key]=days[key]||[]).push(c);});
  const jornadas=Object.entries(days).map(([key,list])=>{
    const l=[...list].sort((a,b)=>a.startedAt-b.startedAt);
    let trabajado=0,muerto=0;
    l.forEach((c,i)=>{trabajado+=durMin(c);if(i>0){const g=(c.startedAt-l[i-1].finishedAt)/60000;if(g>0&&g<240)muerto+=g;}});
    return {date:l[0].date,emp:l[0].employeeName||"—",n:l.length,ini:l[0].startedAt,fin:l.at(-1).finishedAt,trabajado,muerto};
  }).sort((a,b)=>b.date.localeCompare(a.date)||a.emp.localeCompare(b.emp));
  // Por aseadora
  const emps={};
  jornadas.forEach(j=>{const e=emps[j.emp]||(emps[j.emp]={emp:j.emp,dias:0,n:0,trabajado:0,muerto:0});e.dias++;e.n+=j.n;e.trabajado+=j.trabajado;e.muerto+=j.muerto;});
  const empRows=Object.values(emps).sort((a,b)=>b.n-a.n);
  // Resumen
  const totTrab=jornadas.reduce((s,j)=>s+j.trabajado,0), totMuerto=jornadas.reduce((s,j)=>s+j.muerto,0);
  const medidosConPrecio=aptRows.filter(r=>r.n>0);
  const gananciaProm=(f)=>{const n=medidosConPrecio.reduce((s,r)=>s+r.n,0);return n?medidosConPrecio.reduce((s,r)=>s+r.e[f]*r.n,0)/n:null;};
  const gHoy=gananciaProm("gHoy"), gAiu=gananciaProm("gAiu");
  const money=(v)=>v==null?"—":<span style={{color:v>=0?C.success:C.danger,fontWeight:800}}>{v<0?"–":""}{fmtCOP(Math.abs(Math.round(v)))}</span>;
  const th={textAlign:"left",padding:"10px 12px",color:C.muted,fontWeight:700,whiteSpace:"nowrap",fontSize:12};
  const td={padding:"10px 12px",whiteSpace:"nowrap"};
  const kpi=(label,value,sub,color)=>(<Card style={{padding:16}}><div style={{fontSize:12,color:C.muted}}>{label}</div><div style={{fontSize:20,fontWeight:800,color:color||C.text,marginTop:4}}>{value}</div>{sub&&<div style={{fontSize:11,color:C.muted,marginTop:4}}>{sub}</div>}</Card>);
  return(
    <div>
      <h2 style={{margin:"0 0 6px",fontSize:22,fontWeight:800}}>Tiempos y ganancia</h2>
      <div style={{color:C.muted,fontSize:13,marginBottom:18}}>Solo cuentan las limpiezas con hora de entrada y salida (cronómetro o cargadas a mano en ✏️). Costos en Config → Costos.</div>
      <Card style={{marginBottom:16}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12}}>
          <div><Lbl>Cliente</Lbl><Sel value={fClient} onChange={setFClient}><option value="">Todos</option>{clients.map(c=><option key={c} value={c}>{c}</option>)}</Sel></div>
          <div><Lbl>Desde</Lbl><Inp type="date" value={desde} onChange={setDesde}/></div>
          <div><Lbl>Hasta</Lbl><Inp type="date" value={hasta} onChange={setHasta}/></div>
        </div>
      </Card>
      {enCurso.length>0&&<Card style={{marginBottom:16,border:`1px solid ${C.accent}`}}>
        <div style={{fontWeight:800,marginBottom:8}}>⏱ En curso ahora ({enCurso.length})</div>
        {enCurso.map(c=><div key={c.id} style={{fontSize:13,color:C.muted,padding:"3px 0"}}>{c.apartmentName} · {c.employeeName} · entró {toHM(c.startedAt)} ({fmtDate(c.date)})</div>)}
      </Card>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:12,marginBottom:20}}>
        {kpi("Servicios medidos",`${timed.length} de ${enRango.length}`,enRango.length?`${Math.round(timed.length/enRango.length*100)}% con hora de entrada y salida`:"")}
        {kpi("Tiempo promedio",timed.length?fmtMin(timed.reduce((s,c)=>s+durMin(c),0)/timed.length):"—","por apartamento")}
        {kpi("Horas trabajadas",fmtMin(totTrab),"dentro de los apartamentos",C.success)}
        {kpi("Tiempo muerto",fmtMin(totMuerto),totTrab?`${Math.round(totMuerto/(totTrab+totMuerto)*100)}% de la jornada`:"entre apartamentos",totMuerto?C.danger:C.muted)}
        {kpi("Ganancia por servicio hoy",money(gHoy),"IVA del 19% sobre todo")}
        {kpi("Ganancia por servicio con AIU",money(gAiu),`IVA solo sobre el AIU (${k.aiuPct}%)`)}
      </div>

      <h3 style={{fontSize:16,fontWeight:800,margin:"0 0 10px"}}>Por apartamento</h3>
      <Card style={{padding:0,overflow:"hidden",marginBottom:24}}><div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:C.surface}}>{["Apartamento","Tipo","Medidos","Tiempo promedio","Mín – máx","Precio","Ganancia hoy","Ganancia con AIU","Máximo para no perder (hoy / AIU)"].map(h=><th key={h} style={th}>{h}</th>)}</tr></thead>
          <tbody>
            {aptRows.length===0?<tr><td colSpan={9} style={{...td,textAlign:"center",color:C.muted,padding:30}}>Sin datos en este rango</td></tr>
            :aptRows.map(r=>(
              <tr key={r.a.id} style={{borderTop:`1px solid ${C.border}`}}>
                <td style={{...td,fontWeight:700}}>{r.a.displayName}</td>
                <td style={{...td,color:r.a.tipo?C.text:C.danger}}>{APT_TYPES[r.a.tipo]||"Sin tipo"}</td>
                <td style={td}>{r.n} de {r.servicios}</td>
                <td style={{...td,fontWeight:800,color:C.info}}>{fmtMin(r.avg)}</td>
                <td style={{...td,color:C.muted}}>{r.n?`${fmtMin(r.min)} – ${fmtMin(r.max)}`:"—"}</td>
                <td style={td}>{fmtCOP(r.a.price||0)}</td>
                <td style={td}>{money(r.e.gHoy)}</td>
                <td style={td}>{money(r.e.gAiu)}</td>
                <td style={{...td,color:C.muted}}>{fmtMin(r.e.maxHoy)} / {fmtMin(r.e.maxAiu)}</td>
              </tr>))}
          </tbody>
        </table>
      </div></Card>

      <h3 style={{fontSize:16,fontWeight:800,margin:"0 0 10px"}}>Por aseadora</h3>
      <Card style={{padding:0,overflow:"hidden",marginBottom:24}}><div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:C.surface}}>{["Aseadora","Días","Apartamentos","Por día","Tiempo promedio","Horas trabajadas","Tiempo muerto","Muerto por día"].map(h=><th key={h} style={th}>{h}</th>)}</tr></thead>
          <tbody>
            {empRows.length===0?<tr><td colSpan={8} style={{...td,textAlign:"center",color:C.muted,padding:30}}>Sin datos en este rango</td></tr>
            :empRows.map(e=>(
              <tr key={e.emp} style={{borderTop:`1px solid ${C.border}`}}>
                <td style={{...td,fontWeight:700}}>{e.emp}</td>
                <td style={td}>{e.dias}</td>
                <td style={td}>{e.n}</td>
                <td style={td}>{(e.n/e.dias).toFixed(1)}</td>
                <td style={{...td,fontWeight:800,color:C.info}}>{fmtMin(e.trabajado/e.n)}</td>
                <td style={{...td,color:C.success,fontWeight:700}}>{fmtMin(e.trabajado)}</td>
                <td style={{...td,color:e.muerto?C.danger:C.muted,fontWeight:700}}>{fmtMin(e.muerto)}</td>
                <td style={{...td,color:C.muted}}>{fmtMin(e.muerto/e.dias)}</td>
              </tr>))}
          </tbody>
        </table>
      </div></Card>

      <h3 style={{fontSize:16,fontWeight:800,margin:"0 0 10px"}}>Jornadas</h3>
      <Card style={{padding:0,overflow:"hidden"}}><div style={{overflowX:"auto",maxHeight:420,overflowY:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:C.surface,position:"sticky",top:0}}>{["Fecha","Aseadora","Apartamentos","Primera entrada","Última salida","Horas trabajadas","Tiempo muerto"].map(h=><th key={h} style={th}>{h}</th>)}</tr></thead>
          <tbody>
            {jornadas.length===0?<tr><td colSpan={7} style={{...td,textAlign:"center",color:C.muted,padding:30}}>Todavía no hay limpiezas con cronómetro</td></tr>
            :jornadas.map(j=>(
              <tr key={j.date+j.emp} style={{borderTop:`1px solid ${C.border}`}}>
                <td style={{...td,color:C.muted}}>{fmtDate(j.date)}</td>
                <td style={{...td,fontWeight:700}}>{j.emp}</td>
                <td style={td}>{j.n}</td>
                <td style={td}>{toHM(j.ini)}</td>
                <td style={td}>{toHM(j.fin)}</td>
                <td style={{...td,color:C.success,fontWeight:700}}>{fmtMin(j.trabajado)}</td>
                <td style={{...td,color:j.muerto?C.danger:C.muted,fontWeight:700}}>{fmtMin(j.muerto)}</td>
              </tr>))}
          </tbody>
        </table>
      </div></Card>
    </div>
  );
}

function CostosSection({appData,update,showToast}){
  const k0=getCosts(appData.settings);
  const [k,setK]=useState(k0);
  const fields=[
    ["costoHora","Costo de una hora productiva de aseadora","Salario + prestaciones + recargos, dividido por las horas que de verdad se trabajan"],
    ["lenceriaJuego","Costo de lavar un juego de lencería","Insumos, servicios, operaria de la lavandería y desgaste"],
    ["insumos","Productos, equipos y daños por servicio",""],
    ["admin","Coordinación y administración por servicio",""],
    ["aiuPct","AIU (% del valor sin IVA)","Mínimo 10%"],
    ["ivaPct","IVA (%)",""],
  ];
  const save=()=>{ const c={...k}; fields.forEach(([f])=>{c[f]=Number(c[f])||0;}); update("settings",{...appData.settings,costs:c}); showToast("Costos guardados ✅"); };
  return(
    <Card style={{maxWidth:560}}>
      <h3 style={{margin:"0 0 6px",fontSize:15,fontWeight:700}}>Parámetros de costo</h3>

      {fields.map(([f,l,h])=>(
        <div key={f} style={{marginBottom:12}}><Lbl>{l}</Lbl><Inp type="number" value={k[f]} onChange={v=>setK(p=>({...p,[f]:v}))}/>{h&&<div style={{fontSize:11,color:C.muted,marginTop:4}}>{h}</div>}</div>
      ))}
      <label style={{display:"flex",gap:10,alignItems:"center",fontSize:13,margin:"6px 0 16px",cursor:"pointer"}}>

      </label>
