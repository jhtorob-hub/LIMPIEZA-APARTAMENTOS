function CleaningsTab({appData,update,showToast}){
  const [fDate,setFDate]=useState("");
  const [fEmp,setFEmp]=useState("");
  const [fApt,setFApt]=useState("");
  const [fClient,setFClient]=useState("");
  const [fPaid,setFPaid]=useState("all");
  const [editing,setEditing]=useState(null);
  const [viewing,setViewing]=useState(null);
  const filtered=appData.cleanings.filter(c=>{
    if(fDate&&c.date!==fDate) return false;
    if(fEmp&&!c.employeeName?.toLowerCase().includes(fEmp.toLowerCase())) return false;
    if(fApt&&!c.apartmentName?.toLowerCase().includes(fApt.toLowerCase())) return false;
    if(fClient&&!c.clientName?.toLowerCase().includes(fClient.toLowerCase())) return false;
    if(fPaid==="paid"&&!c.paid) return false;
    if(fPaid==="pending"&&c.paid) return false;
    return true;
  }).sort((a,b)=>b.date!==a.date?b.date?.localeCompare(a.date):b.createdAt-a.createdAt);
  const togglePaid=(id)=>{
    const found=appData.cleanings.find(c=>c.id===id);
    CLEANINGS_COL.doc(id).update({paid:!found.paid})
      .then(()=>showToast(found?.paid?"Marcado como pendiente":"Marcado como pagado ✅"))
      .catch(e=>{console.error(e);showToast("No se pudo actualizar","error");});
  };
  const del=(id)=>{
    if(!window.confirm("¿Eliminar este registro?"))return;
    CLEANINGS_COL.doc(id).delete()
      .then(()=>showToast("Registro eliminado","error"))
      .catch(e=>{console.error(e);showToast("No se pudo eliminar","error");});
  };
  const markDup=(c,keepId)=>CLEANINGS_COL.doc(c.id).update({duplicado:true,duplicadoDe:keepId||"",amountOriginal:c.amount||0,amount:0,notes:"DUPLICADO | "+(c.notes||"")});
  const markOne=(c)=>{
    if(!window.confirm(`¿Marcar como duplicado ${c.apartmentName} del ${fmtDate(c.date)} (${c.employeeName||"sin encargado"})?\n\nDeja de contar en los totales, pero no se borra y se puede restaurar.`))return;
    markDup(c).then(()=>showToast("Marcado como duplicado")).catch(e=>{console.error(e);showToast("No se pudo marcar","error");});
  };
  const autoDups=findDuplicates(appData.cleanings);
  const pairs=findPairs(appData.cleanings);
  const [showDupPanel,setShowDupPanel]=useState(false);
  const fixAll=()=>{
    const sum=autoDups.reduce((s,c)=>s+(c.amount||0),0);
    if(!window.confirm(`Se marcarán ${autoDups.length} registros repetidos (${fmtCOP(sum)}) como duplicados.\n\nNo se borran: dejan de contar en los totales y se pueden restaurar. ¿Continuar?`))return;
    const batch=db.batch();
    autoDups.forEach(c=>batch.update(CLEANINGS_COL.doc(c.id),{duplicado:true,duplicadoDe:c.keepId,amountOriginal:c.amount||0,amount:0,notes:"DUPLICADO | "+(c.notes||"")}));
    batch.commit().then(()=>showToast(`${autoDups.length} duplicados corregidos ✅`)).catch(e=>{console.error(e);showToast("No se pudo corregir","error");});
  };
  const restore=(c)=>{
    CLEANINGS_COL.doc(c.id).update({duplicado:false,amount:c.amountOriginal||0,notes:String(c.notes||"").replace(/^DUPLICADO \| /,"")})
      .then(()=>showToast("Registro restaurado ✅")).catch(e=>{console.error(e);showToast("No se pudo restaurar","error");});
  };
  const saveEdit=(form)=>{
    const {id,...rest}=form;
    CLEANINGS_COL.doc(id).update(rest)
      .then(()=>{setEditing(null);showToast("Registro actualizado ✅");})
      .catch(e=>{console.error(e);showToast("No se pudo actualizar","error");});
  };
  // ➕ Servicio agregado desde el admin: mismas reglas anti-duplicados que en el celular
  const [adding,setAdding]=useState(null);
  const nuevoServicio=()=>setAdding({date:todayStr(),employeeName:"",apartmentId:"",apartmentName:"",clientName:"",amount:0,notes:"",paid:false});
  const saveNew=(form)=>{
    const {id,...f}=form;
    const apt=appData.apartments.find(a=>a.id===f.apartmentId);
    if(!apt||!CLEANINGS_COL||!db){ showToast("Elige el apartamento","error"); return; }
    const same=appData.cleanings.filter(c=>c.date===f.date&&(c.apartmentId===apt.id||normTxt(c.apartmentName)===normTxt(apt.displayName)));
    if(same.some(c=>normTxt(c.employeeName)===normTxt(f.employeeName))){ window.alert(`${apt.displayName} ya está registrado por ${f.employeeName} el ${fmtDate(f.date)}.`); return; }
    if(same.length>0&&!window.confirm(`${apt.displayName} ya fue registrado el ${fmtDate(f.date)} por ${same.map(c=>c.employeeName||"otra persona").join(", ")}.\n\n¿Agregarlo de todas formas?`)) return;
    const ts=Date.now();
    const newC={...f,apartmentName:apt.displayName||"",clientName:f.clientName||apt.clientName||"",tipo:apt.tipo||f.tipo||"",
      time:f.startedAt?toHM(f.startedAt):new Date(ts).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"}),
      enCurso:false,createdAt:ts,creadoPorAdmin:true};
    const ref=CLEANINGS_COL.doc(`${f.date}_${apt.id}_${f.employeeName}`.replace(/[\/\s]+/g,"-"));
    db.runTransaction(async t=>{ const s=await t.get(ref); if(s.exists) throw new Error("DUPLICADO"); t.set(ref,newC); })
      .then(()=>{ setAdding(null); showToast(`➕ ${apt.displayName} agregado ✅`); })
      .catch(e=>{
        if(e&&e.message==="DUPLICADO"){ showToast("Ese servicio ya estaba registrado, no se duplicó","error"); return; }
        console.error(e); showToast("No se pudo agregar, revisa tu conexión","error");
      });
  };
  const total=filtered.reduce((s,c)=>s+(c.amount||0),0);
  const totalPaid=filtered.filter(c=>c.paid).reduce((s,c)=>s+(c.amount||0),0);
  return(
    <div>
      {editing&&<EditModal cleaning={editing} appData={appData} onSave={saveEdit} onClose={()=>setEditing(null)}/>}
      {adding&&<EditModal isNew cleaning={adding} appData={appData} onSave={saveNew} onClose={()=>setAdding(null)}/>}
      {viewing&&<FotosModal cleaning={viewing} onClose={()=>setViewing(null)}/>}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10,margin:"0 0 20px"}}>
        <h2 style={{margin:0,fontSize:22,fontWeight:800}}>Todos los registros</h2>
        <Btn onClick={nuevoServicio}>➕ Agregar servicio</Btn>
      </div>
      {(autoDups.length>0||pairs.length>0||(appData.duplicates||[]).length>0)&&(
        <Card style={{marginBottom:20,border:`1px solid ${autoDups.length>0?C.danger:C.border}`}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10}}>
            <div>
              <div style={{fontWeight:800,fontSize:14}}>⧉ Revisión de duplicados</div>
              <div style={{color:C.muted,fontSize:12,marginTop:4}}>
                {autoDups.length>0?<span style={{color:C.danger,fontWeight:700}}>{autoDups.length} repetidos ({fmtCOP(autoDups.reduce((s,c)=>s+(c.amount||0),0))}) · </span>:null}
                {pairs.length} apto/día con varias personas · {(appData.duplicates||[]).length} ya marcados
              </div>
            </div>
            <div style={{display:"flex",gap:8}}>
              {autoDups.length>0&&<Btn variant="danger" size="sm" onClick={fixAll}>Corregir {autoDups.length} repetidos</Btn>}
              <Btn variant="ghost" size="sm" onClick={()=>setShowDupPanel(!showDupPanel)}>{showDupPanel?"Ocultar":"Ver detalle"}</Btn>
            </div>
          </div>
          {showDupPanel&&(
            <div style={{marginTop:14,fontSize:13}}>
              {autoDups.length>0&&<div style={{marginBottom:12}}><Lbl>Repetidos (misma persona, mismo apto, mismo día)</Lbl>
                {autoDups.map(c=><div key={c.id} style={{display:"flex",justifyContent:"space-between",gap:8,padding:"6px 0",borderTop:`1px solid ${C.border}`}}><span>{fmtDate(c.date)} · {c.apartmentName} · {c.employeeName||"sin encargado"}</span><span style={{color:C.accent,fontWeight:700}}>{fmtCOP(c.amount)}</span></div>)}
              </div>}
              {pairs.length>0&&<div style={{marginBottom:12}}><Lbl>Varias personas en el mismo apto el mismo día — ¿pareja o doble registro?</Lbl>
                {pairs.map(v=><div key={v[0].id} style={{padding:"6px 0",borderTop:`1px solid ${C.border}`}}>
                  <div style={{fontWeight:700}}>{fmtDate(v[0].date)} · {v[0].apartmentName}</div>
                  {v.map(c=><div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,marginTop:4}}><span style={{color:C.muted}}>{c.employeeName||"sin encargado"} · {fmtCOP(c.amount)}{c.paid?" · pagado":""}</span>{!c.paid&&<Btn variant="ghost" size="sm" onClick={()=>markOne(c)}>Marcar duplicado</Btn>}</div>)}
                </div>)}
              </div>}
              {(appData.duplicates||[]).length>0&&<div><Lbl>Ya marcados como duplicado (no cuentan)</Lbl>
                {appData.duplicates.map(c=><div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,padding:"6px 0",borderTop:`1px solid ${C.border}`}}><span style={{color:C.muted}}>{fmtDate(c.date)} · {c.apartmentName} · {c.employeeName||"sin encargado"} · {fmtCOP(c.amountOriginal)}</span><Btn variant="ghost" size="sm" onClick={()=>restore(c)}>Restaurar</Btn></div>)}
              </div>}
            </div>
          )}
        </Card>
      )}
      <Card style={{marginBottom:20}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12}}>
          <div><Lbl>Fecha</Lbl><Inp type="date" value={fDate} onChange={setFDate}/></div>
          <div><Lbl>Encargado</Lbl><Inp value={fEmp} onChange={setFEmp} placeholder="Buscar..."/></div>
          <div><Lbl>Apartamento</Lbl><Inp value={fApt} onChange={setFApt} placeholder="Buscar..."/></div>
          <div><Lbl>Cliente</Lbl><Inp value={fClient} onChange={setFClient} placeholder="Buscar..."/></div>
          <div><Lbl>Estado</Lbl><Sel value={fPaid} onChange={setFPaid}><option value="all">Todos</option><option value="paid">Pagados</option><option value="pending">Pendientes</option></Sel></div>
        </div>
        <div style={{marginTop:12,display:"flex",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <span style={{color:C.muted,fontSize:13}}>{filtered.length} registro{filtered.length!==1?"s":""}</span>
          <div style={{display:"flex",gap:16,flexWrap:"wrap"}}>
            <span style={{color:C.muted,fontSize:13}}>Total: <strong style={{color:C.text}}>{fmtCOP(total)}</strong></span>
            <span style={{color:C.muted,fontSize:13}}>Cobrado: <strong style={{color:C.success}}>{fmtCOP(totalPaid)}</strong></span>
            <span style={{color:C.muted,fontSize:13}}>Pendiente: <strong style={{color:C.danger}}>{fmtCOP(total-totalPaid)}</strong></span>
          </div>
        </div>
      </Card>
      <Card style={{padding:0,overflow:"hidden"}}>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{background:C.surface}}>{["Fecha","Encargado","Apartamento","Cliente","Notas","Valor","Estado",""].map((h,i)=><th key={i} style={{textAlign:"left",padding:"12px 16px",color:C.muted,fontWeight:700,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
            <tbody>
              {filtered.length===0?<tr><td colSpan={8} style={{textAlign:"center",padding:40,color:C.muted}}>Sin registros</td></tr>
              :filtered.map(c=>(
                <tr key={c.id} style={{borderTop:`1px solid ${C.border}`}}>
                  <td style={{padding:"12px 16px",color:C.muted,whiteSpace:"nowrap"}}>{fmtDate(c.date)}</td>
                  <td style={{padding:"12px 16px",fontWeight:700}}>{c.employeeName}</td>
                  <td style={{padding:"12px 16px"}}>{c.apartmentName}</td>
                  <td style={{padding:"12px 16px",color:C.info,fontWeight:600}}>{c.clientName||"—"}</td>
                  <td style={{padding:"12px 16px",color:C.muted,maxWidth:170,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.enCurso?<span style={{color:C.accent,fontWeight:700}}>⏱ en curso · </span>:durMin(c)!=null?<span style={{color:C.info,fontWeight:700}}>⏱ {fmtMin(durMin(c))} · </span>:null}{c.notes||"—"}</td>
                  <td style={{padding:"12px 16px",color:C.accent,fontWeight:800,whiteSpace:"nowrap"}}>{fmtCOP(c.amount)}</td>
                  <td style={{padding:"12px 16px"}}><Badge paid={c.paid}/></td>
                  <td style={{padding:"12px 16px"}}><div style={{display:"flex",gap:6}}>
                    {(Object.keys(c.fotos||{}).length+Object.keys(c.videos||{}).length)>0&&<Btn variant="ghost" size="sm" onClick={()=>setViewing(c)}>{Object.keys(c.videos||{}).length?`🎥 ${Object.keys(c.videos).length} `:""}📷 {Object.keys(c.fotos||{}).length}</Btn>}
                    <Btn variant="info" size="sm" onClick={()=>setEditing(c)}>✏️</Btn>
                    <Btn variant={c.paid?"ghost":"success"} size="sm" onClick={()=>togglePaid(c.id)}>{c.paid?"↩":"✓"}</Btn>
                    <Btn variant="danger" size="sm" onClick={()=>del(c.id)}>✕</Btn>
                  </div></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>
    </div>
  );
}

function ClientsTab({appData,update,showToast}){
  const [search,setSearch]=useState("");
  const [filterStatus,setFilterStatus]=useState("all");
  const [expanded,setExpanded]=useState(null);
  const grouped={};
  appData.cleanings.forEach(c=>{
    const key=c.clientName||"Sin cliente";
    if(!grouped[key]) grouped[key]={clientName:key,apartments:new Set(),cleanings:[],total:0,paid:0,owed:0};
    grouped[key].cleanings.push(c);
    grouped[key].apartments.add(c.apartmentName);
    grouped[key].total+=c.amount||0;
    if(c.paid) grouped[key].paid+=c.amount||0;
    else grouped[key].owed+=c.amount||0;
  });
  const rows=Object.entries(grouped).filter(([k])=>k.toLowerCase().includes(search.toLowerCase())).filter(([,g])=>{if(filterStatus==="owed") return g.owed>0;if(filterStatus==="paid") return g.owed===0;return true;}).sort((a,b)=>b[1].owed-a[1].owed);
  const gTotal=rows.reduce((s,[,g])=>s+g.total,0);
  const gPaid=rows.reduce((s,[,g])=>s+g.paid,0);
  const gOwed=rows.reduce((s,[,g])=>s+g.owed,0);
  const markAllPaid=(key)=>{
    const g=grouped[key];const ids=g.cleanings.filter(c=>!c.paid).map(c=>c.id);
    if(ids.length===0)return;
    const batch=db.batch();
    ids.forEach(id=>batch.update(CLEANINGS_COL.doc(id),{paid:true}));
    batch.commit()
      .then(()=>showToast(`Todo pagado para ${key} ✅`))
      .catch(e=>{console.error(e);showToast("No se pudo actualizar","error");});
  };
  const toggleOne=(id)=>{
    const found=appData.cleanings.find(c=>c.id===id);
    CLEANINGS_COL.doc(id).update({paid:!found.paid}).catch(e=>console.error(e));
  };
  return(
    <div>
      <h2 style={{margin:"0 0 20px",fontSize:22,fontWeight:800}}>Estado por cliente</h2>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16,marginBottom:24}}>
        {[{label:"Total facturado",color:C.text,value:fmtCOP(gTotal)},{label:"Total cobrado",color:C.success,value:fmtCOP(gPaid)},{label:"Por cobrar",color:C.danger,value:fmtCOP(gOwed)}].map(s=>(
          <Card key={s.label} style={{textAlign:"center"}}><div style={{fontSize:20,fontWeight:800,color:s.color}}>{s.value}</div><div style={{fontSize:12,color:C.muted,marginTop:4}}>{s.label}</div></Card>
        ))}
      </div>
      <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        <div style={{flex:1,minWidth:200}}><Inp value={search} onChange={setSearch} placeholder="🔍 Buscar cliente..."/></div>
        <Sel value={filterStatus} onChange={setFilterStatus} style={{width:"auto",minWidth:180}}><option value="all">Todos</option><option value="owed">Con deuda</option><option value="paid">Sin deuda</option></Sel>
      </div>
      {rows.length===0?<Card style={{textAlign:"center",color:C.muted,padding:40}}>No hay datos</Card>
      :rows.map(([key,g])=>{
        const isExp=expanded===key;
        return(
          <Card key={key} style={{marginBottom:12}}>
            <div onClick={()=>setExpanded(isExp?null:key)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",flexWrap:"wrap",gap:12}}>
              <div>
                <div style={{fontWeight:800,fontSize:16}}>{key}</div>
                <div style={{color:C.muted,fontSize:12,marginTop:2}}>{g.cleanings.length} limpieza{g.cleanings.length!==1?"s":""} · {[...g.apartments].join(", ")}</div>
              </div>
              <div style={{display:"flex",gap:20,alignItems:"center",flexWrap:"wrap"}}>
                <div style={{textAlign:"right"}}><div style={{fontSize:11,color:C.muted}}>Cobrado</div><div style={{fontWeight:800,color:C.success,fontSize:15}}>{fmtCOP(g.paid)}</div></div>
                <div style={{textAlign:"right"}}><div style={{fontSize:11,color:C.muted}}>Por cobrar</div><div style={{fontWeight:800,color:g.owed>0?C.danger:C.muted,fontSize:15}}>{fmtCOP(g.owed)}</div></div>
                {g.owed>0&&<Btn variant="success" size="sm" onClick={e=>{e.stopPropagation();markAllPaid(key);}}>✓ Pagar todo</Btn>}
                <span style={{color:C.muted}}>{isExp?"▲":"▼"}</span>
              </div>
            </div>
            {isExp&&(
              <div style={{marginTop:16,borderTop:`1px solid ${C.border}`,paddingTop:16}}>
                {g.cleanings.sort((a,b)=>b.date?.localeCompare(a.date)).map(c=>(
                  <div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 0",borderBottom:`1px solid ${C.border}`}}>
                    <div>
                      <div style={{fontSize:13,fontWeight:600}}>{fmtDate(c.date)} — <span style={{color:C.muted,fontWeight:400}}>{c.apartmentName}</span></div>
                      <div style={{fontSize:11,color:C.muted,marginTop:2}}>{c.employeeName}{c.notes?` · ${c.notes}`:""}</div>
                    </div>
                    <div style={{display:"flex",gap:12,alignItems:"center"}}>
                      <span style={{color:C.accent,fontWeight:800,fontSize:13}}>{fmtCOP(c.amount)}</span>
                      <button onClick={()=>toggleOne(c.id)} style={{padding:"4px 12px",border:"none",borderRadius:20,cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:"inherit",background:c.paid?"#14532d":"#450a0a",color:c.paid?C.success:C.danger}}>{c.paid?"✓ Pagado":"Pendiente"}</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </Card>
        );
      })}
    </div>
  );
}

// 💹 En vivo: el costo de cada aseadora corre segundo a segundo desde su primera entrada del día
//    (incluye el tiempo muerto); el ingreso entra solo cuando se cierra un apartamento.
function EnVivoTab({appData}){
  const k=getCosts(appData.settings);
  const [modo,setModo]=useState("aiu");
  const [t,setT]=useState(Date.now());
  useEffect(()=>{ const i=setInterval(()=>setT(Date.now()),1000); return ()=>clearInterval(i); },[]);
  const hoy=todayStr();
  const porSeg=(Number(k.costoHoraPagada)||0)/3600;
  const [fh,fm]=String(k.finTurno||"16:00").split(":").map(Number);
  const finD=new Date(); finD.setHours(fh||16,fm||0,0,0); const finTs=finD.getTime();
  const aptOf=(c)=>appData.apartments.find(a=>a.id===c.apartmentId)||appData.apartments.find(a=>normTxt(a.displayName)===normTxt(c.apartmentName))||{tipo:c.tipo};
  const ingresoDe=(c)=>{ const a=aptOf(c); const e=econ(c.amount||a.price||0,0,0,k); return modo==="aiu"?e.aiu:e.hoy; };
  const bldOf=(c)=>aptOf(c).building||c.building||"";
  const cs=appData.cleanings.filter(c=>c.date===hoy&&c.startedAt);
  // El viaje de ropa se cobra una vez por edificio en el día: al cerrar el primer apartamento de ese edificio
  const primerCierre={};
  cs.filter(c=>c.finishedAt&&!c.enCurso).sort((a,b)=>a.finishedAt-b.finishedAt).forEach(c=>{const b=bldOf(c);if(!primerCierre[b])primerCierre[b]=c.id;});
  const transpDe=(c)=>primerCierre[bldOf(c)]===c.id?viajeDe(k,bldOf(c)):0;
  const variableDe=(c)=>k.insumos+k.admin+juegosOf(aptOf(c))*k.lenceriaJuego+transpDe(c);
  const emps=[...new Set(cs.map(c=>c.employeeName||"—"))];
  // Por aseadora
  const filas=emps.map(emp=>{
    const list=cs.filter(c=>(c.employeeName||"—")===emp).sort((a,b)=>a.startedAt-b.startedAt);
    const ini=list[0].startedAt;
    const activo=list.find(c=>c.enCurso);
    const lastFin=Math.max(0,...list.filter(c=>c.finishedAt).map(c=>c.finishedAt));
    const hasta=Math.min(t,Math.max(finTs,lastFin,activo?t:0));
    const segs=Math.max(0,(hasta-ini)/1000);
    const costoMO=segs*porSeg;
    const cerrados=list.filter(c=>c.finishedAt&&!c.enCurso);
    const ingreso=cerrados.reduce((s,c)=>s+ingresoDe(c),0);
    const variables=cerrados.reduce((s,c)=>s+variableDe(c),0);
    const enApto=list.reduce((s,c)=>s+(((c.finishedAt||(c.enCurso?t:c.startedAt))-c.startedAt)/1000),0);
    const muerto=Math.max(0,segs-enApto);
    const corriendo=t<hasta+1500;
    let estado;
    if(activo) estado={txt:`En ${activo.apartmentName} · ${fmtMin((t-activo.startedAt)/60000)}`,color:C.accent};
    else if(corriendo) estado={txt:`Tiempo muerto desde ${toHM(lastFin)}`,color:C.danger};
    else estado={txt:"Turno terminado",color:C.muted};
    return {emp,ini,activo,costoMO,ingreso,variables,resultado:ingreso-variables-costoMO,cerrados:cerrados.length,muerto,enApto,corriendo,estado};
  });
  const transpHoy=Object.keys(primerCierre).reduce((s,b)=>s+viajeDe(k,b),0);
  const tot=filas.reduce((a,f)=>({mo:a.mo+f.costoMO,ing:a.ing+f.ingreso,vari:a.vari+f.variables,res:a.res+f.resultado,corriendo:a.corriendo+(f.corriendo?1:0)}),{mo:0,ing:0,vari:0,res:0,corriendo:0});
  // Apartamento en curso: margen en vivo y hora límite para no perder
  const activos=cs.filter(c=>c.enCurso).map(c=>{
    const b=bldOf(c), transp=primerCierre[b]?0:viajeDe(k,b);
    const ing=ingresoDe(c), vari=variableDe(c)+transp, mo=((t-c.startedAt)/1000)*porSeg;
    const limite=porSeg>0?c.startedAt+((ing-vari)/porSeg)*1000:null;
    return {c,ing,vari,transp,mo,margen:ing-vari-mo,limite};
  });
  // Pendientes de la agenda: ingreso que falta por cerrar
  const pend=(appData.agenda||[]).filter(a=>a.date===hoy&&!cs.some(c=>c.apartmentId===a.apartmentId));
  const ingresoPend=pend.reduce((s,a)=>{const ap=appData.apartments.find(x=>x.id===a.apartmentId)||{};const e=econ(ap.price||0,0,0,k);return s+(modo==="aiu"?e.aiu:e.hoy);},0);
  // Gráfica: costo acumulado vs ingreso acumulado durante el día
  const t0=cs.length?Math.min(...cs.map(c=>c.startedAt)):null;
  const t1=t0?Math.max(t,finTs):null;
  const costoA=(x)=>filas.reduce((s,f)=>{const list=cs.filter(c=>(c.employeeName||"—")===f.emp);const lastFin=Math.max(0,...list.filter(c=>c.finishedAt).map(c=>c.finishedAt));const hasta=Math.min(x,Math.max(finTs,lastFin,list.some(c=>c.enCurso)?t:0));const mo=Math.max(0,(hasta-f.ini)/1000)*porSeg;const vari=list.filter(c=>c.finishedAt&&c.finishedAt<=x).reduce((a,c)=>a+variableDe(c),0);return s+mo+vari;},0);
  const ingA=(x)=>cs.filter(c=>c.finishedAt&&!c.enCurso&&c.finishedAt<=x).reduce((s,c)=>s+ingresoDe(c),0);
  const money=(v,big)=><span style={{color:v>=0?C.success:C.danger,fontWeight:800,fontVariantNumeric:"tabular-nums"}}>{v<0?"–":""}{fmtCOP(Math.abs(Math.round(v)))}</span>;
  const kpi=(label,value,sub)=>(<Card style={{padding:16}}><div style={{fontSize:12,color:C.muted}}>{label}</div><div style={{fontSize:24,fontWeight:800,marginTop:4,fontVariantNumeric:"tabular-nums"}}>{value}</div>{sub&&<div style={{fontSize:11,color:C.muted,marginTop:4}}>{sub}</div>}</Card>);
  const th={textAlign:"left",padding:"10px 12px",color:C.muted,fontWeight:700,whiteSpace:"nowrap",fontSize:12};
  const td={padding:"10px 12px",whiteSpace:"nowrap",fontVariantNumeric:"tabular-nums"};
  let grafica=null;
  if(t0&&t1>t0){
    const Wd=760,Hd=260,L=70,R=20,T=40,B=36;
    const pts=[];const paso=Math.max(60000,Math.round((t1-t0)/120));
    for(let x=t0;x<=t1;x+=paso) pts.push(x);
    cs.forEach(c=>{if(c.finishedAt){pts.push(c.finishedAt-1);pts.push(c.finishedAt);}});
    pts.push(t);pts.sort((a,b)=>a-b);
    const pc=pts.filter(x=>x<=t).map(x=>[x,costoA(x)]), pi=pts.filter(x=>x<=t).map(x=>[x,ingA(x)]);
    const maxY=Math.max(1,...pc.map(p=>p[1]),...pi.map(p=>p[1]),ingA(t)+ingresoPend*0);
    const X=x=>L+(x-t0)/(t1-t0)*(Wd-L-R), Y=y=>Hd-B-(y/maxY)*(Hd-T-B);
    const path=a=>a.map((p,i)=>`${i?"L":"M"}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(" ");
    const horas=[];const h0=new Date(t0);h0.setMinutes(0,0,0);for(let h=h0.getTime()+3600000;h<t1;h+=3600000)horas.push(h);
    grafica=(
      <svg viewBox={`0 0 ${Wd} ${Hd}`} style={{width:"100%",display:"block"}} role="img" aria-label="Costo acumulado contra ingreso acumulado del día">
        <text x={L} y={22} fontSize="13" fontWeight="700" fill={C.text}>Costo acumulado vs ingreso cerrado, hoy</text>
        {horas.map(h=><g key={h}><line x1={X(h)} x2={X(h)} y1={T} y2={Hd-B} stroke={C.border}/><text x={X(h)} y={Hd-B+18} fontSize="11" textAnchor="middle" fill={C.muted}>{toHM(h)}</text></g>)}
        {[0,0.5,1].map(f=><text key={f} x={L-8} y={Y(maxY*f)+4} fontSize="11" textAnchor="end" fill={C.muted}>{fmtCOP(Math.round(maxY*f))}</text>)}
        <line x1={L} x2={Wd-R} y1={Hd-B} y2={Hd-B} stroke={C.muted}/>
        {t<=t1&&<line x1={X(t)} x2={X(t)} y1={T} y2={Hd-B} stroke={C.accent} strokeDasharray="4 4"/>}
        <path d={path(pc)} fill="none" stroke={C.danger} strokeWidth="2.5"/>
        <path d={path(pi)} fill="none" stroke={C.success} strokeWidth="2.5"/>
        <text x={Math.min(X(t)+6,Wd-R-80)} y={Y(costoA(t))-6} fontSize="12" fontWeight="700" fill={C.danger}>Costo</text>
        <text x={Math.min(X(t)+6,Wd-R-80)} y={Y(ingA(t))+16} fontSize="12" fontWeight="700" fill={C.success}>Ingreso</text>
      </svg>);
  }
  return(
    <div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",flexWrap:"wrap",gap:12,marginBottom:18}}>
        <div>
          <h2 style={{margin:"0 0 6px",fontSize:22,fontWeight:800}}>En vivo · {fmtDate(hoy)} <span style={{fontSize:14,color:C.muted,fontWeight:600}}>{toHM(t)}:{pad2(new Date(t).getSeconds())}</span></h2>
          <div style={{color:C.muted,fontSize:13}}>Cada aseadora cuesta ${porSeg.toFixed(1).replace(".",",")} por segundo ({fmtCOP(k.costoHoraPagada)} la hora) desde su primera entrada hasta las {k.finTurno}. El ingreso entra al cerrar cada apartamento, menos insumos, administración, lencería y el viaje de ropa a la lavandería (uno por edificio en el día).</div>
        </div>
        <div style={{display:"flex",background:C.surface,borderRadius:8,padding:4}}>
          {[["aiu","Facturando con AIU"],["hoy","IVA sobre todo"]].map(([v,l])=><button key={v} onClick={()=>setModo(v)} style={{padding:"8px 12px",border:"none",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"inherit",background:modo===v?C.accent:"transparent",color:modo===v?"#0b0f18":C.muted}}>{l}</button>)}
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:12,marginBottom:20}}>
        {kpi("Costo del día (corriendo)",<span style={{color:C.danger}}>{fmtCOP(Math.round(tot.mo+tot.vari))}</span>,`${tot.corriendo} aseadora${tot.corriendo===1?"":"s"} en turno · ${fmtCOP(Math.round(porSeg*tot.corriendo*60))} por minuto`)}
        {kpi("Ingreso cerrado",<span style={{color:C.success}}>{fmtCOP(Math.round(tot.ing))}</span>,`${(n=>`${n} apartamento${n===1?"":"s"} cerrado${n===1?"":"s"}`)(filas.reduce((s,f)=>s+f.cerrados,0))}${transpHoy?` · transporte ${fmtCOP(Math.round(transpHoy))}`:""}`)}
        {kpi("Resultado del día",money(tot.res),tot.res>=0?"el día va ganando":"todavía no cubre el costo")}
        {kpi("Por cerrar",fmtCOP(Math.round(activos.reduce((s,a)=>s+a.ing,0)+ingresoPend)),`${activos.length} en curso · ${pend.length} pendientes en agenda`)}
      </div>
      {grafica&&<Card style={{marginBottom:20}}>{grafica}</Card>}
      {activos.length>0&&<>
        <h3 style={{fontSize:16,fontWeight:800,margin:"0 0 10px"}}>Apartamentos en curso</h3>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12,marginBottom:20}}>
          {activos.map(a=>(
            <Card key={a.c.id} style={{padding:16,border:`1px solid ${a.margen>=0?C.border:C.danger}`}}>
              <div style={{display:"flex",justifyContent:"space-between",gap:8}}><div style={{fontWeight:800,fontSize:16}}>{a.c.apartmentName}</div><div style={{color:C.accent,fontWeight:800}}>{fmtMin((t-a.c.startedAt)/60000)}</div></div>
              <div style={{fontSize:12,color:C.muted,margin:"2px 0 10px"}}>{a.c.employeeName} · entró {toHM(a.c.startedAt)}</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr auto",gap:"4px 10px",fontSize:13}}>
                <span style={{color:C.muted}}>Ingreso al cerrar</span><span>{fmtCOP(Math.round(a.ing))}</span>
                <span style={{color:C.muted}}>Insumos, admin y lencería</span><span>–{fmtCOP(Math.round(a.vari-a.transp))}</span>
                <span style={{color:C.muted}}>Transporte de ropa{!a.transp&&viajeDe(k,bldOf(a.c))?" (ya pagado hoy)":""}</span><span>{a.transp?`–${fmtCOP(Math.round(a.transp))}`:"$0"}</span>
                <span style={{color:C.muted}}>Mano de obra hasta ahora</span><span style={{color:C.danger}}>–{fmtCOP(Math.round(a.mo))}</span>
                <span style={{fontWeight:800}}>Margen si cierra ya</span><span>{money(a.margen)}</span>
              </div>
              <div style={{marginTop:10,fontSize:12,color:a.limite&&t<a.limite?C.success:C.danger,fontWeight:700}}>{a.limite?(t<a.limite?`Deja plata si cierra antes de las ${toHM(a.limite)}`:"Ya pasó la hora límite: este apartamento va en pérdida"):""}</div>
            </Card>))}
        </div>
      </>}
      <h3 style={{fontSize:16,fontWeight:800,margin:"0 0 10px"}}>Por aseadora</h3>
      <Card style={{padding:0,overflow:"hidden"}}><div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:C.surface}}>{["Aseadora","Ahora","Entró","En apartamentos","Tiempo muerto","Costo","Ingreso cerrado","Resultado"].map(h=><th key={h} style={th}>{h}</th>)}</tr></thead>
          <tbody>{filas.length===0?<tr><td colSpan={8} style={{...td,textAlign:"center",color:C.muted,padding:30}}>Nadie ha empezado hoy. El costo empieza a correr con la primera entrada.</td></tr>
            :filas.map(f=>(
            <tr key={f.emp} style={{borderTop:`1px solid ${C.border}`}}>
              <td style={{...td,fontWeight:700}}>{f.emp}</td>
              <td style={{...td,color:f.estado.color,fontWeight:700}}>{f.estado.txt}</td>
              <td style={td}>{toHM(f.ini)}</td>
              <td style={td}>{fmtMin(f.enApto/60)}</td>
              <td style={{...td,color:f.muerto>60?C.danger:C.muted}}>{fmtMin(f.muerto/60)}</td>
              <td style={{...td,color:C.danger}}>{fmtCOP(Math.round(f.costoMO+f.variables))}</td>
              <td style={{...td,color:C.success}}>{fmtCOP(Math.round(f.ingreso))} <span style={{color:C.muted}}>({f.cerrados})</span></td>
              <td style={td}>{money(f.resultado)}</td>
            </tr>))}</tbody>
        </table>
      </div></Card>
    </div>
  );
}

// 📅 Agenda: qué apartamentos se limpian cada día, a quién se asignan y para qué hora
function AgendaTab({appData,showToast}){
  const [fecha,setFecha]=useState(todayStr());
  const [sel,setSel]=useState({});
  const [q,setQ]=useState("");
  const items=(appData.agenda||[]).filter(a=>a.date===fecha).sort((a,b)=>(a.checkIn||"99").localeCompare(b.checkIn||"99")||(a.apartmentName||"").localeCompare(b.apartmentName||""));
  const enAgenda=new Set(items.map(i=>i.apartmentId));
  const sorted=[...appData.apartments].sort((a,b)=>a.building.localeCompare(b.building)||String(a.aptNumber).localeCompare(String(b.aptNumber),undefined,{numeric:true}));
  const visibles=sorted.filter(a=>!enAgenda.has(a.id)&&(!q||normTxt(a.displayName+" "+(a.clientName||"")).includes(normTxt(q))));
  const grupos=[...new Set(visibles.map(a=>a.building))];
  const nSel=Object.values(sel).filter(Boolean).length;
  const agregar=()=>{
    const ids=Object.keys(sel).filter(k=>sel[k]); if(!ids.length) return;
    const batch=db.batch();
    ids.forEach(id=>{const a=appData.apartments.find(x=>x.id===id); if(!a) return;
      batch.set(AGENDA_COL.doc(`${fecha}_${id}`),{date:fecha,apartmentId:id,apartmentName:a.displayName,building:a.building||"",clientName:a.clientName||"",asignadaA:"",checkIn:"15:00",nota:"",createdAt:Date.now()},{merge:true});});
    batch.commit().then(()=>{setSel({});showToast(`${ids.length} apartamento${ids.length>1?"s":""} agregado${ids.length>1?"s":""} a la agenda ✅`);}).catch(e=>{console.error(e);showToast("No se pudo agregar","error");});
  };
  const upd=(id,field,val)=>AGENDA_COL.doc(id).update({[field]:val}).catch(e=>{console.error(e);showToast("No se pudo guardar","error");});
  const quitar=(it)=>{ if(!window.confirm(`¿Quitar ${it.apartmentName} de la agenda del ${fmtDate(fecha)}?`)) return; AGENDA_COL.doc(it.id).delete().catch(e=>{console.error(e);showToast("No se pudo quitar","error");}); };
  const estado=(it)=>{
    const cs=appData.cleanings.filter(c=>c.date===fecha&&(c.apartmentId===it.apartmentId||normTxt(c.apartmentName)===normTxt(it.apartmentName)));
    const run=cs.find(c=>c.enCurso); if(run) return <span style={{color:C.accent,fontWeight:700}}>⏱ En curso · {run.employeeName} desde {toHM(run.startedAt)}</span>;
    if(cs.length){const c=cs[0];const d=durMin(c);return <span style={{color:C.success,fontWeight:700}}>✓ Hecho · {c.employeeName}{d!=null?` · ${fmtMin(d)}`:""}</span>;}
    return <span style={{color:C.muted}}>Pendiente</span>;
  };
  const sm={padding:"6px 8px",background:"#0b0f18",border:`1px solid ${C.border}`,borderRadius:6,color:C.text,fontSize:12,fontFamily:"inherit",outline:"none"};
  const manana=(()=>{const d=new Date();d.setDate(d.getDate()+1);return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;})();
  const hechos=items.filter(it=>appData.cleanings.some(c=>c.date===fecha&&!c.enCurso&&(c.apartmentId===it.apartmentId))).length;
  return(
    <div>
      <h2 style={{margin:"0 0 6px",fontSize:22,fontWeight:800}}>Agenda de limpiezas</h2>
      <div style={{color:C.muted,fontSize:13,marginBottom:18}}>{ASIGNAR_AGENDA?"Lo que pongas aquí es la lista que ve cada aseadora en su celular. Sin asignar = la ven todas.":"Lo que pongas aquí lo ven todas las aseadoras en su celular. Cada una elige el apartamento que va a hacer y, en cuanto lo empieza, a las demás les aparece como tomado."}</div>
      <Card style={{marginBottom:16,display:"flex",gap:12,alignItems:"flex-end",flexWrap:"wrap"}}>
        <div style={{minWidth:180}}><Lbl>Fecha</Lbl><Inp type="date" value={fecha} onChange={setFecha}/></div>
        <Btn variant={fecha===todayStr()?"primary":"ghost"} onClick={()=>setFecha(todayStr())}>Hoy</Btn>
        <Btn variant={fecha===manana?"primary":"ghost"} onClick={()=>setFecha(manana)}>Mañana</Btn>
        <div style={{marginLeft:"auto",color:C.muted,fontSize:13}}>{items.length} apartamentos · {hechos} hechos</div>
      </Card>
      <Card style={{padding:0,overflow:"hidden",marginBottom:20}}><div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:C.surface}}>{["Apartamento","Cliente","Check-in",...(ASIGNAR_AGENDA?["Asignada a"]:[]),"Nota para la aseadora","Estado",""].map(h=><th key={h} style={{textAlign:"left",padding:"10px 12px",color:C.muted,fontWeight:700,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
          <tbody>
            {items.length===0?<tr><td colSpan={ASIGNAR_AGENDA?7:6} style={{textAlign:"center",padding:30,color:C.muted}}>No hay apartamentos en la agenda de este día. Agrégalos abajo.</td></tr>
            :items.map(it=>(
              <tr key={it.id} style={{borderTop:`1px solid ${C.border}`}}>
                <td style={{padding:"10px 12px",fontWeight:700,whiteSpace:"nowrap"}}>{it.apartmentName}</td>
                <td style={{padding:"10px 12px",color:C.info}}>{it.clientName||"—"}</td>
                <td style={{padding:"10px 12px"}}><input type="time" defaultValue={it.checkIn||""} onBlur={e=>e.target.value!==(it.checkIn||"")&&upd(it.id,"checkIn",e.target.value)} style={sm}/></td>
                {ASIGNAR_AGENDA&&<td style={{padding:"10px 12px"}}><select value={it.asignadaA||""} onChange={e=>upd(it.id,"asignadaA",e.target.value)} style={sm}><option value="">Sin asignar</option>{appData.employees.map(e=><option key={e} value={e}>{e}</option>)}</select></td>}
                <td style={{padding:"10px 12px"}}><input defaultValue={it.nota||""} placeholder="Ej: llave en portería" onBlur={e=>e.target.value!==(it.nota||"")&&upd(it.id,"nota",e.target.value)} style={{...sm,width:200}}/></td>
                <td style={{padding:"10px 12px",whiteSpace:"nowrap"}}>{estado(it)}</td>
                <td style={{padding:"10px 12px",textAlign:"right"}}><Btn variant="ghost" size="sm" onClick={()=>quitar(it)}>Quitar</Btn></td>
              </tr>))}
          </tbody>
        </table>
      </div></Card>
      <Card>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexWrap:"wrap",marginBottom:14}}>
          <h3 style={{margin:0,fontSize:15,fontWeight:700}}>Agregar apartamentos al {fmtDate(fecha)}</h3>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            <Inp value={q} onChange={setQ} placeholder="🔍 Buscar..." style={{width:200}}/>
            <Btn onClick={agregar} disabled={!nSel}>＋ Agregar {nSel||""}</Btn>
          </div>
        </div>
        {grupos.map(b=>(
          <div key={b} style={{marginBottom:14}}>
            <div style={{fontSize:12,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:"0.05em",marginBottom:8}}>📍 {b}</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
              {visibles.filter(a=>a.building===b).map(a=>{const on=!!sel[a.id];return(
                <button key={a.id} onClick={()=>setSel(p=>({...p,[a.id]:!p[a.id]}))} style={{padding:"8px 12px",borderRadius:20,cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:700,border:`1px solid ${on?C.accent:C.border}`,background:on?C.accent:"transparent",color:on?"#0b0f18":C.text}}>{on?"✓ ":""}{a.aptNumber||a.displayName}{a.clientName?<span style={{fontWeight:400,opacity:0.7}}> · {a.clientName}</span>:null}</button>);})}
            </div>
          </div>
        ))}
        {grupos.length===0&&<div style={{color:C.muted,fontSize:13}}>Todos los apartamentos ya están en la agenda de este día.</div>}
      </Card>
    </div>
  );
}

// 🧺 Lencería: qué sale sucio hacia la lavandería, qué entra limpio y qué se daña
function LenceriaTab({appData}){
  const k=getCosts(appData.settings);
  const costoKg=k.lenceriaJuego/2.5; // un juego de lencería pesa unos 2,5 kg
  const clients=[...new Set(appData.apartments.map(a=>a.clientName).filter(Boolean))].sort();
  const [fClient,setFClient]=useState("");
  const [desde,setDesde]=useState(daysAgoStr(14));
  const [hasta,setHasta]=useState(todayStr());
  const conLen=appData.cleanings.filter(c=>c.lenceria&&c.date>=desde&&c.date<=hasta&&(!fClient||c.clientName===fClient));
  const sum=(list,g)=>{const o={};LENCERIA_ITEMS.forEach(([key])=>{o[key]=list.reduce((s,c)=>s+(Number(((c.lenceria||{})[g]||{})[key])||0),0);});return o;};
  const sale=sum(conLen,"sale"), entra=sum(conLen,"entra"), danada=sum(conLen,"danada");
  const kgSale=kgDe(sale);
  const porApto={};
  conLen.forEach(c=>{const a=porApto[c.apartmentName]||(porApto[c.apartmentName]={apt:c.apartmentName,cliente:c.clientName,n:0,list:[]});a.n++;a.list.push(c);});
  const aptRows=Object.values(porApto).map(a=>({...a,sale:sum(a.list,"sale"),entra:sum(a.list,"entra"),danada:sum(a.list,"danada")})).sort((x,y)=>kgDe(y.sale)-kgDe(x.sale));
  const porDia={};
  conLen.forEach(c=>{(porDia[c.date]=porDia[c.date]||[]).push(c);});
  const diaRows=Object.entries(porDia).sort((a,b)=>b[0].localeCompare(a[0])).map(([d,list])=>({d,n:list.length,sale:sum(list,"sale")}));
  const totalPiezas=(o)=>LENCERIA_ITEMS.reduce((s,[key])=>s+(o[key]||0),0);
  const sinConteo=appData.cleanings.filter(c=>c.startedAt&&!c.enCurso&&!(c.lenceria&&c.lenceria.ok)&&c.date>=desde&&c.date<=hasta&&(!fClient||c.clientName===fClient)).length;
  const th={textAlign:"left",padding:"10px 12px",color:C.muted,fontWeight:700,whiteSpace:"nowrap",fontSize:12};
  const td={padding:"10px 12px",whiteSpace:"nowrap"};
  const kpi=(label,value,sub,color)=>(<Card style={{padding:16}}><div style={{fontSize:12,color:C.muted}}>{label}</div><div style={{fontSize:20,fontWeight:800,color:color||C.text,marginTop:4}}>{value}</div>{sub&&<div style={{fontSize:11,color:C.muted,marginTop:4}}>{sub}</div>}</Card>);
  return(
    <div>
      <h2 style={{margin:"0 0 6px",fontSize:22,fontWeight:800}}>Lencería</h2>
      <div style={{color:C.muted,fontSize:13,marginBottom:18}}>Lo que las aseadoras cuentan en cada limpieza: lo que sale sucio a la lavandería, lo que entra limpio y lo que sale manchado o dañado.</div>
      <Card style={{marginBottom:16}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12}}>
          <div><Lbl>Cliente</Lbl><Sel value={fClient} onChange={setFClient}><option value="">Todos</option>{clients.map(c=><option key={c} value={c}>{c}</option>)}</Sel></div>
          <div><Lbl>Desde</Lbl><Inp type="date" value={desde} onChange={setDesde}/></div>
          <div><Lbl>Hasta</Lbl><Inp type="date" value={hasta} onChange={setHasta}/></div>
        </div>
      </Card>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:12,marginBottom:20}}>
        {kpi("Limpiezas con conteo",String(conLen.length),sinConteo?`${sinConteo} terminadas sin conteo`:"todas con conteo",sinConteo?C.danger:C.text)}
        {kpi("Piezas a lavandería",String(totalPiezas(sale)),`${totalPiezas(entra)} piezas limpias repuestas`)}
        {kpi("Kilos aproximados",`${kgSale.toFixed(1)} kg`,`~${Math.ceil(kgSale/8)} cargas de 8 kg`)}
        {kpi("Costo estimado de lavado",fmtCOP(Math.round(kgSale*costoKg)),`a ${fmtCOP(Math.round(costoKg))} por kg`,C.accent)}
        {kpi("Manchadas o dañadas",String(totalPiezas(danada)),"piezas a revisar o reponer",totalPiezas(danada)?C.danger:C.muted)}
      </div>
      <h3 style={{fontSize:16,fontWeight:800,margin:"0 0 10px"}}>Por pieza</h3>
      <Card style={{padding:0,overflow:"hidden",marginBottom:24}}><div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead><tr style={{background:C.surface}}>{["Pieza","Salió sucia","Entró limpia","Diferencia","Manchada o dañada"].map(h=><th key={h} style={th}>{h}</th>)}</tr></thead>
          <tbody>{LENCERIA_ITEMS.map(([key,l])=>{const dif=(entra[key]||0)-(sale[key]||0);return(
            <tr key={key} style={{borderTop:`1px solid ${C.border}`}}>
              <td style={{...td,fontWeight:700}}>{l}</td><td style={td}>{sale[key]||0}</td><td style={td}>{entra[key]||0}</td>
              <td style={{...td,color:dif<0?C.danger:dif>0?C.info:C.muted,fontWeight:700}}>{dif>0?"+":""}{dif}</td>
              <td style={{...td,color:danada[key]?C.danger:C.muted,fontWeight:700}}>{danada[key]||0}</td>
            </tr>);})}</tbody>
        </table>
      </div></Card>
      <h3 style={{fontSize:16,fontWeight:800,margin:"0 0 10px"}}>Por apartamento</h3>
      <Card style={{padding:0,overflow:"hidden",marginBottom:24}}><div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>

// 🕒 Horas: corte quincenal por aseadora y día (entrada, salida, horas y tiempo muerto)
const lastDayOf = (y,m) => new Date(y, m, 0).getDate(); // m: 1-12
const quincenaDe = (iso) => { const [y,m,d]=iso.split("-").map(Number); return d<=15?[`${y}-${pad2(m)}-01`,`${y}-${pad2(m)}-15`]:[`${y}-${pad2(m)}-16`,`${y}-${pad2(m)}-${pad2(lastDayOf(y,m))}`]; };
const ultimaQuincenaCerrada = () => { const t=new Date(); const y=t.getFullYear(), m=t.getMonth()+1, d=t.getDate();
  if(d<=15){ const pm=m===1?12:m-1, py=m===1?y-1:y; return [`${py}-${pad2(pm)}-16`,`${py}-${pad2(pm)}-${pad2(lastDayOf(py,pm))}`]; }
  return [`${y}-${pad2(m)}-01`,`${y}-${pad2(m)}-15`]; };
// Una fila por aseadora y día
const jornadasDe = (cleanings, desde, hasta) => {
  const g={};
  cleanings.filter(c=>c.date>=desde&&c.date<=hasta).forEach(c=>{const k=(c.employeeName||"SIN NOMBRE")+"|"+c.date;(g[k]=g[k]||[]).push(c);});
  return Object.entries(g).map(([k,list])=>{
    const [emp,date]=k.split("|");
    const t=list.filter(c=>c.startedAt&&c.finishedAt&&c.finishedAt>c.startedAt).sort((a,b)=>a.startedAt-b.startedAt);
    let horas=0, muerto=0;
    t.forEach((c,i)=>{ horas+=(c.finishedAt-c.startedAt)/60000; if(i>0){ const gap=(c.startedAt-t[i-1].finishedAt)/60000; if(gap>0&&gap<240) muerto+=gap; } });
    return {emp,date,aptos:list.length,medidos:t.length,sinHora:list.length-t.length,
      entrada:t.length?t[0].startedAt:null, salida:t.length?Math.max(...t.map(c=>c.finishedAt)):null,
      jornada:t.length?(Math.max(...t.map(c=>c.finishedAt))-t[0].startedAt)/60000:0, horas, muerto};
  }).sort((a,b)=>a.emp.localeCompare(b.emp)||a.date.localeCompare(b.date));
};
const hDec = (min) => (min/60).toFixed(2).replace(".",",");
const corteCSV = (rows) => {
  const head=["Aseadora","Fecha","Entrada","Salida","Jornada (h)","Horas en apartamentos (h)","Tiempo muerto (h)","Apartamentos","Registros sin hora"];
  const lines=rows.map(r=>[r.emp,fmtDate(r.date),toHM(r.entrada),toHM(r.salida),hDec(r.jornada),hDec(r.horas),hDec(r.muerto),r.aptos,r.sinHora].join(";"));
  return "\ufeff"+[head.join(";"),...lines].join("\r\n");
};

            </div>
          </Card>
        );
      })}
    </div>
  );
}

// ⏱ Tiempos y ganancia: por apartamento, por aseadora y por jornada (con tiempos muertos)
function TiemposTab({appData}){
  const k=getCosts(appData.settings);
  const clients=[...new Set(appData.apartments.map(a=>a.clientName).filter(Boolean))].sort();
  const [fClient,setFClient]=useState(clients.includes("TCG")?"TCG":"");
  const [desde,setDesde]=useState(daysAgoStr(60));
  const [hasta,setHasta]=useState(todayStr());
  const inRange=c=>c.date>=desde&&c.date<=hasta&&(!fClient||c.clientName===fClient);
  const enRango=appData.cleanings.filter(inRange);
  // Menos de 5 min o más de 8 h se toma como error de registro y no cuenta
  const timed=enRango.filter(c=>{const d=durMin(c);return d!=null&&d>=5&&d<=480;});
  const enCurso=appData.cleanings.filter(c=>c.enCurso);
  const aptOf=(c)=>appData.apartments.find(a=>a.id===c.apartmentId)||appData.apartments.find(a=>normTxt(a.displayName)===normTxt(c.apartmentName));
  // Por apartamento
  const apts=appData.apartments.filter(a=>!fClient||a.clientName===fClient);
  // Promedio de apartamentos por viaje de ropa (mismo edificio, mismo día)
  const porViaje={};
  enRango.forEach(c=>{const b=aptOf(c)?.building||c.building||"";const o=porViaje[b]||(porViaje[b]={n:0,dias:new Set()});o.n++;o.dias.add(c.date);});
  const transpApto=(a)=>{const v=viajeDe(k,a.building);if(!v)return 0;const o=porViaje[a.building];return o&&o.dias.size?v/(o.n/o.dias.size):v;};
  const aptRows=apts.map(a=>{
    const ts=timed.filter(c=>aptOf(c)?.id===a.id).map(durMin);
    const n=ts.length, avg=n?ts.reduce((s,x)=>s+x,0)/n:null;
    const e=econ(a.price,avg,juegosOf(a),k,transpApto(a));
    return {a,n,avg,min:n?Math.min(...ts):null,max:n?Math.max(...ts):null,e,servicios:enRango.filter(c=>aptOf(c)?.id===a.id).length};
  }).filter(r=>r.servicios>0||r.n>0).sort((x,y)=>(y.n-x.n)||x.a.displayName.localeCompare(y.a.displayName));
  // Jornadas: aseadora + día, con tiempos muertos entre un apartamento y el siguiente
  const days={};
  timed.forEach(c=>{const key=c.date+"|"+(c.employeeName||"-");(days[key]=days[key]||[]).push(c);});
  const jornadas=Object.entries(days).map(([key,list])=>{
    const l=[...list].sort((a,b)=>a.startedAt-b.startedAt);
    let trabajado=0,muerto=0;
    l.forEach((c,i)=>{trabajado+=durMin(c);if(i>0){const g=(c.startedAt-l[i-1].finishedAt)/60000;if(g>0&&g<240)muerto+=g;}});
    return {date:l[0].date,emp:l[0].employeeName||"—",n:l.length,ini:l[0].startedAt,fin:l.at(-1).finishedAt,trabajado,muerto};
  }).sort((a,b)=>b.date.localeCompare(a.date)||a.emp.localeCompare(b.emp));
  // Por aseadora
  const emps={};
  jornadas.forEach(j=>{const e=emps[j.emp]||(emps[j.emp]={emp:j.emp,dias:0,n:0,trabajado:0,muerto:0});e.dias++;e.n+=j.n;e.trabajado+=j.trabajado;e.muerto+=j.muerto;});
  const empRows=Object.values(emps).sort((a,b)=>b.n-a.n);
  // Resumen
  const totTrab=jornadas.reduce((s,j)=>s+j.trabajado,0), totMuerto=jornadas.reduce((s,j)=>s+j.muerto,0);
  const medidosConPrecio=aptRows.filter(r=>r.n>0);
  const gananciaProm=(f)=>{const n=medidosConPrecio.reduce((s,r)=>s+r.n,0);return n?medidosConPrecio.reduce((s,r)=>s+r.e[f]*r.n,0)/n:null;};
  const gHoy=gananciaProm("gHoy"), gAiu=gananciaProm("gAiu");
  const money=(v)=>v==null?"—":<span style={{color:v>=0?C.success:C.danger,fontWeight:800}}>{v<0?"–":""}{fmtCOP(Math.abs(Math.round(v)))}</span>;
  const th={textAlign:"left",padding:"10px 12px",color:C.muted,fontWeight:700,whiteSpace:"nowrap",fontSize:12};
  const td={padding:"10px 12px",whiteSpace:"nowrap"};
  const kpi=(label,value,sub,color)=>(<Card style={{padding:16}}><div style={{fontSize:12,color:C.muted}}>{label}</div><div style={{fontSize:20,fontWeight:800,color:color||C.text,marginTop:4}}>{value}</div>{sub&&<div style={{fontSize:11,color:C.muted,marginTop:4}}>{sub}</div>}</Card>);
  return(
    <div>
      <h2 style={{margin:"0 0 6px",fontSize:22,fontWeight:800}}>Tiempos y ganancia</h2>
      <div style={{color:C.muted,fontSize:13,marginBottom:18}}>Solo cuentan las limpiezas con hora de entrada y salida (cronómetro o cargadas a mano en ✏️). Costos en Config → Costos.</div>
      <Card style={{marginBottom:16}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12}}>
          <div><Lbl>Cliente</Lbl><Sel value={fClient} onChange={setFClient}><option value="">Todos</option>{clients.map(c=><option key={c} value={c}>{c}</option>)}</Sel></div>
          <div><Lbl>Desde</Lbl><Inp type="date" value={desde} onChange={setDesde}/></div>
          <div><Lbl>Hasta</Lbl><Inp type="date" value={hasta} onChange={setHasta}/></div>
        </div>
      </Card>
      {enCurso.length>0&&<Card style={{marginBottom:16,border:`1px solid ${C.accent}`}}>
        <div style={{fontWeight:800,marginBottom:8}}>⏱ En curso ahora ({enCurso.length})</div>
        {enCurso.map(c=><div key={c.id} style={{fontSize:13,color:C.muted,padding:"3px 0"}}>{c.apartmentName} · {c.employeeName} · entró {toHM(c.startedAt)} ({fmtDate(c.date)})</div>)}

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(170px,1fr))",gap:12,marginBottom:20}}>
        {kpi("Servicios medidos",`${timed.length} de ${enRango.length}`,enRango.length?`${Math.round(timed.length/enRango.length*100)}% con hora de entrada y salida`:"")}
        {kpi("Tiempo promedio",timed.length?fmtMin(timed.reduce((s,c)=>s+durMin(c),0)/timed.length):"—","por apartamento")}
        {kpi("Horas trabajadas",fmtMin(totTrab),"dentro de los apartamentos",C.success)}
        {kpi("Tiempo muerto",fmtMin(totMuerto),totTrab?`${Math.round(totMuerto/(totTrab+totMuerto)*100)}% de la jornada`:"entre apartamentos",totMuerto?C.danger:C.muted)}
        {kpi("Ganancia por servicio hoy",money(gHoy),"IVA del 19% sobre todo")}

      <div style={{marginBottom:12}}><Lbl>Hora de fin de turno</Lbl><Inp type="time" value={k.finTurno||"16:00"} onChange={v=>setK(p=>({...p,finTurno:v}))}/><div style={{fontSize:11,color:C.muted,marginTop:4}}>Hasta esta hora corre el costo de cada aseadora aunque no esté en un apartamento</div></div>

// 📱 Qué celular está a nombre de quién (las aseadoras se identifican una vez por celular)
function CelularesSection({appData,showToast}){
  const [lista,setLista]=useState(null);
  useEffect(()=>{
    if(!DISPOSITIVOS_COL){ setLista([]); return; }
    return DISPOSITIVOS_COL.onSnapshot(snap=>{ const l=[]; snap.forEach(d=>l.push({id:d.id,...d.data()})); setLista(l); },e=>{ console.error(e); setLista([]); });
  },[]);
  const desvincular=(d)=>{
    if(!window.confirm(`¿Desvincular este ${d.equipo||"celular"} de ${d.emp}? La próxima vez que abra la app tendrá que elegir su nombre otra vez.`)) return;
    DISPOSITIVOS_COL.doc(d.id).set({revocado:true},{merge:true}).then(()=>showToast("Celular desvinculado")).catch(e=>{console.error(e);showToast("No se pudo desvincular","error");});
  };
  const cuando=(t)=>{ if(!t) return "—"; const d=new Date(t); const hoy=todayStr(); const f=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; return (f===hoy?"hoy":fmtDate(f))+" "+toHM(t); };
  const activos=(lista||[]).filter(d=>!d.revocado&&d.emp);
  const nombres=[...new Set([...appData.employees,...activos.map(d=>d.emp)])];
  return(
    <Card style={{maxWidth:520,flex:"1 1 340px"}}>
      <h3 style={{margin:"0 0 6px",fontSize:15,fontWeight:700}}>📱 Celulares de cada aseadora</h3>
      <div style={{fontSize:12,color:C.muted,marginBottom:14}}>Cada una elige su nombre una sola vez en su celular y queda adentro. Si ves un celular a nombre de quien no es, desvincúlalo.</div>
      {lista===null?<div style={{color:C.muted,fontSize:13}}>Cargando…</div>:nombres.map(e=>{
        const ds=activos.filter(d=>d.emp===e).sort((a,b)=>(b.ultimo||0)-(a.ultimo||0));
        return(
          <div key={e} style={{padding:"12px 0",borderBottom:`1px solid ${C.border}`}}>
            <div style={{fontWeight:700,fontSize:13}}>👤 {e} <span style={{fontWeight:600,fontSize:11,color:ds.length?C.success:C.muted}}>{ds.length?`· ${ds.length} celular${ds.length===1?"":"es"}`:"· sin celular todavía"}</span></div>
            {ds.map(d=>(
              <div key={d.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10,marginTop:8,padding:"8px 10px",background:C.surface,borderRadius:8}}>
                <div style={{fontSize:12}}><div style={{fontWeight:600}}>{d.equipo||"Celular"}</div><div style={{color:C.muted,fontSize:11}}>Desde {cuando(d.vinculado)} · último uso {cuando(d.ultimo)}</div></div>
                <Btn variant="ghost" size="sm" onClick={()=>desvincular(d)}>Desvincular</Btn>
              </div>))}
          </div>);
      })}
    </Card>
  );
}

function ConfigTab({appData,update,showToast}){
  const [sec,setSec]=useState("apartments");

  const [nBuilding,setNBuilding]=useState("");
  const [nClient,setNClient]=useState("");
  const [nPrice,setNPrice]=useState("");
  const [aptSearch,setAptSearch]=useState("");
  const [newEmp,setNewEmp]=useState("");
  const [newAdminPw,setNewAdminPw]=useState("");
  const [newEmpPw,setNewEmpPw]=useState("");
  // Local editable copy of apartments
  const [localApts,setLocalApts]=useState(()=>appData.apartments);
  const [aptsDirty,setAptsDirty]=useState(false);
  useEffect(()=>{ setLocalApts(appData.apartments); },[appData.apartments.length]);
  const buildings=[...new Set(appData.apartments.map(a=>a.building).filter(Boolean))].sort();
  const clients=[...new Set(appData.apartments.map(a=>a.clientName).filter(Boolean))].sort();
  const addApt=()=>{
    if(!nBuilding.trim()){showToast("El edificio es requerido","error");return;}
    const num=nAptNum.trim(),bld=nBuilding.trim();
    const displayName=num?`${num} ${bld}`:bld;
    // Documento propio en Firestore — nunca pisa otros apartamentos.
    APARTMENTS_COL.add({aptNumber:num,building:bld,displayName,clientName:nClient.trim()||"",price:parseInt(nPrice)||0})
      .then(()=>{
        setNAptNum("");setNBuilding("");setNClient("");setNPrice("");
        showToast(`${displayName} agregado ✅`);
      })
      .catch(e=>{console.error(e);showToast("No se pudo agregar, intenta de nuevo","error");});
  };
  const delApt=(id)=>{
    APARTMENTS_COL.doc(id).delete()
      .then(()=>showToast("Apartamento eliminado","error"))
      .catch(e=>{console.error(e);showToast("No se pudo eliminar, intenta de nuevo","error");});
  };
  const updLocalApt=(id,field,val)=>{
    setLocalApts(prev=>prev.map(a=>{
      if(a.id!==id) return a;
      const u={...a,[field]:field==="price"?val:val};
      u.displayName=u.aptNumber?`${u.aptNumber} ${u.building}`:u.building;

    }));

  };
  const saveApts=()=>{
    // Cada apartamento se guarda en SU PROPIO documento — nunca se toca el
    // documento de otro apartamento, así que nada se pierde entre ediciones.
    const batch=db.batch();
    localApts.forEach(a=>{
      const {id,...rest}=a;
      batch.set(APARTMENTS_COL.doc(id), {...rest,price:parseInt(rest.price)||0}, {merge:true});
    });
    batch.commit()
      .then(()=>{ setAptsDirty(false); showToast("Apartamentos guardados ✅"); })

  };
  const addEmp=()=>{
    if(!newEmp.trim())return;
    const name=newEmp.trim().toUpperCase();
    // arrayUnion es atómico: Firebase lo agrega sin necesitar la lista completa,
    // así que nunca borra un encargado que otro admin haya agregado justo antes.
    DOC_REF.update({"state.employees": firebase.firestore.FieldValue.arrayUnion(name)})
      .then(()=>{setNewEmp("");showToast("Encargado agregado ✅");})
      .catch(e=>{console.error(e);showToast("No se pudo agregar, intenta de nuevo","error");});
  };
  const delEmp=(name)=>{
    DOC_REF.update({"state.employees": firebase.firestore.FieldValue.arrayRemove(name)})
      .then(()=>showToast("Eliminado","error"))
      .catch(e=>{console.error(e);showToast("No se pudo eliminar, intenta de nuevo","error");});
  };
  const savePws=()=>{const s={...appData.settings};if(newAdminPw)s.adminPassword=newAdminPw;if(newEmpPw)s.empPassword=newEmpPw;update("settings",s);setNewAdminPw("");setNewEmpPw("");showToast("Contraseñas guardadas ✅");};
  const filteredApts=localApts.filter(a=>a.displayName.toLowerCase().includes(aptSearch.toLowerCase())||a.clientName?.toLowerCase().includes(aptSearch.toLowerCase())).sort((a,b)=>a.displayName.localeCompare(b.displayName));
  const inpStyle={width:"100%",padding:"10px 14px",background:"#0b0f18",border:`1px solid ${C.border}`,borderRadius:"8px",color:C.text,fontSize:"14px",outline:"none",boxSizing:"border-box",fontFamily:"inherit"};
  return(

      <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
        {[["apartments","🏠 Apartamentos"],["costos","💲 Costos"],["employees","👤 Encargados"],["passwords","📱 Celulares y admin"],["backup","💾 Backup"]].map(([id,label])=>(
          <Btn key={id} variant={sec===id?"primary":"ghost"} onClick={()=>setSec(id)}>{label}</Btn>
        ))}
      </div>
      {sec==="apartments"&&(
        <div>
          <Card style={{marginBottom:16}}>
            <h3 style={{margin:"0 0 16px",fontSize:15,fontWeight:700}}>➕ Nuevo apartamento</h3>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              <div><Lbl>Número de apto</Lbl><Inp value={nAptNum} onChange={setNAptNum} placeholder="Ej: 303"/></div>
              <div><Lbl>Edificio *</Lbl><input list="blist" value={nBuilding} onChange={e=>setNBuilding(e.target.value)} placeholder="Ej: Monserrate" style={inpStyle}/><datalist id="blist">{buildings.map(b=><option key={b} value={b}/>)}</datalist></div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>
              <div><Lbl>Cliente</Lbl><input list="clist" value={nClient} onChange={e=>setNClient(e.target.value)} placeholder="Ej: Veronica" style={inpStyle}/><datalist id="clist">{clients.map(cl=><option key={cl} value={cl}/>)}</datalist></div>
              <div><Lbl>Precio (COP)</Lbl><Inp type="number" value={nPrice} onChange={setNPrice} placeholder="50000"/></div>
            </div>
            <Btn onClick={addApt} style={{width:"100%"}}>+ Agregar</Btn>
          </Card>
          <div style={{display:"flex",gap:10,marginBottom:12,alignItems:"center"}}>
            <div style={{flex:1}}><Inp value={aptSearch} onChange={setAptSearch} placeholder="🔍 Buscar apartamento o cliente..."/></div>
            {aptsDirty&&<Btn variant="success" onClick={saveApts}>💾 Guardar cambios</Btn>}
          </div>
          <Card style={{padding:0,overflow:"hidden"}}>
            <div style={{maxHeight:460,overflowY:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                <thead><tr style={{background:C.surface,position:"sticky",top:0}}>{["Apartamento","Edificio","Cliente","Precio","Tipo","Juegos lencería",""].map((h,i)=><th key={i} style={{textAlign:"left",padding:"12px 16px",color:C.muted,fontWeight:700}}>{h}</th>)}</tr></thead>
                <tbody>
                  {filteredApts.map(a=>(
                    <tr key={a.id} style={{borderTop:`1px solid ${C.border}`}}>
                      <td style={{padding:"10px 16px",fontWeight:700}}>{a.displayName}</td>

                      <td style={{padding:"10px 16px"}}><input value={a.clientName||""} onChange={e=>updLocalApt(a.id,"clientName",e.target.value)} style={{width:100,padding:"5px 8px",background:"#0b0f18",border:`1px solid ${C.border}`,borderRadius:6,color:C.info,fontSize:12,fontFamily:"inherit",outline:"none",fontWeight:600}}/></td>
                      <td style={{padding:"10px 16px"}}><input type="number" value={a.price} onChange={e=>updLocalApt(a.id,"price",e.target.value)} style={{width:90,padding:"5px 8px",background:"#0b0f18",border:`1px solid ${C.border}`,borderRadius:6,color:C.accent,fontSize:12,fontWeight:800,fontFamily:"inherit",outline:"none"}}/></td>

    </div>
  );

function App(){
  // "core" ahora solo guarda encargados y configuración (contraseñas). Los
  // encargados se agregan/quitan con operaciones atómicas (arrayUnion/arrayRemove),
  // así que un cambio de uno nunca pisa el cambio de otro.
  const [core,setCore]=useState(null);
  // "cleaningsLog" y "apartmentsLog" son listas leídas en vivo desde documentos
  // individuales — nunca se sobrescriben enteras, así que nada se pierde.
  const [cleaningsLog,setCleaningsLog]=useState(null);
  const [apartmentsLog,setApartmentsLog]=useState(null);
  const [agendaLog,setAgendaLog]=useState([]);
  const [migrated,setMigrated]=useState(false);
  const [migratedApts,setMigratedApts]=useState(false);
  const [view,setView]=useState(()=>{ const x=leerSesion(); return x?(x.v==="admin"?"admin":"employee"):"login"; });
  const [loginRole,setLoginRole]=useState("employee");
  const [pw,setPw]=useState("");
  const [loginError,setLoginError]=useState("");
  const [adminTab,setAdminTabRaw]=useState(()=>{ try{ return localStorage.getItem("lp_tab")||"dashboard"; }catch(e){ return "dashboard"; } });
  const setAdminTab=(t)=>{ setAdminTabRaw(t); try{ localStorage.setItem("lp_tab",t); }catch(e){} };
  const [toast,setToast]=useState(null);
  const saveTimer=useRef(null);

  const isRemoteUpdate = useRef(false);

  // Escucha en tiempo real — cualquier cambio en Firebase se refleja en todos los dispositivos
  useEffect(()=>{
    if(!FIREBASE_OK || !DOC_REF){
      console.error("Firebase no disponible");
      setCore({employees:DEFAULT_EMPLOYEES,settings:DEFAULT_SETTINGS});
      return;
    }
    const unsub = DOC_REF.onSnapshot(doc=>{
      if(doc.exists){
        const st=doc.data().state||{};
        isRemoteUpdate.current = true;
        setCore({employees:st.employees||DEFAULT_EMPLOYEES,settings:st.settings||DEFAULT_SETTINGS});
        // Migraciones únicas: si quedan limpiezas o apartamentos guardados a la
        // vieja usanza (dentro del bloque grande), se copian a documentos
        // individuales y no se vuelven a tocar aquí. Es seguro repetir esto —
        // nunca duplica.
        if(Array.isArray(st.cleanings) && st.cleanings.length>0 && !migrated){
          setMigrated(true);
          const batch=db.batch();
          st.cleanings.forEach(c=>{
            const {id,...rest}=c;
            batch.set(CLEANINGS_COL.doc(id||uid()), rest, {merge:true});
          });
          batch.commit()
            .then(()=>DOC_REF.set({state:{cleanings:[]}},{merge:true}))
            .catch(e=>console.error("Migración de registros falló:",e));
        } else if(!migrated){
          setMigrated(true);
        }
        if(Array.isArray(st.apartments) && st.apartments.length>0 && !migratedApts){
          setMigratedApts(true);
          const batch=db.batch();
          st.apartments.forEach(a=>{
            const {id,...rest}=a;
            batch.set(APARTMENTS_COL.doc(id||uid()), rest, {merge:true});
          });
          batch.commit()
            .then(()=>DOC_REF.set({state:{apartments:[]}},{merge:true}))
            .catch(e=>console.error("Migración de apartamentos falló:",e));
        } else if(!migratedApts){
          setMigratedApts(true);
        }
      } else {
        const initial={apartments:[],employees:DEFAULT_EMPLOYEES,cleanings:[],settings:DEFAULT_SETTINGS};
        DOC_REF.set({state:initial});
        setCore({employees:initial.employees,settings:initial.settings});
        const batch=db.batch();
        DEFAULT_APARTMENTS.forEach(a=>{ const {id,...rest}=a; batch.set(APARTMENTS_COL.doc(id), rest, {merge:true}); });
        batch.commit().catch(e=>console.error("No se pudieron crear los apartamentos iniciales:",e));
        setMigrated(true);
        setMigratedApts(true);
      }
    }, err=>{
      console.error("Error Firebase:",err);
      setCore({employees:DEFAULT_EMPLOYEES,settings:DEFAULT_SETTINGS});
    });
    return ()=>unsub();
  },[migrated,migratedApts]);

  // Escucha en vivo la lista de limpiezas — cada una es su propio documento
  useEffect(()=>{
    if(!FIREBASE_OK || !CLEANINGS_COL){ setCleaningsLog([]); return; }
    const unsub = CLEANINGS_COL.orderBy("createdAt","asc").onSnapshot(snap=>{
      setCleaningsLog(snap.docs.map(d=>({id:d.id,...d.data()})));
    }, err=>{ console.error("Error cargando registros:",err); setCleaningsLog([]); });
    return ()=>unsub();
  },[]);

  // Escucha en vivo la agenda de los últimos 7 días en adelante
  useEffect(()=>{
    if(!FIREBASE_OK || !AGENDA_COL){ setAgendaLog([]); return; }
    const unsub = AGENDA_COL.where("date",">=",daysAgoStr(7)).onSnapshot(snap=>{
      setAgendaLog(snap.docs.map(d=>({id:d.id,...d.data()})));
    }, err=>{ console.error("Error cargando agenda:",err); setAgendaLog([]); });
    return ()=>unsub();
  },[]);

  // Escucha en vivo la lista de apartamentos — cada uno es su propio documento
  useEffect(()=>{
    if(!FIREBASE_OK || !APARTMENTS_COL){ setApartmentsLog([]); return; }
    const unsub = APARTMENTS_COL.onSnapshot(snap=>{
      setApartmentsLog(snap.docs.map(d=>({id:d.id,...d.data()})));
    }, err=>{ console.error("Error cargando apartamentos:",err); setApartmentsLog([]); });
    return ()=>unsub();
  },[]);

  // Los registros marcados como duplicado no cuentan en ningún total ni listado;
  // quedan aparte (appData.duplicates) para poder revisarlos o restaurarlos.
  const appData = core ? {...core, cleanings: (cleaningsLog||[]).filter(c=>!c.duplicado), duplicates: (cleaningsLog||[]).filter(c=>c.duplicado), apartments: apartmentsLog||[], agenda: agendaLog||[]} : null;
  const loading = !core || cleaningsLog===null || apartmentsLog===null;

  // Guardar en Firestore solo cuando cambia la configuración (contraseñas),
  // y solo cuando el cambio viene del usuario (no de Firebase). Encargados,
  // apartamentos y limpiezas ya no pasan por aquí — cada uno se guarda al
  // instante por su cuenta, sin poder pisar los cambios de otro.
  useEffect(()=>{
    if(!core) return;
    if(!FIREBASE_OK || !DOC_REF) return;
    if(isRemoteUpdate.current){ isRemoteUpdate.current=false; return; }
    if(saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(()=>{
      DOC_REF.set({state:{settings:core.settings}},{merge:true})
        .catch(e=>{ console.error("Error guardando:",e); });
    },600);
  },[core]);

  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3200);};
  const update=(key,val)=>setCore(prev=>({...prev,[key]:val}));
  // Contraseñas maestras (siempre funcionan aunque Firebase tenga otras guardadas)
  const MASTER_ADMIN = "jose0322";
  const MASTER_EMP   = "123";

  // Admin guardado: si cambiaron la contraseña de admin, vuelve a pedirla
  const adminPwActual=appData&&appData.settings&&appData.settings.adminPassword;
  useEffect(()=>{
    if(view!=="admin"||!appData) return;
    const x=leerSesion();
    if(!x||x.v!=="admin"||(x.h!==huella(adminPwActual)&&x.h!==huella(MASTER_ADMIN))){ borrarSesion(); setView("login"); }
  },[view,adminPwActual,!!appData]);

  const handleLogin=()=>{
    const {adminPassword,empPassword}=appData.settings;
    const isAdmin  = pw===adminPassword || pw===MASTER_ADMIN;
    const isEmp    = pw===empPassword   || pw===MASTER_EMP;
    if(loginRole==="admin"&&isAdmin){guardarSesion({v:"admin",h:huella(pw)});setView("admin");setLoginError("");setPw("");}
    else if(loginRole==="employee"){guardarSesion({v:"employee"});setView("employee");setLoginError("");setPw("");}
    else setLoginError("Contraseña incorrecta ❌");
  };

  if(loading) return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",color:C.muted,gap:16}}>
      <div style={{fontSize:40}}>🧹</div>
      <div style={{fontSize:14}}>Conectando con Firebase...</div>
    </div>
  );

  // Si Firebase falló y no hay datos, usar datos por defecto para que la app no quede en blanco
  if(!appData) return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",color:C.muted,gap:16,textAlign:"center",padding:24}}>
      <div style={{fontSize:40}}>⚠️</div>
      <div style={{fontSize:15,fontWeight:700,color:C.danger}}>No se pudo conectar con la base de datos</div>
      <div style={{fontSize:13,maxWidth:340,lineHeight:1.5}}>Revisa tu conexión a internet y recarga la página. Si el problema continúa, verifica que el proyecto de Firebase esté activo.</div>
      <button onClick={()=>window.location.reload()} style={{marginTop:8,padding:"10px 20px",background:C.accent,border:"none",borderRadius:8,color:"#0b0f18",fontWeight:700,cursor:"pointer",fontFamily:"inherit",fontSize:14}}>🔄 Recargar</button>
    </div>
  );

  return(
    <div style={{minHeight:"100vh",background:C.bg,color:C.text,fontFamily:"'DM Sans',system-ui,sans-serif"}}>
      {toast&&<div style={{position:"fixed",bottom:96,left:"50%",transform:"translateX(-50%)",maxWidth:"calc(100% - 32px)",textAlign:"center",zIndex:1000,padding:"12px 20px",borderRadius:10,background:toast.type==="success"?"#14532d":"#7f1d1d",color:"#fff",fontSize:14,fontWeight:700,boxShadow:"0 4px 20px rgba(0,0,0,0.5)",border:`1px solid ${toast.type==="success"?C.success:C.danger}`}}>{toast.msg}</div>}
      {view==="login"    &&<LoginView    loginRole={loginRole} setLoginRole={setLoginRole} pw={pw} setPw={setPw} error={loginError} onLogin={handleLogin}/>}
      {view==="employee" &&<EmployeeView appData={appData} update={update} showToast={showToast} onLogout={()=>{borrarSesion();setView("login");setPw("");}}/>}
      {view==="admin"    &&<AdminView    appData={appData} update={update} showToast={showToast} onLogout={()=>{borrarSesion();setView("login");setPw("");}} tab={adminTab} setTab={setAdminTab}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
