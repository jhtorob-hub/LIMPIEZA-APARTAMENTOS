<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f9fafb;-webkit-tap-highlight-color:transparent}
.page{max-width:480px;margin:0 auto;padding:16px;min-height:100vh;padding-bottom:60px}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 16px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;color:white;font-family:inherit}
.inp{width:100%;padding:11px 12px;border-radius:9px;border:1.5px solid #e5e7eb;font-size:15px;background:white;font-family:inherit;margin-bottom:10px;outline:none}
.inp:focus{border-color:#16a34a}
.lbl{font-size:11px;color:#6b7280;font-weight:700;letter-spacing:.06em;margin-bottom:5px;text-transform:uppercase}
.sb{display:flex;justify-content:space-between;align-items:center}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f3f4f6}
.chip{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
.sbox{background:white;border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.ac{border-left:4px solid #e5e7eb;border-radius:12px;background:white;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ac-live{border-left-color:#16a34a;background:#f0fdf4}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;z-index:200}
.sheet{background:white;border-radius:22px 22px 0 0;padding:24px;width:100%;max-width:480px;margin:0 auto;max-height:92vh;overflow-y:auto}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.mthumb{border-radius:9px;overflow:hidden;aspect-ratio:1;background:#f3f4f6}
.mthumb img,.mthumb video{width:100%;height:100%;object-fit:cover}
.tabs{display:flex;gap:4px;background:white;border-radius:12px;padding:4px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}
.tab{flex:1;padding:10px 6px;border:none;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.irow{display:flex;align-items:flex-start;justify-content:space-between;padding:12px;background:#f9fafb;border-radius:10px;margin-bottom:8px;gap:8px}
.nov-card{background:#dcfce7;border-radius:9px;padding:9px 12px;margin-bottom:6px;border-left:3px solid #16a34a}
.edit-form{background:#f0fdf4;border-radius:12px;padding:16px;margin-bottom:12px;border:2px solid #16a34a}

var S={

// ── UTILS ────────────────────────────────────────────────────────────
function fmt(s){return[Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(function(x){return String(x).padStart(2,"0")}).join(":")}
function fmtD(d){try{return new Date(d).toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"})}catch(e){return""}}
function fmtH(d){try{return new Date(d).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
function nowT(){return new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function pesos(v){return "$"+Number(v||0).toLocaleString("es-CO")}
function toDate(t){if(!t)return new Date();if(t&&t.toDate)return t.toDate();return new Date(t)}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function aptLabel(a){return a?a.name+" ("+a.client+")":""}

// ── FIREBASE ─────────────────────────────────────────────────────────
function loadConfig(){
  db.collection("config").doc("apartamentos").get().then(function(d){
    if(d.exists&&d.data().list&&d.data().list.length){
      var l=d.data().list;
      if(typeof l[0]==="object"&&l[0].name){
        S.aptList=l.map(function(a){return{name:a.name||"",client:a.client||"",valor:Number(a.valor)||0}});
      }
    }
    return db.collection("config").doc("trabajadores").get();
  }).then(function(d){
    if(d.exists&&d.data().list&&d.data().list.length) S.workerList=d.data().list.slice();
    S.screen="home"; render();
  }).catch(function(){S.screen="home";render()});
}

function saveApts(){
  var list=S.aptList.map(function(a){return{name:String(a.name),client:String(a.client),valor:Number(a.valor)||0}});
  db.collection("config").doc("apartamentos").set({list:list}).catch(function(err){console.log("saveApts error:",err)});
}
function saveWorkers(){
  db.collection("config").doc("trabajadores").set({list:S.workerList.slice()}).catch(function(){});
}
function fetchRecs(){
  db.collection("limpiezas").orderBy("startTime","desc").limit(500).get().then(function(snap){
    S.records=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    render();
  }).catch(function(){});
}

// ── MEDIA ────────────────────────────────────────────────────────────
function readFiles(files,key){
  Array.from(files).forEach(function(f){
    var r=new FileReader();
    r.onload=function(ev){S[key].push({url:ev.target.result,isVideo:f.type.startsWith("video")});render()};
    r.readAsDataURL(f);
  });
}
function mediaGrid(items){
  if(!items||!items.length)return"";
  return'<div class="mgrid">'+items.map(function(it){
    return'<div class="mthumb">'+(it.isVideo?'<video src="'+it.url+'" controls></video>':'<img src="'+it.url+'" loading="lazy">')+'</div>';
  }).join("")+'</div>';
}
function novCards(list){
  return(list||[]).map(function(n){
    return'<div class="nov-card"><div style="font-size:11px;color:'+G+';font-weight:700;margin-bottom:3px">'+esc(n.time)+'</div><div style="font-size:14px">'+esc(n.text)+'</div></div>';
  }).join("");
}
function mediaBtns(key,vc,pc){
  return'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px">'+
    '<label style="display:flex;align-items:center;justify-content:center;gap:5px;padding:11px 6px;background:'+vc+';color:white;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer">🎥 Video'+
    '<input type="file" accept="video/*" capture="environment" multiple style="display:none" onchange="readFiles(this.files,\''+key+'\')"></label>'+
    '<label style="display:flex;align-items:center;justify-content:center;gap:5px;padding:11px 6px;background:white;color:'+pc+';border:2px solid '+pc+';border-radius:10px;font-size:13px;font-weight:700;cursor:pointer">📸 Foto'+
    '<input type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="readFiles(this.files,\''+key+'\')"></label>'+
    '</div>';
}

// ── ACCIONES ─────────────────────────────────────────────────────────
function goHome(){
  clearInterval(S.timerInt);S.timerInt=null;
  Object.assign(S,{screen:"home",worker:"",selApt:null,elapsed:0,
    novedades:[],entryMedia:[],danosMedia:[],exitMedia:[],
    showModal:false,showNov:false,sessionId:null,sessionStart:null,lastRec:null});
  render();
}
function startCleaning(){
  if(!S.worker||!S.selApt)return;
  S.sessionStart=new Date();S.elapsed=0;
  S.novedades=[];S.entryMedia=[];S.danosMedia=[];S.exitMedia=[];
  S.showModal=false;S.showNov=false;S.screen="active";render();
  db.collection("limpiezas").add({
    worker:S.worker,apt:aptLabel(S.selApt),client:S.selApt.client,
    valor:Number(S.selApt.valor)||0,
    startTime:firebase.firestore.Timestamp.fromDate(S.sessionStart),
    status:"active",novedades:[],entryCount:0,danosCount:0,exitCount:0,duration:0
  }).then(function(r){S.sessionId=r.id}).catch(function(){});
  clearInterval(S.timerInt);
  S.timerInt=setInterval(function(){
    S.elapsed++;
    var t=document.getElementById("tmr");
    if(t)t.textContent=fmt(S.elapsed);
  },1000);
}
function addNov(){
  var ta=document.getElementById("novta");
  if(!ta||!ta.value.trim())return;
  S.novedades.push({text:ta.value.trim(),time:nowT()});
  S.showNov=false;
  if(S.sessionId)db.collection("limpiezas").doc(S.sessionId).update({novedades:S.novedades}).catch(function(){});
  render();
}
function finalizarLimpieza(){
  clearInterval(S.timerInt);S.timerInt=null;
  var end=new Date();
  if(S.sessionId){
    db.collection("limpiezas").doc(S.sessionId).update({
      status:"completed",endTime:firebase.firestore.Timestamp.fromDate(end),
      duration:S.elapsed,novedades:S.novedades,
      entryCount:S.entryMedia.length,danosCount:S.danosMedia.length,exitCount:S.exitMedia.length
    }).catch(function(){});
  }
  S.lastRec={worker:S.worker,apt:aptLabel(S.selApt),client:S.selApt.client,
    valor:Number(S.selApt.valor)||0,startTime:S.sessionStart,endTime:end,
    duration:S.elapsed,novedades:S.novedades,
    entryCount:S.entryMedia.length,danosCount:S.danosMedia.length,exitCount:S.exitMedia.length};
  S.showModal=false;S.screen="summary";render();
}

// Login
function tryLogin(){
  var el=document.getElementById("pass-inp");
  if(!el)return;
  var v=el.value;
  if(v===PASS_GER){
    S.panel="gerencia";S.passError="";S.gerTab="resumen";S.screen="gerencia";
    fetchRecs();clearInterval(S.pollInt);S.pollInt=setInterval(fetchRecs,15000);render();
  } else if(v===PASS_ADMIN){
    S.panel="admin";S.passError="";S.screen="admin";
    fetchRecs();clearInterval(S.pollInt);S.pollInt=setInterval(fetchRecs,15000);render();
  } else {
    S.passError="Contrasena incorrecta";render();
    setTimeout(function(){var i=document.getElementById("pass-inp");if(i){i.value="";i.focus()}},100);
  }
}
function leavePanel(){
  clearInterval(S.pollInt);S.pollInt=null;
  S.screen="home";S.panel="";S.passError="";S.fDate="";S.fWorker="";S.fApt="";S.fClient="";render();
}

// Gestión apartamentos (solo gerencia)
function openEditApt(idx){
  if(idx===-1){
    S.editApt={idx:-1,name:"",client:"",valor:"0"};
  } else {
    var a=S.aptList[idx];
    S.editApt={idx:idx,name:a.name,client:a.client,valor:String(a.valor||0)};
  }
  render();
  // Focus en el primer campo
  setTimeout(function(){var el=document.getElementById("ea-name");if(el)el.focus()},100);
}
function cancelEditApt(){S.editApt=null;render()}
function saveEditApt(){
  var n=document.getElementById("ea-name");
  var c=document.getElementById("ea-client");
  var v=document.getElementById("ea-valor");
  if(!n||!n.value.trim()){alert("El nombre del apartamento no puede estar vacío");return}
  var obj={
    name:n.value.trim().toUpperCase(),
    client:(c?c.value.trim().toUpperCase():""),
    valor:Number(v?v.value:0)||0
  };
  if(S.editApt.idx===-1){
    S.aptList.push(obj);
  } else {
    S.aptList[S.editApt.idx]=obj;
  }
  saveApts();
  S.editApt=null;
  render();
}
function delApt(idx){
  if(!confirm("Eliminar el apartamento '"+S.aptList[idx].name+"'?"))return;
  S.aptList.splice(idx,1);
  saveApts();render();
}

// Gestión trabajadores
function saveNewWorker(){
  var el=document.getElementById("new-worker-inp");
  if(!el||!el.value.trim())return;
  S.workerList.push(el.value.trim());
  saveWorkers();el.value="";render();
}
function openEditWorker(idx){S.editWorkerIdx=idx;render();setTimeout(function(){var el=document.getElementById("ew-inp");if(el){el.value=S.workerList[idx];el.focus()}},100)}
function saveEditWorker(){
  var el=document.getElementById("ew-inp");
  if(!el||!el.value.trim())return;
  S.workerList[S.editWorkerIdx]=el.value.trim();
  S.editWorkerIdx=-1;saveWorkers();render();
}
function cancelEditWorker(){S.editWorkerIdx=-1;render()}
function delWorker(idx){
  if(!confirm("Eliminar '"+S.workerList[idx]+"'?"))return;
  S.workerList.splice(idx,1);saveWorkers();render();
}

// ── RENDER ────────────────────────────────────────────────────────────
function render(){
  var map={home:pgHome,login:pgLogin,active:pgActive,summary:pgSummary,admin:pgAdmin,gerencia:pgGerencia};
  var fn=map[S.screen]||pgHome;
  document.getElementById("root").innerHTML='<div class="page">'+fn()+'</div>';
}

// ══════════════════════════════════════════════════════════════════════
// HOME  (sin valores monetarios)
// ══════════════════════════════════════════════════════════════════════
function pgHome(){
  var sorted=S.aptList.slice().sort(function(a,b){return a.name.localeCompare(b.name)});
  var aopts=sorted.map(function(a){
    var lbl=aptLabel(a);
    var sel=S.selApt&&aptLabel(S.selApt)===lbl;
    // SOLO muestra nombre y cliente, SIN valor
    return'<option value="'+esc(lbl)+'"'+(sel?" selected":"")+'>'+esc(a.name)+' — '+esc(a.client)+'</option>';
  }).join("");
  var wopts=S.workerList.map(function(w){
    return'<option value="'+esc(w)+'"'+(S.worker===w?" selected":"")+'>'+esc(w)+'</option>';
  }).join("");
  // Info del apto seleccionado: solo muestra cliente, SIN valor
  var aptInfo=S.selApt?
    '<div style="background:#f0fdf4;border-radius:9px;padding:10px 12px;margin-bottom:8px">'+
    '<span style="color:'+G+';font-weight:700;font-size:13px">Cliente: '+esc(S.selApt.client||"Sin asignar")+'</span>'+
    '</div>':"";
  return'<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:18px 0 14px">'+
    '<div><div style="font-size:38px">🧹</div>'+
    '<h1 style="font-size:21px;font-weight:800;color:#111827;margin:6px 0 2px">Control de Limpieza</h1>'+
    '<p style="color:#6b7280;font-size:13px">Selecciona y comienza</p></div></div>'+
    '<div class="card">'+
    '<div class="lbl">Trabajador</div>'+
    '<select class="inp" onchange="S.worker=this.value;render()"><option value="">Seleccionar trabajador...</option>'+wopts+'</select>'+
    '<div class="lbl">Apartamento</div>'+
    '<select class="inp" onchange="(function(v){var a=S.aptList.find(function(x){return aptLabel(x)===v});S.selApt=a||null;render()})(this.value)">'+
    '<option value="">Seleccionar apartamento...</option>'+aopts+'</select>'+
    aptInfo+
    '<button class="btn" onclick="startCleaning()" style="background:'+(S.worker&&S.selApt?G:GR)+';font-size:16px;padding:14px;margin-top:4px">▶ Iniciar Limpieza</button>'+
    '</div>'+
    '<button class="btn" onclick="S.screen=\'login\';S.passError=\'\';render()" style="background:'+B+';margin-top:0">🔐 Acceso Panel</button>';
}

  return'<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:75vh">'+

    '<h2 style="font-size:22px;font-weight:800;color:#111827;margin-bottom:6px">Acceso al Panel</h2>'+

// ACTIVO (operario)
// ══════════════════════════════════════════════════════════════════════
function pgActive(){
  var apt=S.selApt||{};
  var novForm=S.showNov?
    '<textarea id="novta" class="inp" placeholder="Escribir novedad..." style="height:90px;resize:none;margin-top:6px"></textarea>'+
    '<button class="btn" onclick="addNov()" style="background:'+G+';margin-top:6px;padding:10px">✅ Guardar</button>'+
    '<button class="btn" onclick="S.showNov=false;render()" style="background:'+GR+';margin-top:6px;padding:10px">Cancelar</button>':
    '<button class="btn" onclick="S.showNov=true;render()" style="background:'+O+';margin-top:0;padding:10px">➕ Agregar Novedad</button>';
  var modal=S.showModal?
    '<div class="overlay"><div class="sheet">'+
    '<div style="text-align:center;margin-bottom:16px"><div style="font-size:40px">🚪</div>'+
    '<h3 style="font-size:18px;margin-bottom:4px">Evidencia de Salida</h3>'+
    '<p style="color:#6b7280;font-size:14px">Estado final del apartamento</p></div>'+
    mediaBtns("exitMedia",G,G)+mediaGrid(S.exitMedia)+
    '<button class="btn" onclick="finalizarLimpieza()" style="background:'+R+';padding:14px;margin-top:14px">✅ Confirmar Finalización</button>'+
    '<button class="btn" onclick="S.showModal=false;render()" style="background:'+GR+';margin-top:8px">Cancelar</button>'+
    '</div></div>':"";
  return'<div style="background:linear-gradient(135deg,'+G+',#15803d);border-radius:18px;padding:22px;color:white;margin-bottom:14px;text-align:center">'+
    '<div style="font-size:11px;font-weight:700;opacity:.8;margin-bottom:5px;letter-spacing:.1em">LIMPIEZA EN CURSO</div>'+

// ── TAB RESUMEN / DASHBOARD (GERENCIA) ───────────────────────────────
function tabResumen(){
  var from=S.dashFrom?new Date(S.dashFrom+" 00:00:00"):null;
  var to=S.dashTo?new Date(S.dashTo+" 23:59:59"):null;
  var all=S.records.filter(function(r){return r.status==="completed"});
  var inRange=all.filter(function(r){
    var d=toDate(r.endTime||r.startTime);
    if(from&&d<from)return false;
    if(to&&d>to)return false;
    return true;
  });
  var totalV=inRange.reduce(function(a,r){return a+(r.valor||0)},0);
  var totalC=inRange.length;
  var avgDur=totalC?Math.round(inRange.reduce(function(a,r){return a+(r.duration||0)},0)/totalC):0;

  // Por cliente
  var byC={};
  inRange.forEach(function(r){
    var c=r.client||"Sin cliente";
    if(!byC[c])byC[c]={count:0,valor:0,dur:0};
    byC[c].count++;byC[c].valor+=r.valor||0;byC[c].dur+=r.duration||0;
  });
  var clientsArr=Object.keys(byC).map(function(k){return Object.assign({name:k},byC[k])}).sort(function(a,b){return b.valor-a.valor});
  var maxCV=clientsArr.length?clientsArr[0].valor||1:1;

  // Meses
  var now=new Date();
  var months=[];
  for(var i=0;i<6;i++){
    var d=new Date(now.getFullYear(),now.getMonth()-(5-i),1);
    months.push({lbl:MONTHS[d.getMonth()]+"'"+String(d.getFullYear()).slice(2),y:d.getFullYear(),m:d.getMonth(),count:0,valor:0});
  }
  all.forEach(function(r){
    var d=toDate(r.endTime||r.startTime);
    var mo=months.find(function(x){return x.y===d.getFullYear()&&x.m===d.getMonth()});
    if(mo){mo.count++;mo.valor+=r.valor||0}
  });

  // Mes actual vs anterior
  var cm=now.getMonth(),cy=now.getFullYear(),pm=cm===0?11:cm-1,py=cm===0?cy-1:cy;
  var curM=all.filter(function(r){var d=toDate(r.endTime||r.startTime);return d.getMonth()===cm&&d.getFullYear()===cy});
  var prevM=all.filter(function(r){var d=toDate(r.endTime||r.startTime);return d.getMonth()===pm&&d.getFullYear()===py});
  var curV=curM.reduce(function(a,r){return a+(r.valor||0)},0);
  var prevV=prevM.reduce(function(a,r){return a+(r.valor||0)},0);
  var diffC=curM.length-prevM.length;
  var diffV=curV-prevV;

  var maxBC=Math.max.apply(null,months.map(function(m){return m.count}))||1;
  var maxBV=Math.max.apply(null,months.map(function(m){return m.valor}))||1;

  var barsCount='<div style="display:flex;gap:4px;height:140px;align-items:flex-end">'+
    months.map(function(m){
      var pct=Math.round(m.count/maxBC*100);
      return'<div style="flex:1;display:flex;flex-direction:column;align-items:center">'+
        '<div style="font-size:10px;font-weight:700;color:#374151;margin-bottom:2px">'+m.count+'</div>'+
        '<div style="width:100%;max-width:32px;background:'+G+';border-radius:4px 4px 0 0;height:'+(pct||0)+'%;min-height:'+(m.count>0?6:0)+'px"></div>'+
        '<div style="font-size:9px;color:#9ca3af;margin-top:4px;text-align:center;line-height:1.2">'+m.lbl+'</div></div>';
    }).join("")+'</div>';

  var barsVal='<div style="display:flex;gap:4px;height:140px;align-items:flex-end">'+
    months.map(function(m){
      var pct=Math.round(m.valor/maxBV*100);
      var lbl=m.valor>=1000000?Math.round(m.valor/1000000)+"M":m.valor>=1000?Math.round(m.valor/1000)+"k":String(m.valor);
      return'<div style="flex:1;display:flex;flex-direction:column;align-items:center">'+
        '<div style="font-size:9px;font-weight:700;color:#374151;margin-bottom:2px">'+lbl+'</div>'+
        '<div style="width:100%;max-width:32px;background:'+PU+';border-radius:4px 4px 0 0;height:'+(pct||0)+'%;min-height:'+(m.valor>0?6:0)+'px"></div>'+
        '<div style="font-size:9px;color:#9ca3af;margin-top:4px;text-align:center;line-height:1.2">'+m.lbl+'</div></div>';
    }).join("")+'</div>';

  var clientsH=!clientsArr.length?'<p style="color:#9ca3af;text-align:center;padding:12px">Sin datos</p>':
    clientsArr.map(function(c,i){
      var pct=maxCV>0?Math.round((c.valor||0)/maxCV*100):0;
      return'<div style="padding:12px;background:#f9fafb;border-radius:10px;margin-bottom:8px;border-left:4px solid '+COLORS[i%COLORS.length]+'">'+
        '<div class="sb" style="margin-bottom:6px">'+
        '<div>'+
        '<div style="font-weight:800;font-size:15px">'+esc(c.name)+'</div>'+
        '<div style="font-size:12px;color:#6b7280;margin-top:2px">'+
        '<span style="font-weight:700;color:'+G+'">'+c.count+'</span> limpiezas · prom '+fmt(c.count?Math.round(c.dur/c.count):0)+'</div>'+
        '<div style="font-size:11px;color:#9ca3af">'+(totalC?Math.round(c.count/totalC*100):0)+'% del total</div></div>'+
        '<div style="text-align:right"><div style="font-weight:900;color:'+PU+';font-size:16px">'+pesos(c.valor)+'</div></div></div>'+
        '<div style="background:#e5e7eb;border-radius:6px;height:6px"><div style="background:'+COLORS[i%COLORS.length]+';border-radius:6px;height:6px;width:'+pct+'%"></div></div>'+
        '</div>';
    }).join("")+
    '<div style="margin-top:8px;padding:12px;background:linear-gradient(135deg,'+PU+',#5b21b6);border-radius:10px;display:flex;justify-content:space-between;align-items:center">'+
    '<span style="font-weight:700;color:rgba(255,255,255,.85)">TOTAL</span><span style="font-weight:900;color:white;font-size:18px">'+pesos(totalV)+'</span></div>';

  return'<div class="card">'+
    '<div style="font-weight:700;margin-bottom:10px;font-size:14px">📅 Período de análisis</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
    '<div><div class="lbl">Desde</div><input type="date" class="inp" value="'+S.dashFrom+'" onchange="S.dashFrom=this.value;render()" style="margin:0"></div>'+
    '<div><div class="lbl">Hasta</div><input type="date" class="inp" value="'+S.dashTo+'" onchange="S.dashTo=this.value;render()" style="margin:0"></div>'+
    '</div></div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'+
    '<div class="sbox"><div style="font-size:26px;font-weight:900;color:'+G+'">'+totalC+'</div><div style="font-size:10px;color:#6b7280;font-weight:700;margin-top:2px">LIMPIEZAS</div></div>'+
    '<div class="sbox"><div style="font-size:18px;font-weight:900;color:'+PU+'">'+pesos(totalV)+'</div><div style="font-size:10px;color:#6b7280;font-weight:700;margin-top:2px">VALOR TOTAL</div></div>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">'+
    '<div class="sbox"><div style="font-size:16px;font-weight:900;color:'+O+'">'+fmt(avgDur)+'</div><div style="font-size:10px;color:#6b7280;font-weight:700;margin-top:2px">DURACIÓN PROM.</div></div>'+
    '<div class="sbox"><div style="font-size:26px;font-weight:900;color:'+B+'">'+clientsArr.length+'</div><div style="font-size:10px;color:#6b7280;font-weight:700;margin-top:2px">CLIENTES</div></div>'+
    '</div>'+
    '<div class="card">'+
    '<div style="font-weight:700;margin-bottom:12px;font-size:14px">📈 Mes actual vs anterior</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">'+
    '<div style="text-align:center;padding:14px;background:#f0fdf4;border-radius:12px">'+
    '<div style="font-size:11px;color:#6b7280;font-weight:700;margin-bottom:4px">MES ACTUAL</div>'+
    '<div style="font-size:40px;font-weight:900;color:'+G+'">'+curM.length+'</div>'+
    '<div style="font-size:13px;color:'+G+';font-weight:700">'+pesos(curV)+'</div></div>'+
    '<div style="text-align:center;padding:14px;background:#f9fafb;border-radius:12px">'+
    '<div style="font-size:11px;color:#6b7280;font-weight:700;margin-bottom:4px">MES ANTERIOR</div>'+
    '<div style="font-size:40px;font-weight:900;color:#9ca3af">'+prevM.length+'</div>'+
    '<div style="font-size:13px;color:#9ca3af;font-weight:700">'+pesos(prevV)+'</div></div></div>'+
    '<div style="padding:10px;background:'+(diffC>=0?"#f0fdf4":"#fff1f2")+';border-radius:10px;text-align:center">'+
    '<div style="font-weight:700;color:'+(diffC>=0?G:R)+';font-size:14px">'+(diffC>=0?"▲ "+diffC+" más limpiezas":"▼ "+Math.abs(diffC)+" menos limpiezas")+'</div>'+
    '<div style="font-weight:700;color:'+(diffV>=0?G:R)+';font-size:13px;margin-top:3px">'+(diffV>=0?"▲ +":"▼ ")+pesos(Math.abs(diffV))+" en ingresos"+'</div></div></div>'+
    '<div class="card"><div style="font-weight:700;margin-bottom:14px;font-size:14px">📊 Limpiezas por mes</div>'+barsCount+'</div>'+
    '<div class="card"><div style="font-weight:700;margin-bottom:14px;font-size:14px">💰 Ingresos por mes</div>'+barsVal+'</div>'+
    '<div class="card"><div style="font-weight:700;margin-bottom:12px;font-size:14px">👥 Por cliente (en rango)</div>'+clientsH+'</div>';
}

// ── TAB CONFIG (GERENCIA) ─────────────────────────────────────────────
function tabConfig(){
  var isApts=S.cfgTab==="apts";

  // ── Formulario edición apartamento ──────────────────────────────────
  var formH="";
  if(S.editApt){
    var ea=S.editApt;
    formH='<div class="edit-form">'+
      '<div style="font-weight:800;font-size:15px;color:'+G+';margin-bottom:14px">'+(ea.idx===-1?"➕ Nuevo Apartamento":"✏️ Editar: "+esc(ea.name))+'</div>'+
      '<div class="lbl">Nombre del Apartamento *</div>'+
      '<input id="ea-name" class="inp" type="text" placeholder="Ej: 1103" value="'+esc(ea.name)+'">'+
      '<div class="lbl">Cliente *</div>'+
      '<input id="ea-client" class="inp" type="text" placeholder="Ej: TCG" value="'+esc(ea.client)+'">'+
      '<div class="lbl">Valor del Servicio ($)</div>'+
      '<input id="ea-valor" class="inp" type="number" min="0" placeholder="0" value="'+Number(ea.valor||0)+'">'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px">'+
      '<button onclick="saveEditApt()" class="btn" style="background:'+G+';margin-top:0">✅ Guardar</button>'+
      '<button onclick="cancelEditApt()" class="btn" style="background:'+GR+';margin-top:0">Cancelar</button>'+
      '</div></div>';
  }

  // ── Lista de apartamentos ────────────────────────────────────────────
  var aptListH='';
  if(!S.editApt){
    aptListH='<div class="card">'+
      '<div style="font-weight:700;margin-bottom:12px;font-size:14px">Lista de Apartamentos</div>'+
      S.aptList.map(function(a,idx){
        return'<div class="irow">'+
          '<div style="flex:1;min-width:0">'+
          '<div style="font-weight:700;font-size:14px">'+esc(a.name)+'</div>'+
          '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:4px">'+
          '<span class="chip" style="background:#eff6ff;color:'+B+'">'+esc(a.client||"Sin cliente")+'</span>'+
          '<span class="chip" style="background:#f5f3ff;color:'+PU+'">'+pesos(a.valor)+'</span>'+
          '</div></div>'+
          '<div style="display:flex;gap:6px;flex-shrink:0">'+
          '<button onclick="openEditApt('+idx+')" style="background:#eff6ff;color:'+B+';border:none;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:700;font-size:12px;font-family:inherit">✏️ Editar</button>'+
          '<button onclick="delApt('+idx+')" style="background:#fff1f2;color:'+R+';border:none;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:12px;font-family:inherit">🗑️</button>'+
          '</div></div>';
      }).join("")+
      '</div>';
  }

  // ── Lista trabajadores ────────────────────────────────────────────────
  var wListH='<div class="card">'+
    '<div style="font-weight:700;margin-bottom:12px;font-size:14px">Agregar Trabajador</div>'+
    '<div style="display:flex;gap:8px">'+
    '<input id="new-worker-inp" class="inp" type="text" placeholder="Nombre completo" style="flex:1;margin:0" onkeydown="if(event.key===\'Enter\')saveNewWorker()">'+
    '<button onclick="saveNewWorker()" style="background:'+G+';color:white;border:none;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer;font-size:18px;font-family:inherit">+</button>'+
    '</div></div>'+
    '<div class="card">'+
    '<div style="font-weight:700;margin-bottom:12px;font-size:14px">Trabajadores Registrados</div>'+
    S.workerList.map(function(w,i){
      if(S.editWorkerIdx===i){
        return'<div class="irow">'+
          '<input id="ew-inp" class="inp" type="text" style="flex:1;margin:0" value="'+esc(w)+'">'+
          '<div style="display:flex;gap:6px;margin-left:8px">'+
          '<button onclick="saveEditWorker()" style="background:'+G+';color:white;border:none;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:700;font-family:inherit">✓</button>'+
          '<button onclick="cancelEditWorker()" style="background:'+GR+';color:white;border:none;border-radius:8px;padding:7px 12px;cursor:pointer;font-family:inherit">✕</button>'+
          '</div></div>';
      }
      return'<div class="irow">'+
        '<span style="font-size:14px;font-weight:500;flex:1">'+esc(w)+'</span>'+
        '<div style="display:flex;gap:6px">'+
        '<button onclick="openEditWorker('+i+')" style="background:#eff6ff;color:'+B+';border:none;border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:700;font-size:12px;font-family:inherit">✏️ Editar</button>'+
        '<button onclick="delWorker('+i+')" style="background:#fff1f2;color:'+R+';border:none;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:12px;font-family:inherit">🗑️</button>'+
        '</div></div>';
    }).join("")+
    '</div>';

  return'<div class="tabs">'+
    '<button class="tab" onclick="S.cfgTab=\'apts\';S.editApt=null;S.editWorkerIdx=-1;render()" style="background:'+(isApts?G:"transparent")+';color:'+(isApts?"white":"#6b7280")+'">🏠 Apartamentos ('+S.aptList.length+')</button>'+
    '<button class="tab" onclick="S.cfgTab=\'workers\';S.editApt=null;S.editWorkerIdx=-1;render()" style="background:'+(!isApts?G:"transparent")+';color:'+(!isApts?"white":"#6b7280")+'">👤 Trabajadores ('+S.workerList.length+')</button>'+
    '</div>'+
    (isApts?
      (!S.editApt?'<button class="btn" onclick="openEditApt(-1)" style="background:'+G+';margin-top:0;margin-bottom:10px;padding:12px">➕ Agregar Nuevo Apartamento</button>':"")+
      formH+aptListH
      :wListH);
}

// ── INICIO ────────────────────────────────────────────────────────────
loadConfig();
</script>
</body>
</html>
