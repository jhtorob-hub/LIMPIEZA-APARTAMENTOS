<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f9fafb;-webkit-tap-highlight-color:transparent}
.page{max-width:480px;margin:0 auto;padding:16px;min-height:100vh;padding-bottom:60px}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 16px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;color:white;font-family:inherit;text-decoration:none}
.btn-sm{padding:6px 12px;font-size:13px;border:none;border-radius:7px;cursor:pointer;font-weight:600;font-family:inherit}
.inp{width:100%;padding:11px 12px;border-radius:9px;border:1.5px solid #e5e7eb;font-size:15px;background:white;font-family:inherit;margin-bottom:10px;outline:none;transition:border .2s}
.inp:focus{border-color:#16a34a}
.inp-sm{padding:8px 10px;border-radius:8px;border:1.5px solid #e5e7eb;font-size:14px;background:white;font-family:inherit;outline:none}
select.inp{appearance:none;-webkit-appearance:none}
textarea.inp{resize:none}
.lbl{font-size:11px;color:#6b7280;font-weight:700;letter-spacing:.06em;margin-bottom:5px;text-transform:uppercase}
.row-sb{display:flex;justify-content:space-between;align-items:center}
.hrow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f3f4f6}
.badge{font-size:11px;font-weight:800;padding:2px 10px;border-radius:20px}
.sbox{background:white;border-radius:12px;padding:14px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sbox-val{font-size:22px;font-weight:900;line-height:1.2}
.sbox-lbl{font-size:10px;color:#6b7280;font-weight:700;margin-top:3px;text-transform:uppercase}
.ac{border-left:4px solid #e5e7eb;border-radius:12px;background:white;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ac-live{border-left-color:#16a34a;background:#f0fdf4}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;z-index:200}
.sheet{background:white;border-radius:22px 22px 0 0;padding:24px;width:100%;max-width:480px;margin:0 auto;max-height:92vh;overflow-y:auto}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.mthumb{border-radius:9px;overflow:hidden;aspect-ratio:1;background:#f3f4f6}
.mthumb img,.mthumb video{width:100%;height:100%;object-fit:cover}
.tabs{display:flex;gap:4px;background:white;border-radius:12px;padding:4px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}
.tab{flex:1;padding:10px;border:none;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}
.item-row{display:flex;align-items:flex-start;justify-content:space-between;padding:11px 12px;background:#f9fafb;border-radius:10px;margin-bottom:7px;gap:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center}
.bar-inner{width:28px;border-radius:5px 5px 0 0}
.nov-card{background:#dcfce7;border-radius:9px;padding:9px 12px;margin-bottom:6px;border-left:3px solid #16a34a}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
</style>

// ── UTILS ────────────────────────────────────────────────────────────
function fmt(s){return[Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(function(x){return String(x).padStart(2,"0")}).join(":")}
function fmtD(d){try{return new Date(d).toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"})}catch(e){return""}}
function fmtH(d){try{return new Date(d).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
function nowT(){return new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function pesos(v){return "$"+Number(v||0).toLocaleString("es-CO")}
function toDate(t){if(!t)return new Date();if(t.toDate)return t.toDate();return new Date(t)}
function e(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function aptLabel(a){return a?a.name+" ("+a.client+")":""}

// ── FIREBASE OPS ─────────────────────────────────────────────────────
function loadConfig(){
  db.collection("config").doc("apartamentos").get().then(function(d){
    if(d.exists && d.data().list && d.data().list.length){
      var l=d.data().list;
      if(typeof l[0]==="object" && l[0].name) S.aptList=l.map(function(a){return Object.assign({},a)});
    }
    return db.collection("config").doc("trabajadores").get();
  }).then(function(d){
    if(d.exists && d.data().list && d.data().list.length) S.workerList=d.data().list.slice();
    S.screen="home"; render();
  }).catch(function(err){
    console.log("Config load error:",err);
    S.screen="home"; render();
  });
}
function saveApts(){
  var list=S.aptList.map(function(a){return{name:a.name,client:a.client,valor:Number(a.valor)||0}});
  db.collection("config").doc("apartamentos").set({list:list}).catch(function(e){console.log("saveApts error",e)});
}
function saveWorkers(){
  db.collection("config").doc("trabajadores").set({list:S.workerList.slice()}).catch(function(e){console.log("saveWorkers error",e)});
}
function addLimpieza(data){
  return db.collection("limpiezas").add(data).then(function(r){return r.id}).catch(function(){return null});
}
function updateLimpieza(id,data){
  if(!id)return;
  db.collection("limpiezas").doc(id).update(data).catch(function(){});
}
function fetchRecs(){
  return db.collection("limpiezas").orderBy("startTime","desc").limit(500).get().then(function(snap){
    S.adminRecs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    render();
  }).catch(function(){});
}

// ── MEDIA ────────────────────────────────────────────────────────────
function readFiles(files, key){
  Array.from(files).forEach(function(f){
    var r=new FileReader();
    r.onload=function(ev){S[key].push({url:ev.target.result,isVideo:f.type.startsWith("video")});render()};
    r.readAsDataURL(f);
  });
}
function mediaGrid(items){
  if(!items||!items.length)return"";
  return'<div class="mgrid">'+items.map(function(it){
    return'<div class="mthumb">'+(it.isVideo?'<video src="'+it.url+'" controls></video>':'<img src="'+it.url+'" loading="lazy">')+'</div>';
  }).join("")+'</div>';
}
function novCards(list){
  return(list||[]).map(function(n){
    return'<div class="nov-card"><div style="font-size:11px;color:'+G+';font-weight:700;margin-bottom:3px">'+e(n.time)+'</div><div style="font-size:14px">'+e(n.text)+'</div></div>';
  }).join("");
}
function mediaLabel(label,key,vc,pc){
  return'<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px">'+
    '<label style="display:flex;align-items:center;justify-content:center;gap:5px;padding:11px 6px;background:'+vc+';color:white;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer">🎥 Video<input type="file" accept="video/*" capture="environment" multiple style="display:none" onchange="readFiles(this.files,\''+key+'\')"></label>'+
    '<label style="display:flex;align-items:center;justify-content:center;gap:5px;padding:11px 6px;background:white;color:'+pc+';border:2px solid '+pc+';border-radius:10px;font-size:13px;font-weight:700;cursor:pointer">📸 Foto<input type="file" accept="image/*" capture="environment" multiple style="display:none" onchange="readFiles(this.files,\''+key+'\')"></label>'+
    '</div>';
}

// ── ACCIONES ─────────────────────────────────────────────────────────
function goHome(){
  clearInterval(S.timerInt); S.timerInt=null;
  S.screen="home"; S.worker=""; S.selApt=null; S.elapsed=0;
  S.novedades=[]; S.entryMedia=[]; S.danosMedia=[]; S.exitMedia=[];
  S.showModal=false; S.showNov=false; S.sessionId=null; S.sessionStart=null;
  render();
}

function startCleaning(){
  if(!S.worker||!S.selApt)return;
  S.sessionStart=new Date(); S.elapsed=0;
  S.novedades=[]; S.entryMedia=[]; S.danosMedia=[]; S.exitMedia=[];
  S.showModal=false; S.showNov=false;
  S.screen="active"; render();
  addLimpieza({
    worker:S.worker, apt:aptLabel(S.selApt), client:S.selApt.client,
    valor:Number(S.selApt.valor)||0,
    startTime:firebase.firestore.Timestamp.fromDate(S.sessionStart),
    status:"active", novedades:[], entryCount:0, danosCount:0, exitCount:0, duration:0
  }).then(function(id){S.sessionId=id});
  clearInterval(S.timerInt);
  S.timerInt=setInterval(function(){
    S.elapsed++;
    var t=document.getElementById("tmr");
    if(t)t.textContent=fmt(S.elapsed);
  },1000);
}

function addNov(){
  var ta=document.getElementById("novta");
  if(!ta||!ta.value.trim())return;
  S.novedades.push({text:ta.value.trim(),time:nowT()});
  S.showNov=false;
  if(S.sessionId)updateLimpieza(S.sessionId,{novedades:S.novedades});
  render();
}

function finalizarLimpieza(){
  clearInterval(S.timerInt); S.timerInt=null;
  var endTime=new Date();
  updateLimpieza(S.sessionId,{
    status:"completed",
    endTime:firebase.firestore.Timestamp.fromDate(endTime),
    duration:S.elapsed, novedades:S.novedades,
    entryCount:S.entryMedia.length, danosCount:S.danosMedia.length, exitCount:S.exitMedia.length
  });
  S.lastRec={
    worker:S.worker, apt:aptLabel(S.selApt), client:S.selApt.client,
    valor:Number(S.selApt.valor)||0,
    startTime:S.sessionStart, endTime:endTime,
    duration:S.elapsed, novedades:S.novedades,
    entryCount:S.entryMedia.length, danosCount:S.danosMedia.length, exitCount:S.exitMedia.length
  };
  S.showModal=false; S.screen="summary"; render();
}

function tryLogin(){
  var input=document.getElementById("pass-input");
  if(!input)return;
  var val=input.value;
  if(val===PASS_GER){
    S.passError=""; S.screen="gerencia"; S.passInput="";
    fetchRecs();
    clearInterval(S.pollInt); S.pollInt=setInterval(fetchRecs,15000);
    render();
  } else if(val===PASS_ADMIN){
    S.passError=""; S.screen="admin"; S.passInput="";
    fetchRecs();
    clearInterval(S.pollInt); S.pollInt=setInterval(fetchRecs,15000);
    render();
  } else {
    S.passError="Contrasena incorrecta"; render();
    setTimeout(function(){var i=document.getElementById("pass-input");if(i){i.value="";i.focus()}},100);
  }
}

function leavePanel(){
  clearInterval(S.pollInt); S.pollInt=null;
  S.screen="home"; S.passInput=""; S.passError=""; render();
}

// ── SETTINGS (GERENCIA) ───────────────────────────────────────────────
function openEditApt(idx){
  var a=idx===-1?{name:"",client:"",valor:0}:S.aptList[idx];
  S.editingApt={idx:idx,name:a.name,client:a.client,valor:String(a.valor||0)};
  render();
}
function cancelEditApt(){S.editingApt=null;render()}
function saveEditApt(){
  var nEl=document.getElementById("ea-name");
  var cEl=document.getElementById("ea-client");
  var vEl=document.getElementById("ea-valor");
  if(!nEl||!nEl.value.trim()){alert("El nombre no puede estar vacío");return}
  var obj={name:nEl.value.trim().toUpperCase(),client:(cEl?cEl.value.trim().toUpperCase():""),valor:Number(vEl?vEl.value:0)||0};
  if(S.editingApt.idx===-1){
    S.aptList.push(obj);
  } else {
    S.aptList[S.editingApt.idx]=obj;
  }
  S.editingApt=null;
  saveApts();
  render();
}
function delApt(idx){
  if(!confirm("Eliminar '"+S.aptList[idx].name+"'?"))return;
  S.aptList.splice(idx,1);
  saveApts();
  render();
}
function addWorker(){
  var el=document.getElementById("new-worker-inp");
  if(!el||!el.value.trim())return;
  S.workerList.push(el.value.trim());
  saveWorkers();
  el.value="";
  render();
}
function startEditWorker(idx){
  S.editingWorkerIdx=idx;
  S.editingWorkerVal=S.workerList[idx];
  render();
}
function saveEditWorker(){
  var el=document.getElementById("edit-worker-inp");
  if(!el||!el.value.trim())return;
  S.workerList[S.editingWorkerIdx]=el.value.trim();
  S.editingWorkerIdx=-1;
  saveWorkers();
  render();
}
function delWorker(idx){
  if(!confirm("Eliminar '"+S.workerList[idx]+"'?"))return;
  S.workerList.splice(idx,1);
  saveWorkers();
  render();
}

// ── RENDER ────────────────────────────────────────────────────────────
function render(){
  var map={
    home:screenHome, login:screenLogin,
    active:screenActive, summary:screenSummary,
    admin:screenAdmin, gerencia:screenGerencia, settings:screenSettings
  };
  var fn=map[S.screen]||screenHome;
  document.getElementById("root").innerHTML='<div class="page">'+fn()+'</div>';
}

// PANTALLA HOME
// ══════════════════════════════════════════════════════════════════════

  var sorted=S.aptList.slice().sort(function(a,b){return a.name.localeCompare(b.name)});
  var aopts=sorted.map(function(a){
    var lbl=aptLabel(a);
    var sel=S.selApt&&aptLabel(S.selApt)===lbl;
    return'<option value="'+e(lbl)+'"'+(sel?" selected":"")+'>'+e(a.name)+' - '+e(a.client)+'</option>';
  }).join("");
  var wopts=S.workerList.map(function(w){
    return'<option value="'+e(w)+'"'+(S.worker===w?" selected":"")+'>'+e(w)+'</option>';
  }).join("");
  var aptInfo=S.selApt?'<div style="background:#f0fdf4;border-radius:9px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">'+
    '<span style="color:'+G+';font-weight:700;font-size:13px">Cliente: '+e(S.selApt.client||"Sin asignar")+'</span>'+
    '</div>':"";
  return'<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:18px 0 14px">'+
    '<div><div style="font-size:38px">🧹</div><h1 style="font-size:21px;font-weight:800;color:#111827;margin:6px 0 2px">Control de Limpieza</h1><p style="color:#6b7280;font-size:13px">Bienvenido</p></div>'+
    '</div>'+
    '<div class="card">'+
    '<div class="lbl">Trabajador</div>'+
    '<select class="inp" onchange="S.worker=this.value;render()"><option value="">Seleccionar trabajador...</option>'+wopts+'</select>'+
    '<div class="lbl">Apartamento</div>'+
    '<select class="inp" onchange="(function(v){var a=S.aptList.find(function(x){return aptLabel(x)===v});S.selApt=a||null;render()})(this.value)"><option value="">Seleccionar apartamento...</option>'+aopts+'</select>'+
    aptInfo+
    '<button class="btn" onclick="startCleaning()" style="background:'+(S.worker&&S.selApt?G:GR)+';font-size:16px;padding:14px;margin-top:4px">▶ Iniciar Limpieza</button>'+
    '</div>'+
    '<button class="btn" onclick="S.screen=\'login\';S.passError=\'\';render()" style="background:'+B+';margin-top:0">🔐 Acceso Panel</button>';
}

// ══════════════════════════════════════════════════════════════════════
function screenLogin(){
  return'<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:75vh">'+
    '<div style="font-size:52px;margin-bottom:16px">🔐</div>'+
    '<h2 style="font-size:22px;font-weight:800;color:#111827;margin-bottom:6px">Acceso al Panel</h2>'+

// PANTALLA ACTIVA (OPERARIO)
// ══════════════════════════════════════════════════════════════════════
function screenActive(){
  var apt=S.selApt||{};
  var modal=S.showModal?
    '<div class="overlay"><div class="sheet">'+
    '<div style="text-align:center;margin-bottom:16px"><h3 style="font-size:18px">📸 Evidencia de Salida</h3><p style="color:#6b7280;font-size:14px;margin-top:4px">Graba o fotografía el estado final</p></div>'+
    mediaLabel("salida","exitMedia",G,G)+
    mediaGrid(S.exitMedia)+
    '<button class="btn" onclick="finalizarLimpieza()" style="background:'+R+';padding:14px;margin-top:14px">✅ Confirmar Finalización</button>'+
    '<button class="btn" onclick="S.showModal=false;render()" style="background:'+GR+';margin-top:8px">Cancelar</button>'+
    '</div></div>':"";
  var novForm=S.showNov?

function tabResumen(){
  var from=S.dashFrom?new Date(S.dashFrom+" 00:00:00"):null;
  var to=S.dashTo?new Date(S.dashTo+" 23:59:59"):null;
  var all=S.adminRecs.filter(function(r){return r.status==="completed"});
  var inRange=all.filter(function(r){
    var d=toDate(r.endTime||r.startTime);
    if(from&&d<from)return false;
    if(to&&d>to)return false;
    return true;
  });

  var totalVal=inRange.reduce(function(a,r){return a+(r.valor||0)},0);
  var totalCount=inRange.length;
  var avgDur=totalCount?Math.round(inRange.reduce(function(a,r){return a+(r.duration||0)},0)/totalCount):0;

  // Por cliente
  var byClient={};
  inRange.forEach(function(r){
    var c=r.client||"Sin cliente";
    if(!byClient[c])byClient[c]={count:0,valor:0,dur:0};
    byClient[c].count++;byClient[c].valor+=r.valor||0;byClient[c].dur+=r.duration||0;
  });
  var clients=Object.keys(byClient).map(function(k){return Object.assign({name:k},byClient[k])}).sort(function(a,b){return b.valor-a.valor});
  var maxVal=clients.length?clients[0].valor:1;

  // Por mes (6 meses)
  var now=new Date();
  var months=[];
  for(var i=0;i<6;i++){
    var d=new Date(now.getFullYear(),now.getMonth()-(5-i),1);
    months.push({lbl:MONTHS[d.getMonth()]+"\n"+String(d.getFullYear()).slice(2),y:d.getFullYear(),m:d.getMonth(),count:0,valor:0});
  }
  all.forEach(function(r){
    var d=toDate(r.endTime||r.startTime);
    var mo=months.find(function(x){return x.y===d.getFullYear()&&x.m===d.getMonth()});
    if(mo){mo.count++;mo.valor+=r.valor||0}
  });

  var cm=now.getMonth(),cy=now.getFullYear(),pm=cm===0?11:cm-1,py=cm===0?cy-1:cy;
  var curM=all.filter(function(r){var d=toDate(r.endTime||r.startTime);return d.getMonth()===cm&&d.getFullYear()===cy});
  var prevM=all.filter(function(r){var d=toDate(r.endTime||r.startTime);return d.getMonth()===pm&&d.getFullYear()===py});
  var curVal=curM.reduce(function(a,r){return a+(r.valor||0)},0);
  var prevVal=prevM.reduce(function(a,r){return a+(r.valor||0)},0);
  var diff=curM.length-prevM.length;
  var diffVal=curVal-prevVal;

  var maxBarCount=Math.max.apply(null,months.map(function(m){return m.count}))||1;
  var maxBarVal=Math.max.apply(null,months.map(function(m){return m.valor}))||1;

  var barsCount='<div style="display:flex;gap:4px;height:130px;align-items:flex-end;padding-bottom:0">'+
    months.map(function(m){
      var pct=Math.round(m.count/maxBarCount*100);
      return'<div class="bar-col">'+
        '<div style="font-size:10px;font-weight:700;color:#374151;margin-bottom:2px">'+m.count+'</div>'+
        '<div class="bar-inner" style="height:'+(pct||0)+'%;min-height:'+(m.count>0?6:0)+'px;background:'+G+'"></div>'+
        '<div style="font-size:9px;color:#9ca3af;margin-top:4px;white-space:pre;text-align:center;line-height:1.2">'+m.lbl+'</div>'+
        '</div>';
    }).join("")+'</div>';

  var barsVal='<div style="display:flex;gap:4px;height:130px;align-items:flex-end">'+
    months.map(function(m){
      var pct=Math.round(m.valor/maxBarVal*100);
      var lbl=m.valor>=1000000?Math.round(m.valor/1000000)+"M":m.valor>=1000?Math.round(m.valor/1000)+"k":String(m.valor);
      return'<div class="bar-col">'+
        '<div style="font-size:9px;font-weight:700;color:#374151;margin-bottom:2px">'+lbl+'</div>'+
        '<div class="bar-inner" style="height:'+(pct||0)+'%;min-height:'+(m.valor>0?6:0)+'px;background:'+PU+'"></div>'+
        '<div style="font-size:9px;color:#9ca3af;margin-top:4px;white-space:pre;text-align:center;line-height:1.2">'+m.lbl+'</div>'+
        '</div>';
    }).join("")+'</div>';

  var clientsH=!clients.length?'<p style="color:#9ca3af;text-align:center;padding:12px">Sin datos en el rango</p>':
    clients.map(function(c,i){
      var pct=maxVal>0?Math.round(c.valor/maxVal*100):0;
      return'<div style="padding:12px;background:#f9fafb;border-radius:10px;margin-bottom:8px;border-left:4px solid '+COLORS[i%COLORS.length]+'">'+
        '<div class="row-sb" style="margin-bottom:6px">'+
        '<div><div style="font-weight:800;font-size:15px">'+e(c.name)+'</div>'+
        '<div style="font-size:12px;color:#6b7280;margin-top:2px"><span style="font-weight:700;color:'+G+'">'+c.count+'</span> limpiezas · prom '+fmt(c.count?Math.round(c.dur/c.count):0)+'</div>'+
        '<div style="font-size:11px;color:#9ca3af">'+(totalCount?Math.round(c.count/totalCount*100):0)+'% del total</div></div>'+
        '<div style="text-align:right"><div style="font-weight:900;color:'+PU+';font-size:16px">'+pesos(c.valor)+'</div></div></div>'+
        '<div style="background:#e5e7eb;border-radius:8px;height:6px"><div style="background:'+COLORS[i%COLORS.length]+';border-radius:8px;height:6px;width:'+pct+'%"></div></div>'+
        '</div>';
    }).join("")+
    '<div style="margin-top:8px;padding:12px;background:linear-gradient(135deg,'+PU+',#5b21b6);border-radius:10px;display:flex;justify-content:space-between;align-items:center">'+
    '<span style="font-weight:700;color:rgba(255,255,255,.85);font-size:14px">TOTAL</span>'+
    '<span style="font-weight:900;color:white;font-size:18px">'+pesos(totalVal)+'</span></div>';

  return'<div class="card">'+
    '<div style="font-weight:700;margin-bottom:10px;font-size:14px">📅 Rango de análisis</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
    '<div><div class="lbl">Desde</div><input type="date" class="inp" value="'+S.dashFrom+'" onchange="S.dashFrom=this.value;render()" style="margin:0"></div>'+
    '<div><div class="lbl">Hasta</div><input type="date" class="inp" value="'+S.dashTo+'" onchange="S.dashTo=this.value;render()" style="margin:0"></div>'+
    '</div></div>'+

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'+
    '<div class="sbox"><div class="sbox-val" style="color:'+G+'">'+totalCount+'</div><div class="sbox-lbl">Limpiezas</div></div>'+
    '<div class="sbox"><div class="sbox-val" style="color:'+PU+';font-size:16px">'+pesos(totalVal)+'</div><div class="sbox-lbl">Valor total</div></div>'+
    '</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">'+
    '<div class="sbox"><div class="sbox-val" style="color:'+O+';font-size:16px">'+fmt(avgDur)+'</div><div class="sbox-lbl">Duración prom.</div></div>'+
    '<div class="sbox"><div class="sbox-val" style="color:'+B+'">'+clients.length+'</div><div class="sbox-lbl">Clientes</div></div>'+
    '</div>'+

    '<div class="card">'+
    '<div style="font-weight:700;margin-bottom:12px;font-size:14px">📈 Mes actual vs anterior</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">'+
    '<div style="text-align:center;padding:14px;background:#f0fdf4;border-radius:12px">'+
    '<div style="font-size:11px;color:#6b7280;font-weight:700;margin-bottom:4px">MES ACTUAL</div>'+
    '<div style="font-size:38px;font-weight:900;color:'+G+'">'+curM.length+'</div>'+
    '<div style="font-size:13px;color:'+G+';font-weight:700">'+pesos(curVal)+'</div></div>'+
    '<div style="text-align:center;padding:14px;background:#f9fafb;border-radius:12px">'+
    '<div style="font-size:11px;color:#6b7280;font-weight:700;margin-bottom:4px">MES ANTERIOR</div>'+
    '<div style="font-size:38px;font-weight:900;color:#9ca3af">'+prevM.length+'</div>'+
    '<div style="font-size:13px;color:#9ca3af;font-weight:700">'+pesos(prevVal)+'</div></div>'+
    '</div>'+
    (prevM.length>0||curM.length>0?
      '<div style="padding:10px;background:'+(diff>=0?"#f0fdf4":"#fff1f2")+';border-radius:10px;text-align:center">'+
      '<div style="font-weight:700;color:'+(diff>=0?G:R)+';font-size:14px">'+(diff>=0?'▲ '+diff+' más':'▼ '+Math.abs(diff)+' menos')+' limpiezas vs mes anterior</div>'+
      (prevVal>0?'<div style="font-weight:700;color:'+(diffVal>=0?G:R)+';font-size:13px;margin-top:3px">'+(diffVal>=0?'▲ +':' ▼ ')+pesos(Math.abs(diffVal))+' en valor</div>':'')+
      '</div>':'')+'</div>'+

    '<div class="card"><div style="font-weight:700;margin-bottom:14px;font-size:14px">📊 Limpiezas por mes</div>'+barsCount+'</div>'+
    '<div class="card"><div style="font-weight:700;margin-bottom:14px;font-size:14px">💰 Valor por mes</div>'+barsVal+'</div>'+
    '<div class="card"><div style="font-weight:700;margin-bottom:12px;font-size:14px">👥 Por cliente (en rango)</div>'+clientsH+'</div>';
}

function tabConfig(){
  var isApts=S.settingsTab==="apts";
  // FORM EDICIÓN
  var formH="";
  if(S.editingApt){
    var ea=S.editingApt;
    formH='<div class="card" style="border:2px solid '+G+'">'+
      '<div style="font-weight:800;font-size:15px;margin-bottom:14px;color:'+G+'">'+(ea.idx===-1?"➕ Nuevo Apartamento":"✏️ Editar Apartamento")+'</div>'+
      '<div class="lbl">Nombre del Apartamento</div>'+
      '<input id="ea-name" class="inp" value="'+e(ea.name)+'" placeholder="Ej: 1103">'+
      '<div class="lbl">Cliente</div>'+
      '<input id="ea-client" class="inp" value="'+e(ea.client)+'" placeholder="Ej: TCG">'+
      '<div class="lbl">Valor del Servicio ($)</div>'+
      '<input id="ea-valor" type="number" class="inp" value="'+Number(ea.valor||0)+'" min="0" placeholder="0">'+
      '<button class="btn" onclick="saveEditApt()" style="background:'+G+';margin-top:4px">Guardar Cambios</button>'+
      '<button class="btn" onclick="cancelEditApt()" style="background:'+GR+'">Cancelar</button>'+
      '</div>';
  }

  var aptListH=S.aptList.map(function(a,idx){
    return'<div class="item-row">'+
      '<div style="flex:1">'+
      '<div style="font-weight:700;font-size:14px">'+e(a.name)+'</div>'+
      '<div style="display:flex;gap:6px;margin-top:5px;flex-wrap:wrap">'+
      (a.client?'<span class="chip" style="background:#eff6ff;color:'+B+'">'+e(a.client)+'</span>':'')+
      (a.valor>0?'<span class="chip" style="background:#f5f3ff;color:'+PU+'">'+pesos(a.valor)+'</span>':'<span class="chip" style="background:#f3f4f6;color:#9ca3af">Sin valor</span>')+
      '</div></div>'+
      '<div style="display:flex;gap:6px;flex-shrink:0">'+
      '<button onclick="openEditApt('+idx+')" class="btn-sm" style="background:#eff6ff;color:'+B+'">✏️ Editar</button>'+
      '<button onclick="delApt('+idx+')" class="btn-sm" style="background:#fff1f2;color:'+R+'">🗑️</button>'+
      '</div></div>';
  }).join("");

  var wListH=S.workerList.map(function(w,i){
    if(S.editingWorkerIdx===i){
      return'<div class="item-row">'+
        '<input id="edit-worker-inp" class="inp-sm" value="'+e(w)+'" style="flex:1;margin:0">'+
        '<div style="display:flex;gap:6px;margin-left:8px">'+
        '<button onclick="saveEditWorker()" class="btn-sm" style="background:'+G+';color:white">✓ Guardar</button>'+
        '<button onclick="S.editingWorkerIdx=-1;render()" class="btn-sm" style="background:'+GR+';color:white">✕</button>'+
        '</div></div>';
    }
    return'<div class="item-row">'+
      '<span style="font-size:14px;font-weight:500">'+e(w)+'</span>'+
      '<div style="display:flex;gap:6px">'+
      '<button onclick="startEditWorker('+i+')" class="btn-sm" style="background:#eff6ff;color:'+B+'">✏️ Editar</button>'+
      '<button onclick="delWorker('+i+')" class="btn-sm" style="background:#fff1f2;color:'+R+'">🗑️</button>'+
      '</div></div>';
  }).join("");

  return'<div class="tabs">'+
    '<button class="tab" onclick="S.settingsTab=\'apts\';S.editingApt=null;render()" style="background:'+(isApts?G:"transparent")+';color:'+(isApts?"white":"#6b7280")+'">🏠 Apartamentos ('+S.aptList.length+')</button>'+
    '<button class="tab" onclick="S.settingsTab=\'workers\';S.editingApt=null;render()" style="background:'+(!isApts?G:"transparent")+';color:'+(!isApts?"white":"#6b7280")+'">👤 Trabajadores ('+S.workerList.length+')</button>'+
    '</div>'+
    (isApts?
      (!S.editingApt?'<button class="btn" onclick="openEditApt(-1)" style="background:'+G+';margin-top:0;margin-bottom:10px">➕ Agregar Apartamento</button>':"")+
      formH+
      '<div class="card"><div class="lbl" style="margin-bottom:10px">Lista de Apartamentos</div>'+aptListH+'</div>'
      :
      '<div class="card">'+
      '<div class="lbl">Agregar Trabajador</div>'+
      '<div style="display:flex;gap:8px">'+
      '<input id="new-worker-inp" class="inp" placeholder="Nombre completo" style="flex:1;margin:0" onkeydown="if(event.key===\'Enter\')addWorker()">'+
      '<button onclick="addWorker()" style="background:'+G+';color:white;border:none;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer;font-size:18px">+</button>'+
      '</div></div>'+
      '<div class="card"><div class="lbl" style="margin-bottom:10px">Trabajadores Registrados</div>'+wListH+'</div>'
    );
}

// ══════════════════════════════════════════════════════════════════════
// PANTALLA SETTINGS (redirige a gerencia tab config)
// ══════════════════════════════════════════════════════════════════════
function screenSettings(){
  S.screen="gerencia"; S.dashTab="configuracion"; render();
}

// ── INIT ─────────────────────────────────────────────────────────────
loadConfig();
</script>
