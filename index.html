function fmt(s){return[Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(function(x){return String(x).padStart(2,"0")}).join(":")}
function fmtDate(d){try{return new Date(d).toLocaleDateString("es-CO",{day:"2-digit",month:"short",year:"numeric"})}catch(e){return""}}
function fmtHour(d){try{return new Date(d).toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
function nowTime(){return new Date().toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function pesos(v){return "$"+Number(v||0).toLocaleString("es-CO")}
function aptLabel(a){return a?a.name+" ("+a.client+")":""}
function toDate(t){if(!t)return new Date();if(t.toDate)return t.toDate();return new Date(t)}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

// Firebase
function loadConfig(){
  db.collection("config").doc("apartamentos").get().then(function(d){
    if(d.exists&&d.data().list&&d.data().list.length){
      var l=d.data().list;
      S.aptList=(typeof l[0]==="string")?DEF_APTS.slice():l;

    return db.collection("config").doc("trabajadores").get();
  }).then(function(d){

    S.screen="home";render();
  }).catch(function(){S.screen="home";render()});
}

function addDoc(data){return db.collection("limpiezas").add(data).then(function(r){return r.id})}
function patchDoc(id,data){if(!id)return;db.collection("limpiezas").doc(id).update(data).catch(function(){})}
function fetchRecs(){
  return db.collection("limpiezas").orderBy("startTime","desc").limit(500).get().then(function(snap){
    var docs=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    S.adminRecs=docs;S.allRecs=docs;render();
  }).catch(function(){})
}

// Dashboard calc
function getDashData(){
  var from=S.dashFrom?new Date(S.dashFrom+" 00:00:00"):null;
  var to=S.dashTo?new Date(S.dashTo+" 23:59:59"):null;
  var completed=S.allRecs.filter(function(r){
    if(r.status!=="completed")return false;
    var d=toDate(r.endTime||r.startTime);
    if(from&&d<from)return false;
    if(to&&d>to)return false;
    return true;
  });
  var byC={};
  completed.forEach(function(r){
    var c=r.client||"Sin cliente";
    if(!byC[c])byC[c]={client:c,count:0,valor:0,dur:0};
    byC[c].count++;byC[c].valor+=r.valor||0;byC[c].dur+=r.duration||0;
  });
  var clients=Object.values(byC).sort(function(a,b){return b.count-a.count});
  var now=new Date();
  var months=[];
  for(var i=0;i<6;i++){
    var d=new Date(now.getFullYear(),now.getMonth()-(5-i),1);
    months.push({label:MONTHS[d.getMonth()]+" "+String(d.getFullYear()).slice(2),year:d.getFullYear(),month:d.getMonth(),count:0,valor:0});
  }
  S.allRecs.filter(function(r){return r.status==="completed"}).forEach(function(r){
    var d=toDate(r.endTime||r.startTime);
    var m=months.find(function(x){return x.year===d.getFullYear()&&x.month===d.getMonth()});
    if(m){m.count++;m.valor+=r.valor||0}
  });
  var totalValor=completed.reduce(function(a,r){return a+(r.valor||0)},0);
  var totalCount=completed.length;
  var avgDur=totalCount?Math.round(completed.reduce(function(a,r){return a+(r.duration||0)},0)/totalCount):0;
  var cm=now.getMonth(),cy=now.getFullYear(),pm=cm===0?11:cm-1,py=cm===0?cy-1:cy;
  var curD=S.allRecs.filter(function(r){if(r.status!=="completed")return false;var d=toDate(r.endTime||r.startTime);return d.getMonth()===cm&&d.getFullYear()===cy});
  var prevD=S.allRecs.filter(function(r){if(r.status!=="completed")return false;var d=toDate(r.endTime||r.startTime);return d.getMonth()===pm&&d.getFullYear()===py});
  return{completed:completed,clients:clients,months:months,totalValor:totalValor,totalCount:totalCount,avgDur:avgDur,curD:curD,prevD:prevD};
}

function sDashboard(){
  var data=getDashData();
  var completed=data.completed,clients=data.clients,months=data.months;
  var totalValor=data.totalValor,totalCount=data.totalCount,avgDur=data.avgDur;
  var curD=data.curD,prevD=data.prevD;
  var curValor=curD.reduce(function(a,r){return a+(r.valor||0)},0);
  var prevValor=prevD.reduce(function(a,r){return a+(r.valor||0)},0);
  var diff=curD.length-prevD.length;
  var diffPct=prevD.length>0?Math.round((Math.abs(diff)/prevD.length)*100):0;
  var maxCount=Math.max.apply(null,months.map(function(m){return m.count}))||1;
  var maxValor=Math.max.apply(null,months.map(function(m){return m.valor}))||1;
  var barsCount=months.map(function(m){
    var pct=Math.round(m.count/maxCount*100);
    return'<div style="text-align:center;flex:1">'+
      '<div style="height:120px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px">'+
      '<div style="width:28px;background:'+G+';border-radius:4px 4px 0 0;height:'+pct+'%;min-height:'+(m.count>0?8:0)+'px"></div></div>'+
      '<div style="font-size:11px;color:#111827;font-weight:700">'+m.count+'</div>'+
      '<div style="font-size:9px;color:#9ca3af">'+m.label+'</div></div>';
  }).join("");
  var barsValor=months.map(function(m){
    var pct=Math.round(m.valor/maxValor*100);
    return'<div style="text-align:center;flex:1">'+
      '<div style="height:120px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px">'+
      '<div style="width:28px;background:'+PU+';border-radius:4px 4px 0 0;height:'+pct+'%;min-height:'+(m.valor>0?8:0)+'px"></div></div>'+
      '<div style="font-size:10px;color:#111827;font-weight:700">'+(m.valor>=1000?Math.round(m.valor/1000)+"k":m.valor)+'</div>'+
      '<div style="font-size:9px;color:#9ca3af">'+m.label+'</div></div>';
  }).join("");
  var maxClientCount=clients.length?clients[0].count:1;
  var clientsH=!clients.length?'<p style="color:#9ca3af;text-align:center;padding:12px">Sin datos en el rango</p>':
    clients.map(function(c,i){
      var pct=Math.round(c.count/maxClientCount*100);

        '<div style="text-align:right"><div style="font-weight:900;color:'+PU+';font-size:15px">'+pesos(c.valor)+'</div></div></div>'+
        '<div class="bar-wrap"><div class="bar-fill" style="width:'+pct+'%;background:'+COLORS[i%COLORS.length]+'">'+c.count+'</div></div>'+
        '</div>';
    }).join("")+

  return'<div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">'+

    '<button onclick="fetchRecs().then(render)" style="background:white;border:1px solid #e5e7eb;border-radius:9px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:700">Actualizar</button></div>'+

    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">'+
    '<div class="sbox"><div style="font-weight:900;color:'+G+';font-size:22px">'+totalCount+'</div><div style="font-size:11px;color:#6b7280;font-weight:700">TOTAL LIMPIEZAS</div></div>'+
    '<div class="sbox"><div style="font-weight:900;color:'+PU+';font-size:16px">'+pesos(totalValor)+'</div><div style="font-size:11px;color:#6b7280;font-weight:700">TOTAL VALOR</div></div></div>'+

    '<div class="card"><div style="font-weight:700;margin-bottom:16px;font-size:14px">Limpiezas por Mes</div><div style="display:flex;align-items:flex-end;gap:4px;height:150px">'+barsCount+'</div></div>'+

    '<div class="card"><div style="font-weight:700;margin-bottom:12px;font-size:14px">Por Cliente</div>'+clientsH+'</div>';
}

</script>
