# Compila el APK de Android y lo deja en /descargas/limpieza-pro.apk para descarga directa.
# Corre cuando cambia algo en android/ o a mano desde la pestaña Actions.
name: APK Android
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: false }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Llave de firma
        env: { KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" }
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then echo "::error::Falta el secreto ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)"; exit 1; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android/firma.jks.enc -out android/firma.jks -pass env:KEYSTORE_PASSWORD
      - name: Compilar APK
        working-directory: android
        env: { KEYSTORE_PASSWORD: "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" }
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Verificar firma
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee firma.txt
          grep -qi "71ca0c80e8f2092e1b6775d70cf5c012d69810a96455cc3f69480ed10df2ea84" firma.txt
      - name: Publicar en descargas
        run: |
          rm -f android/firma.jks
          git pull --ff-only
          mkdir -p descargas
          cp android/app/build/outputs/apk/release/app-release.apk descargas/limpieza-pro.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add descargas/limpieza-pro.apk
          git diff --cached --quiet || (git commit -m "APK Android v1.0.${GITHUB_RUN_NUMBER}" && git push)
